<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>옥수동 화덕피자</title>
<meta name="description" content="옥수동 화덕피자 — 골목 안 작은 화덕에서 시작되는 따뜻한 한 조각." />
<link rel="preload" as="image" href="./assets/pizza00.png" fetchpriority="high" />
<link rel="icon" href="../images/favicon.ico" sizes="any" />
<link rel="icon" type="image/svg+xml" href="../images/mark.svg" />
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png" />
<style>
/* ============================================================
   옥수동 화덕피자 — 인터랙티브 랜딩
   구조: 앰비언트(흐린 배경) → 스테이지(정사각 영상/이미지) → UI 레이어
   ============================================================ */

:root{
  color-scheme: dark;

  --bg:#0d0907;
  --text:#fff5e6;
  --muted:#c8ae90;
  --fire:#f6a04d;
  --ember:#d85d32;
  --dough:#f4d7a1;
  --line:rgba(255,226,178,.16);
  --glass:rgba(28,19,13,.62);

  /* 스테이지 한 변의 길이. 에셋이 1:1 이라 정사각으로 다룬다 */
  --stage: min(88vh, 74vw);
  --stage-y: 46%;

  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --pad: clamp(.9rem, 2.4vw, 2rem);
}

@media (orientation: portrait){
  :root{
    --stage: max(100vw, 54vh);
    /* 아래쪽 정보 패널이 피자를 덮지 않도록 스테이지를 위로 올린다 */
    --stage-y: 36%;
  }
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:"Noto Sans KR", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

:focus-visible{
  outline:2px solid var(--fire);
  outline-offset:3px;
  border-radius:.4rem;
}

.app{
  position:fixed;
  inset:0;
  height:100dvh;
}

/* ---------- 1. 앰비언트 배경 ---------- */

.ambient{position:absolute;inset:0;overflow:hidden;background:#0d0907}
.ambient-img{
  position:absolute;
  inset:-12%;
  width:124%;
  height:124%;
  object-fit:cover;
  filter:blur(72px) saturate(1.5) brightness(.62);
  opacity:0;
  transform:scale(1.06);
  transition:opacity 1.1s var(--ease);
  will-change:opacity;
}
.ambient-img.on{opacity:.85}

.ambient-tint{
  position:absolute;inset:0;
  background:
    radial-gradient(circle at 50% 32%, rgba(246,160,77,.20), transparent 55%),
    radial-gradient(circle at 50% 105%, rgba(216,93,50,.22), transparent 60%),
    linear-gradient(180deg, rgba(10,7,5,.72) 0%, rgba(10,7,5,.30) 34%, rgba(8,6,4,.80) 100%);
}

/* 화덕 불빛 맥동 */
.ambient-fire{
  position:absolute;
  left:50%;top:34%;
  width:min(70vw,760px);
  aspect-ratio:1;
  translate:-50% -50%;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,150,60,.30), transparent 62%);
  mix-blend-mode:screen;
  animation:firePulse 6.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes firePulse{
  0%,100%{opacity:.45;transform:scale(1)}
  50%    {opacity:.85;transform:scale(1.09)}
}

/* 떠오르는 불티 */
.embers{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ember{
  position:absolute;
  bottom:-4vh;
  width:3px;height:3px;
  border-radius:50%;
  background:var(--fire);
  box-shadow:0 0 8px 2px rgba(246,160,77,.55);
  opacity:0;
  animation:emberRise linear infinite;
}
@keyframes emberRise{
  0%  {opacity:0; transform:translate(0,0) scale(.5)}
  12% {opacity:.75}
  70% {opacity:.5}
  100%{opacity:0; transform:translate(var(--dx,20px), -108vh) scale(1.1)}
}

/* ---------- 2. 스테이지 ---------- */

.stage{
  position:absolute;
  left:50%;
  top:var(--stage-y);
  width:var(--stage);
  height:var(--stage);
  translate:-50% -50%;
  overflow:hidden;
  border-radius:clamp(0px, 1.2vw, 22px);
  /* 빈 홀 사진의 40x40 축소본을 CSS 에 인라인으로 박아 둔다(약 1.2KB).
     네트워크를 타지 않으므로 첫 페인트부터 무조건 보이고, 원본이 도착하면 그 위에 덮인다.
     tools/make_lqip.py 로 다시 만든다. */
  background:
    url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD//gAQTGF2YzYxLjE5LjEwMAD/2wBDAAgMDA4MDhAQEBAQEBMSExQUFBMTExMUFBQVFRUZGRkVFRUUFBUVGBgZGRscGxoaGRocHB4eHiQkIiIqKiszMz7/xACIAAADAQEBAQAAAAAAAAAAAAAFBgMCBAEHAQACAwEAAAAAAAAAAAAAAAACBAMFAQAQAAIBAwIFAwEIAwEAAAAAAAECEQAhAxIEUTETIkFxYYEFoZHBsTIjFNFzguEzEQABBAAFAgUFAQEAAAAAAAABABEhAjFRQQMSE3GxYTKRgaHBIuFyQvD/wAARCAAoACgDARIAAhIAAxIA/9oADAMBAAIRAxEAPwBT2RKbnbwdPesmdNuBPDjaqbZSM2I6T2uOfL7zNviltyalZaw44hObRIsFtK254HXROOVtllwPqYsxdgqmYDebkchPg10p0VwbjIwhhkbphTBMgCwHi1+NJNuCwwaEdntYAYMCX7J5wQoqmJDSfFIe6waNOjUQQDBIMc6cArHKqKMKDQpfLkx9Qkss6VXwqi1qZpaVX2twGBsT5sO5KC4JGpVgKm7l+IEAan9INtPp3WxlhJhNZuoHOIuDejiYkdsXccIcvOgHRrS0wbhW5weVNXuKt5llEJltNWf/AIJUAo7xBOBZwlfSG3KKzMVCtFmYjgALe3tX0UfT9uq9TrfKJj1E+1iaar6Sw1UFbHI+/wCkuT+clEY0dC828xY8IOLDhIbUrahEAiO0itdHG+1CNiDAR3A+pmQfyoBU2/0zeyC+4auHa328EFLvmVNtbYh8PafFJeTNtmBCYMyPztk/bHoI1R7TTK+y2UAjHeL9z/3TDXxNqt2lVw3dzP6BZ+OHGyd6VMklZlztknEbQPJAmPFNH8fCOQj5NXYYAOH+FVDdvmqi3I2LFvlWvSpkggYrtkLyW19wLEfbNGDtcDqQQ8+Ib/lWNxMR8JHq3SO2WrMl8030qKGDJ9PCkZsm4V7gKGaCT+mGH41sbTGWBY5I9VItwlakNdzQA+yHqWaAPqo+VRDtLS6l4AnE/Qo3j3eQbPogIAGHcSS0enLkOPxQ9f8AyPqKisak+mSMdO6A+oLK7Z5cuUZfZT1wWy1Q41jIkSFea6j5NcyNc6xU1Reaia0QVoQmQuK7WyMV0T23yL/sBN/ap+E/xGp7SMPMdkWX8lLUgu/ke4wQ6n+wv//Z") center / cover no-repeat,
    linear-gradient(180deg, #241609 0%, #35210f 55%, #5c3a1d 100%);
  box-shadow:
    0 0 0 1px rgba(255,226,178,.10),
    0 40px 120px -20px rgba(0,0,0,.85),
    0 0 160px -40px rgba(246,160,77,.45);
  contain:paint;
}
@media (orientation:portrait){
  .stage{border-radius:0;box-shadow:0 30px 90px -20px rgba(0,0,0,.8)}
}

/* 켄번즈: 아주 느린 호흡. img/video 가 함께 스케일되므로 어긋남이 없다 */
.stage-inner{
  position:absolute;inset:0;
  animation:breathe 26s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes breathe{
  from{transform:scale(1)}
  to  {transform:scale(1.028)}
}
.stage.impact .stage-inner{animation:impact .5s var(--ease-out)}
@keyframes impact{
  0%{transform:scale(1)}
  38%{transform:scale(1.009)}
  100%{transform:scale(1)}
}

/* 이미지와 비디오는 정확히 같은 박스를 차지한다 */
.layer{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:50% 50%;
  display:block;
}
#stillA,#stillB{
  transition:opacity .42s var(--ease);
  z-index:1;
}
/* 인라인 축소본(.stage 배경) 위로 원본이 도착하면 부드럽게 겹쳐 뜬다.
   whenBaseReady() 가 어떤 경로로든 반드시 1 로 올려 준다. */
#stillA,#stillB{opacity:0}

/* 영상이 멈춘 순간의 실제 프레임을 떠 두는 캔버스.
   iOS 는 정지된 <video> 의 프레임을 버리거나 poster 를 다시 띄우는 경우가 있는데,
   그때 밑에 깔린 그림이 영상과 조금이라도 다르면 화면이 튄다.
   PNG 대신 영상에서 직접 뜬 프레임을 깔면 픽셀이 같아 무엇이 드러나도 티가 나지 않는다. */
#frameHold{
  z-index:2;
  opacity:0;
  transition:opacity .3s linear;
}
#frameHold.show{opacity:1}
#frameHold.instant{transition:none}
/* 정방향과 역방향에 각각 전용 <video> 를 둔다.
   하나짜리로 src 를 갈아끼우면 iOS(WebKit)가 요소를 즉시 비우고 poster 를 띄우는데,
   그 PNG 와 영상 마지막 프레임은 인코딩이 달라 전환 순간에 그림이 튀었다.
   역방향은 정방향 위에 겹쳐 두고 불투명해지기만 하면 되므로 빈 구간이 없다. */
#stageVideo,#stageVideoRev{
  opacity:0;
  transition:opacity .28s linear;
  background:transparent;
}
#stageVideo{z-index:3}
#stageVideoRev{z-index:4}
#stageVideo.show,#stageVideoRev.show{opacity:1}
/* 즉시 나타나거나 즉시 걷혀야 하는 순간에는 페이드를 끈다.
   특히 정방향은 되감기가 끝난 뒤 "피자가 놓인" 낡은 프레임을 들고 있으므로,
   페이드로 걷으면 그 그림이 드러났다가 사라진다. 반드시 즉시 걷어야 한다. */
#stageVideo.instant,#stageVideoRev.instant{transition:none}

.stage-vignette{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(20,10,4,.42) 100%),
    linear-gradient(180deg, rgba(12,8,5,.34) 0%, transparent 22%, transparent 62%, rgba(10,6,4,.5) 100%);
}

/* ---------- 첫 화면 중앙 로크업 (IDLE 전용) ---------- */

/* 피자가 놓일 자리에 미리 그려 두는 "빈 접시" */
.hero{
  position:absolute;
  left:50%; top:50%;
  translate:-50% -50%;
  z-index:6;
  width:calc(var(--stage) * .56);
  aspect-ratio:1;
  display:grid;
  place-content:center;
  gap:calc(var(--stage) * .012);
  text-align:center;
  opacity:0;
  visibility:hidden;
  /* 사라지는 도중에 버튼이 클릭을 가로채지 않도록 즉시 차단한다 */
  pointer-events:none;
  transform:scale(1.06);
  transition:opacity .38s var(--ease), transform .5s var(--ease-out), visibility 0s .38s;
}
.stage.idle .hero{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transform:none;
  transition:opacity .8s var(--ease) .25s, transform .9s var(--ease-out) .25s, visibility 0s;
}

/* 나무 테이블 위에서 크림색 글자가 읽히도록 깔아 주는 그늘 */
.hero-scrim{
  position:absolute;inset:-10%;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(26,14,7,.66) 0%, rgba(26,14,7,.46) 46%, transparent 72%);
  pointer-events:none;
}

.hero-ring{
  position:absolute;inset:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:visible;
}
.hero-ring circle{
  fill:none;
  stroke:rgba(255,208,140,.42);
  stroke-width:.5;
  vector-effect:non-scaling-stroke;
}
.hero-ring .dash{
  stroke:rgba(246,160,77,.55);
  stroke-dasharray:2 6;
  transform-origin:50% 50%;
  animation:ringSpin 44s linear infinite;
}
@keyframes ringSpin{to{transform:rotate(360deg)}}

.hero > *:not(.hero-scrim):not(.hero-ring){position:relative;z-index:1}

.hero-kicker{
  font-size:max(.6rem, calc(var(--stage) * .0165));
  font-weight:800;
  letter-spacing:.26em;
  text-indent:.26em;
  color:var(--fire);
  text-shadow:0 2px 12px rgba(0,0,0,.8);
}

.hero-title{
  margin:0;
  font-family:ui-serif, Georgia, "Nanum Myeongjo", serif;
  font-size:max(1.35rem, calc(var(--stage) * .058));
  font-weight:700;
  line-height:1.1;
  letter-spacing:-.02em;
  color:var(--text);
  text-shadow:0 3px 20px rgba(0,0,0,.85);
  overflow:hidden;
}
.hero-title span{
  display:block;
  transform:translateY(105%);
  transition:transform .5s var(--ease-out);
}
.stage.idle .hero-title span{
  transform:none;
  transition:transform .9s var(--ease-out) .35s;
}

.hero-rule{
  justify-self:center;
  width:calc(var(--stage) * .1);
  height:1px;
  margin:calc(var(--stage) * .012) 0;
  background:linear-gradient(90deg, transparent, rgba(246,160,77,.85), transparent);
  transform:scaleX(0);
  transition:transform .4s var(--ease-out);
}
.stage.idle .hero-rule{transform:scaleX(1);transition:transform .8s var(--ease-out) .5s}

/* 메뉴 이름 자동 순환 — 누르면 그 메뉴가 바로 재생된다 */
.hero-cycle{
  justify-self:center;
  padding:.3rem .7rem;
  border-radius:999px;
  font-size:max(.72rem, calc(var(--stage) * .0215));
  font-weight:700;
  letter-spacing:.02em;
  white-space:nowrap;
  color:var(--dough);
  text-shadow:0 2px 12px rgba(0,0,0,.8);
  transition:opacity .22s var(--ease), transform .22s var(--ease), background .2s, color .2s;
}
.hero-cycle::after{
  content:"";
  display:block;
  height:1px;
  margin-top:.16rem;
  background:currentColor;
  opacity:0;
  transition:opacity .2s;
}
.hero-cycle:hover{background:rgba(246,160,77,.14);color:#ffe0b4}
.hero-cycle:hover::after{opacity:.5}
.hero-cycle.swap{opacity:0;transform:translateY(-7px)}

/* 접시 링: 피자가 놓이는 위치에서 얇게 퍼진다 */
.plate-ring{
  position:absolute;
  left:50%; top:79%;
  width:60%; aspect-ratio:1;
  translate:-50% -50%;
  z-index:7;
  pointer-events:none;
  opacity:0;
}
.plate-ring circle{
  fill:none;
  stroke:rgba(255,214,150,.85);
  stroke-width:.6;
  vector-effect:non-scaling-stroke;
}
.stage.plated .plate-ring{animation:ringOut 1.15s var(--ease-out) forwards}
@keyframes ringOut{
  0%  {opacity:0;   transform:scale(.55)}
  22% {opacity:.95}
  100%{opacity:0;   transform:scale(1.22)}
}

/* 전환 순간의 열기 번짐 */
.shimmer{
  position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 50% 72%, rgba(255,178,96,.55), rgba(255,140,60,.12) 42%, transparent 70%);
}
.shimmer.flash{animation:flash .46s var(--ease-out)}
@keyframes flash{
  0%{opacity:0}
  28%{opacity:.9}
  100%{opacity:0}
}

/* ---------- 3. 브랜드 헤더 ---------- */

.brand{
  position:absolute;
  top:var(--pad); left:var(--pad);
  z-index:20;
  display:flex; align-items:center; gap:.7rem;
  animation:fadeDown .9s var(--ease-out) both .15s;
}
.brand-mark{
  width:2.6rem;height:2.6rem;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:.7rem;
  background:var(--glass);
  backdrop-filter:blur(14px);
  flex:none;
}
.brand-mark svg{width:1.35rem;height:1.35rem;stroke:var(--fire);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.brand-text h1{
  display:block;
  margin:0;
  font-size:clamp(.92rem,2.4vw,1.06rem);
  font-weight:800;
  letter-spacing:-.01em;
  text-shadow:0 2px 14px rgba(0,0,0,.7);
}
.brand-text span{
  display:block;
  font-size:.66rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ---------- 4. 우측 상단 유틸 ---------- */

.utils{
  position:absolute;
  top:var(--pad); right:var(--pad);
  z-index:20;
  display:flex; gap:.35rem;
  padding:.3rem;
  border:1px solid var(--line);
  border-radius:.75rem;
  background:var(--glass);
  backdrop-filter:blur(14px);
  animation:fadeDown .9s var(--ease-out) both .25s;
}
.util{
  width:2.15rem;height:2.15rem;
  display:grid;place-items:center;
  border-radius:.5rem;
  color:#f0cfa2;
  transition:background .2s, color .2s, transform .2s;
}
.util:hover{background:var(--fire);color:#1a100a;transform:translateY(-1px)}
.util svg{width:1.05rem;height:1.05rem;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.util .on-muted{display:block}
.util .on-live{display:none}
.util[aria-pressed="true"] .on-muted{display:none}
.util[aria-pressed="true"] .on-live{display:block}

/* 언어 토글 — 자주 쓰는 전환이라 메뉴에 숨기지 않고 상시 노출한다 */
.lang{
  display:flex;
  align-items:center;
  padding:.15rem;
  border-radius:.5rem;
  background:rgba(255,247,230,.06);
}
.lang button{
  padding:.3rem .45rem;
  border-radius:.38rem;
  font-size:.68rem;
  font-weight:800;
  letter-spacing:.06em;
  color:#b0977a;
  transition:background .2s, color .2s;
}
.lang button:hover{color:#f0cfa2}
.lang button[aria-pressed="true"]{
  background:var(--fire);
  color:#1a100a;
}
.lang i{
  width:1px;height:.85rem;
  background:var(--line);
  flex:none;
}

@keyframes fadeDown{
  from{opacity:0;transform:translateY(-12px)}
  to  {opacity:1;transform:none}
}

/* ---------- 5. 메뉴 정보 패널 ---------- */

.info{
  position:absolute;
  z-index:15;
  left:var(--pad);
  bottom:calc(var(--pad) + 6.2rem);
  width:min(30vw, 400px);
  min-width:min(300px, calc(100vw - 2 * var(--pad)));
  pointer-events:none;
}
.info > *{pointer-events:auto}

/* 유리 패널 */
.info-panel{
  position:relative;
  padding:1.1rem 1.15rem 1.2rem;
  border:1px solid var(--line);
  border-radius:1rem;
  background:linear-gradient(160deg, rgba(40,27,18,.72), rgba(20,13,9,.66));
  backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 26px 70px -18px rgba(0,0,0,.75);
  overflow:hidden;

  opacity:0;
  transform:translateY(26px) scale(.985);
  transition:opacity .5s var(--ease-out), transform .55s var(--ease-out);
}
.info.step-1 .info-panel{opacity:1;transform:none}

/* 패널 위를 스치는 빛 */
.info-panel::after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(105deg, transparent 30%, rgba(255,220,170,.14) 47%, transparent 62%);
  transform:translateX(-130%);
  pointer-events:none;
}
.info.step-1 .info-panel::after{animation:sweep 1.5s var(--ease-out) .25s}
@keyframes sweep{to{transform:translateX(130%)}}

/* 큰 번호 (배경 고스트) */
.info-num{
  position:absolute;
  right:.5rem; top:-.35rem;
  font-size:4.6rem;
  font-weight:900;
  line-height:1;
  color:rgba(246,160,77,.13);
  letter-spacing:-.05em;
  opacity:0;
  transform:translateY(14px);
  transition:opacity .7s var(--ease-out) .06s, transform .8s var(--ease-out) .06s;
}
.info.step-1 .info-num{opacity:1;transform:none}

.info-kicker{
  display:flex;align-items:center;gap:.5rem;
  margin-bottom:.42rem;
  font-size:.68rem;font-weight:800;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--fire);
  opacity:0;transform:translateY(10px);
  transition:opacity .45s var(--ease-out) .04s, transform .5s var(--ease-out) .04s;
}
.info.step-1 .info-kicker{opacity:1;transform:none}
.info-kicker i{
  width:1.4rem;height:1px;
  background:currentColor;
  transform-origin:left;
  transform:scaleX(0);
  transition:transform .6s var(--ease-out) .18s;
  font-style:normal;
}
.info.step-1 .info-kicker i{transform:scaleX(1)}

/* 제목: 아래에서 밀려 올라오는 마스크 리빌 */
.info-title{
  margin:0;
  font-family:ui-serif, Georgia, "Nanum Myeongjo", serif;
  font-size:clamp(1.55rem, 3.4vw, 2.1rem);
  font-weight:700;
  line-height:1.12;
  letter-spacing:-.015em;
  overflow:hidden;
}
.info-title span{
  display:block;
  transform:translateY(105%);
  transition:transform .72s var(--ease-out) .1s;
}
.info.step-1 .info-title span{transform:none}

.info-ko{
  margin:.18rem 0 0;
  font-size:.86rem;
  color:var(--dough);
  letter-spacing:.02em;
  opacity:0;transform:translateY(10px);
  transition:opacity .5s var(--ease-out) .22s, transform .5s var(--ease-out) .22s;
}
.info.step-1 .info-ko{opacity:1;transform:none}

.info-tagline{
  margin:.72rem 0 0;
  font-size:.94rem;
  line-height:1.5;
  color:#f1dcc0;
  word-break:keep-all;
  opacity:0;transform:translateY(12px);
  transition:opacity .5s var(--ease-out), transform .55s var(--ease-out);
}
.info.step-2 .info-tagline{opacity:1;transform:none}

/* 재료 태그: 순차 등장 */
.info-tags{
  display:flex;flex-wrap:wrap;gap:.35rem;
  margin:.8rem 0 0;padding:0;list-style:none;
}
.info-tags li{
  padding:.32rem .6rem;
  border:1px solid rgba(255,226,178,.2);
  border-radius:999px;
  background:rgba(246,160,77,.09);
  font-size:.73rem;font-weight:700;
  color:var(--dough);
  white-space:nowrap;
  opacity:0;
  transform:translateY(9px) scale(.9);
  transition:opacity .34s var(--ease-out), transform .42s var(--ease-out);
}
.info.step-3 .info-tags li{opacity:1;transform:none}
.info.step-3 .info-tags li:nth-child(1){transition-delay:0s}
.info.step-3 .info-tags li:nth-child(2){transition-delay:.08s}
.info.step-3 .info-tags li:nth-child(3){transition-delay:.16s}
.info.step-3 .info-tags li:nth-child(4){transition-delay:.24s}

/* 설명: 얇은 선이 좌우로 펼쳐진 뒤 문장이 뜬다 */
.info-rule{
  height:1px;margin:.85rem 0 .7rem;
  background:linear-gradient(90deg, rgba(246,160,77,.7), rgba(255,226,178,.05));
  transform:scaleX(0);transform-origin:left;
  transition:transform .6s var(--ease-out);
}
.info.step-4 .info-rule{transform:scaleX(1)}

.info-desc{
  margin:0;
  font-size:.83rem;
  line-height:1.65;
  color:var(--muted);
  word-break:keep-all;
  opacity:0;transform:translateY(8px);
  transition:opacity .5s var(--ease-out) .12s, transform .5s var(--ease-out) .12s;
}
.info.step-4 .info-desc{opacity:1;transform:none}

.info-foot{
  display:flex;align-items:center;justify-content:space-between;gap:.6rem;
  margin-top:.95rem;
}
.info-price{
  font-size:.95rem;font-weight:800;
  color:var(--text);
  opacity:0;transform:translateY(8px);
  transition:opacity .4s var(--ease-out), transform .45s var(--ease-out);
}
.info.step-5 .info-price{opacity:1;transform:none}
.info-price small{font-size:.68rem;font-weight:600;color:var(--muted);margin-left:.2rem}

.info-actions{display:flex;gap:.4rem}
.btn{
  padding:.56rem .85rem;
  border:1px solid rgba(255,226,178,.22);
  border-radius:.6rem;
  font-size:.78rem;font-weight:800;
  background:rgba(255,247,230,.07);
  transition:background .2s, transform .2s, border-color .2s, opacity .4s var(--ease-out);
  opacity:0;transform:translateY(8px);
}
.btn.primary{background:var(--fire);color:#1d1108;border-color:transparent}
.btn:hover{transform:translateY(-2px)}
.btn.primary:hover{background:#ffcb85}
.btn:not(.primary):hover{background:rgba(255,247,230,.14);border-color:rgba(246,160,77,.5)}
.info.step-5 .btn{opacity:1;transform:none}
.info.step-5 .btn:nth-child(2){transition-delay:.07s}

/* 퇴장은 빠르게 */
.info.leaving .info-panel,
.info.leaving .info-num,
.info.leaving .info-kicker,
.info.leaving .info-kicker i,
.info.leaving .info-title span,
.info.leaving .info-ko,
.info.leaving .info-tagline,
.info.leaving .info-tags li,
.info.leaving .info-rule,
.info.leaving .info-desc,
.info.leaving .info-price,
.info.leaving .btn{
  transition-duration:.2s !important;
  transition-delay:0s !important;
}
.info.leaving .info-panel{transform:translateY(14px) scale(.99)}

/* ---------- 6. 메뉴 레일 ---------- */

.rail-wrap{
  position:absolute;
  left:0;right:0;
  bottom:calc(var(--pad) * .7);
  z-index:18;
  display:flex;justify-content:center;
  padding-inline:var(--pad);
  animation:fadeUp 1s var(--ease-out) both .35s;
}
.rail{
  display:flex;gap:.3rem;
  max-width:100%;
  padding:.34rem;
  border:1px solid var(--line);
  border-radius:1rem;
  background:var(--glass);
  backdrop-filter:blur(18px) saturate(1.2);
  box-shadow:0 22px 60px -18px rgba(0,0,0,.75);
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.rail::-webkit-scrollbar{display:none}

.chip{
  position:relative;
  flex:none;
  scroll-snap-align:center;
  display:flex;flex-direction:column;align-items:flex-start;gap:.08rem;
  min-width:5.4rem;
  padding:.5rem .72rem .55rem;
  border-radius:.72rem;
  color:var(--muted);
  text-align:left;
  transition:color .25s, background .25s, transform .25s var(--ease-out);
  isolation:isolate;
}
.chip:hover{color:var(--text);transform:translateY(-3px)}
.chip b{
  font-size:.62rem;font-weight:800;letter-spacing:.14em;
  opacity:.8;
}
.chip span{
  font-size:.8rem;font-weight:700;white-space:nowrap;
  letter-spacing:-.01em;
}
.chip.active{color:#22150c}
.chip.active b{opacity:.7}

/* 활성 표시 알약: 위치가 미끄러진다 */
.rail-pill{
  position:absolute;
  z-index:-1;
  top:0;left:0;
  height:0;width:0;
  border-radius:.72rem;
  background:linear-gradient(140deg, #ffc97f, var(--fire));
  box-shadow:0 6px 22px -4px rgba(246,160,77,.65);
  opacity:0;
  transition:transform .45s var(--ease-out), width .45s var(--ease-out), height .45s var(--ease-out), opacity .3s;
  pointer-events:none;
}
.rail-pill.on{opacity:1}

/* 진행 링 */
.chip-progress{
  position:absolute;
  right:.4rem;top:.4rem;
  width:.85rem;height:.85rem;
  opacity:0;
  transition:opacity .25s;
  transform:rotate(-90deg);
}
.chip.loading-progress .chip-progress{opacity:.85}
.chip-progress circle{
  fill:none;stroke-width:2.6;
  cx:8;cy:8;r:6.5;
}
.chip-progress .bg{stroke:rgba(34,21,12,.28)}
.chip-progress .fg{
  stroke:#2b1a0d;
  stroke-linecap:round;
  stroke-dasharray:40.84;
  stroke-dashoffset:calc(40.84 * (1 - var(--p, 0)));
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to  {opacity:1;transform:none}
}

/* ---------- 7. 힌트 / 로더 ---------- */

.hint{
  position:absolute;
  left:50%;
  bottom:calc(var(--pad) * .7 + 4.6rem);
  translate:-50% 0;
  z-index:17;
  padding:.4rem .8rem;
  border:1px solid var(--line);
  border-radius:999px;
  background:rgba(20,13,9,.6);
  backdrop-filter:blur(10px);
  font-size:.72rem;font-weight:600;
  color:var(--dough);
  white-space:nowrap;
  animation:hintPulse 2.6s ease-in-out infinite, fadeUp .8s var(--ease-out) both .8s;
  transition:opacity .4s, transform .4s;
}
.hint.gone{opacity:0;transform:translateY(8px);pointer-events:none}
@keyframes hintPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(246,160,77,.28)}
  60%    {box-shadow:0 0 0 10px rgba(246,160,77,0)}
}

.loader{
  position:absolute;
  left:50%;top:50%;
  translate:-50% -50%;
  z-index:16;
  width:2.6rem;height:2.6rem;
  border-radius:50%;
  border:2px solid rgba(255,226,178,.16);
  border-top-color:var(--fire);
  opacity:0;
  pointer-events:none;
  transition:opacity .3s;
}
.loader.on{opacity:1;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 8. 세로 화면 ---------- */

@media (orientation:portrait){
  .info{
    left:var(--pad);
    right:var(--pad);
    width:auto;
    min-width:0;
    bottom:calc(var(--pad) * .7 + 4.5rem);
    max-height:44dvh;
  }
  .info-panel{padding:.9rem .95rem 1rem}
  .info-num{font-size:3.4rem;right:.4rem}
  .info-desc{display:none}          /* 세로에서는 설명 접기 — 음식을 가리지 않게 */
  .info-rule{margin:.6rem 0 0}
  .info-title{font-size:1.4rem}
  .info-tagline{font-size:.86rem;margin-top:.55rem}
  .info-foot{margin-top:.7rem}
  .hint{bottom:calc(var(--pad) * .7 + 4.4rem)}
  .brand-text span{display:none}

  /* 좁은 화면: 유틸 바를 세로 열로 세워 상단 가로 공간을 브랜드에 내준다.
     언어 토글은 현재 언어 대신 "전환 대상" 하나만 노출한다 (숨기지는 않는다) */
  .utils{flex-direction:column}
  .lang{background:none;padding:0}
  .lang i{display:none}
  .lang button[aria-pressed="true"]{display:none}
  .lang button{
    width:2.15rem;height:2.15rem;
    padding:0;
    display:grid;place-items:center;
    color:#f0cfa2;
  }
  .lang button:hover{background:rgba(255,247,230,.1)}
}

@media (max-height:430px) and (orientation:landscape){
  .info{bottom:calc(var(--pad) + 4.6rem);width:min(34vw,330px)}
  .info-desc{display:none}
}

/* ---------- 9. 모션 최소화 ---------- */

@media (prefers-reduced-motion: reduce){
  .stage-inner,.ambient-fire,.ember,.hint,.hero-ring .dash{animation:none !important}
  .embers{display:none}
  .info-panel::after{display:none}
  .hero,.hero-title span,.hero-cycle{transform:none !important;transition-duration:.2s !important;transition-delay:0s !important}
  .hero-rule{transform:scaleX(1) !important;transition-duration:.2s !important;transition-delay:0s !important}
  .info-panel,.info-num,.info-kicker,.info-title span,.info-ko,
  .info-tagline,.info-tags li,.info-desc,.info-price,.btn{
    transition-duration:.25s !important;
    transition-delay:0s !important;
    transform:none !important;
  }
  .info-kicker i,.info-rule{transition-duration:.25s !important;transform:scaleX(1) !important}
  .plate-ring{display:none}
  .shimmer{display:none}
  *{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="app">

  <!-- 앰비언트 배경 -->
  <div class="ambient" aria-hidden="true">
    <img class="ambient-img" id="ambientA" alt="" />
    <img class="ambient-img" id="ambientB" alt="" />
    <div class="ambient-fire"></div>
    <div class="ambient-tint"></div>
    <div class="embers" id="embers"></div>
  </div>

  <!-- 스테이지: 이미지와 영상이 같은 박스를 공유한다 -->
  <div class="stage" id="stage">
    <div class="stage-inner">
      <img class="layer" id="stillA" alt="옥수동 화덕피자의 빈 테이블" decoding="async" fetchpriority="high" />
      <img class="layer" id="stillB" alt="" aria-hidden="true" decoding="async" />
      <canvas class="layer" id="frameHold" aria-hidden="true"></canvas>
      <video class="layer" id="stageVideo" playsinline muted preload="metadata" disablepictureinpicture></video>
      <video class="layer" id="stageVideoRev" playsinline muted preload="auto" disablepictureinpicture aria-hidden="true"></video>
    </div>
    <div class="stage-vignette"></div>

    <!-- 첫 화면 중앙: 아직 비어 있는 접시 자리 -->
    <div class="hero" id="hero">
      <div class="hero-scrim"></div>
      <svg class="hero-ring" viewBox="0 0 200 200" aria-hidden="true">
        <circle cx="100" cy="100" r="96" />
        <circle class="dash" cx="100" cy="100" r="88" />
      </svg>
      <div class="hero-kicker">WOOD-FIRED</div>
      <p class="hero-title"><span id="heroTitle">오늘의 한 판</span></p>
      <div class="hero-rule"></div>
      <button class="hero-cycle" id="heroCycle" type="button"></button>

    <svg class="plate-ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="42" />

  <!-- 브랜드 -->

      <svg viewBox="0 0 24 24"><path d="M3 15a9 9 0 0 1 18 0Z"/><path d="M12 6V3"/><circle cx="9.5" cy="12.5" r="1"/><circle cx="14" cy="11.5" r="1"/><circle cx="12" cy="14.5" r="1"/></svg>
    </div>
    <div class="brand-text">
      <h1 id="brandName">옥수동 화덕피자</h1>
      <span id="brandSub">Oksu-dong Wood-Fired</span>
    </div>
  </header>

  <!-- 유틸: 소리 + 링크 -->
  <nav class="utils" id="utils" aria-label="바로가기">
    <div class="lang" id="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ko" aria-pressed="true">KO</button>
      <i aria-hidden="true"></i>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
    <button class="util" id="soundBtn" type="button" aria-pressed="false" aria-label="소리 켜기" title="소리">
      <svg class="on-muted" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m17 9 4 6M21 9l-4 6"/></svg>
      <svg class="on-live" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16 8.5a5 5 0 0 1 0 7"/><path d="M19 6a9 9 0 0 1 0 12"/></svg>
    </button>
    <a class="util" href="https://www.instagram.com/oxoosourdoughpizza/" target="_blank" rel="noopener noreferrer" aria-label="Instagram" title="Instagram">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg>
    </a>
    <a class="util" href="https://www.youtube.com/@oxpizza" target="_blank" rel="noopener noreferrer" aria-label="YouTube" title="YouTube">

    </a>
    <a class="util" id="homeLink" href=".." rel="noopener noreferrer" aria-label="홈페이지" title="홈페이지">
      <svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
    </a>
  </nav>

  <!-- 메뉴 정보 (JS가 채운다) -->
  <section class="info" id="info" aria-live="polite">
    <div class="info-panel">
      <div class="info-num" id="infoNum" aria-hidden="true">01</div>
      <div class="info-kicker"><i></i><em id="infoKicker" style="font-style:normal">Wood-fired</em></div>

          <a class="btn" id="storeBtn" href="../" target="_blank" rel="noopener noreferrer">매장 보기</a>
        </div>
      </div>

  </section>

  <!-- 메뉴 선택 레일 -->
  <div class="rail-wrap">

(() => {

   설정
   ============================================================ */

function init(){
  // 저장된 선택이 있으면 그것을, 없으면 브라우저 언어를 따른다
  const saved = (() => { try { return localStorage.getItem(LANG_KEY); } catch(e){ return null; } })();
  lang = (saved === "ko" || saved === "en")
    ? saved
    : ((navigator.language || "ko").toLowerCase().startsWith("ko") ? "ko" : "en");

  stillA.src = asset(BASE_IMAGE);
  video.poster = asset(BASE_IMAGE);   // 첫 프레임 전 검은 화면 방지
  video.muted = true;
  video.playsInline = true;

  setAmbient(asset(BASE_IMAGE));
  buildRail();
  buildEmbers();
  bindEvents();
  applyLang();

  // 배경 사진이 도착하기 전에는 로크업도, 프리로드도 시작하지 않는다.
  // 빈 무대 위에 글자만 떠 있는 화면을 막고, 첫 사진이 대역폭을 온전히 쓰게 한다.
  whenBaseReady(() => {
    showHero(true);
    idlePreload();
  });
}

/** pizza00 이 화면에 그려질 준비가 되면(늦어도 2.5초 뒤) 콜백 */
function whenBaseReady(done){
  let fired = false;

  // 어떤 경로로 끝나든 원본 스틸을 반드시 드러낸다.
  // (CSS 에서 opacity:0 으로 시작하므로 이걸 빼먹으면 배경이 영영 안 보인다)
  const reveal = () => { stillA.style.opacity = "1"; };

  const go = () => {
    if (fired) return;
    fired = true;
    clearTimeout(timer);
    showLoader(false);
    reveal();
    done();
  };

  if (stillA.complete && stillA.naturalWidth > 0){
    fired = true;
    reveal();
    done();
    return;
  }

  showLoader(true);
  stillA.addEventListener("load", go, { once: true });
  stillA.addEventListener("error", go, { once: true });   // 실패해도 UI 는 띄운다
  const timer = setTimeout(go, 2500);
}

/** 화면에 이미 그려진 모든 문자열을 현재 언어로 다시 칠한다 */
function applyLang(){
  const t = T();

  document.documentElement.lang = t.htmlLang;
  document.title = t.docTitle;

  $("brandName").textContent = t.brandName;
  $("brandSub").textContent  = t.brandSub;
  $("heroTitle").textContent = t.heroTitle;
  $("hint").textContent      = t.hint;
  $("orderBtn").textContent  = t.order;
  $("storeBtn").textContent  = t.store;

  stillA.alt = t.tableAlt;
  rail.setAttribute("aria-label", t.railLabel);
  $("utils").setAttribute("aria-label", t.utilsLabel);
  $("homeLink").setAttribute("aria-label", t.home);
  $("homeLink").setAttribute("title", t.home);
  syncSoundBtn();

  // 레일 칩: 이름과 라벨을 바꾸고 나면 알약 위치를 다시 잡아야 한다
  menus.forEach((m) => {
    const btn = chips.get(m.id);
    if (!btn) return;
    btn.querySelector("span").textContent = t.shortName(m);
    btn.setAttribute("aria-label", t.viewMenu(L(m).name, m.title));
  });

  // 토글 자체의 눌림 상태. 좁은 화면에서는 "전환 대상" 하나만 보이므로
  // 어느 쪽이 보이든 뜻이 통하도록 라벨을 명시한다.
  langBox.querySelectorAll("button").forEach((b) => {
    b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
    b.setAttribute("aria-label", b.dataset.lang === "ko" ? "한국어로 보기" : "View in English");
  });

  renderCycle(false);
  if (currentMenu) fillInfo(currentMenu);

  // 폭이 바뀌었으므로 활성 표시를 다시 계산한다
  const activeId = currentMenu?.id ?? pendingMenuId;
  requestAnimationFrame(() => moveRailPill(activeId ? chips.get(activeId) : null));
  setTimeout(() => moveRailPill(activeId ? chips.get(activeId) : null), 60);
}

function setLang(next){
  if (next === lang) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, lang); } catch(e){}
  applyLang();
}

/* ---------- 첫 화면 중앙 로크업 ---------- */

/** 순환 중인 메뉴 이름을 갈아 끼운다 (setInterval: rAF 가 멈춰도 돈다) */
function renderCycle(animate){
  const m = menus[cycleIdx];
  const label = T().shortName(m);   // 원 안에 들어가야 하므로 짧은 이름만
  heroCycle.setAttribute("aria-label", T().viewMenu(L(m).name, m.title));

  if (!animate || reduceMotion){
    heroCycle.textContent = label;
    return;
  }
  heroCycle.classList.add("swap");
  setTimeout(() => {
    heroCycle.textContent = label;
    heroCycle.classList.remove("swap");
  }, 220);
}

function showHero(on){
  stage.classList.toggle("idle", !!on);
  clearInterval(cycleTimer);

  if (!on) return;

  renderCycle(false);
  if (reduceMotion) return;

  cycleTimer = setInterval(() => {
    if (state !== State.IDLE) return;
    cycleIdx = (cycleIdx + 1) % menus.length;
    renderCycle(true);
    // 여기서 포스터를 미리 받지 않는다. 가만히 두기만 해도 6장(약 11MB)을 전부
    // 내려받게 되고, 실제로는 선택 후 영상이 끝날 때까지 4.6초의 여유가 있다.
  }, 2600);
}

/* ---------- 메뉴 레일 ---------- */

function buildRail(){
  const frag = document.createDocumentFragment();

  menus.forEach((m) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "chip";
    btn.dataset.id = String(m.id);
    btn.setAttribute("aria-pressed", "false");
    // 라벨 텍스트는 applyLang() 이 채운다
    btn.innerHTML =
      `<b>${String(m.id).padStart(2, "0")}</b><span></span>` +
      `<svg class="chip-progress" viewBox="0 0 16 16" aria-hidden="true">` +
      `<circle class="bg"/><circle class="fg"/></svg>`;

    btn.addEventListener("click", () => select(m.id));
    // 마우스를 올리거나 포커스가 닿으면 그 메뉴의 에셋을 미리 캐시에 올린다
    const warm = () => { warmVideo(m.video); warmPoster(m.image); };
    btn.addEventListener("pointerenter", warm);
    btn.addEventListener("focus", warm);

    chips.set(m.id, btn);
    frag.appendChild(btn);
  });

  rail.appendChild(frag);
}

function moveRailPill(btn){
  if (!btn){ railPill.classList.remove("on"); return; }
  railPill.style.width  = btn.offsetWidth + "px";
  railPill.style.height = btn.offsetHeight + "px";
  railPill.style.transform = `translate(${btn.offsetLeft}px, ${btn.offsetTop}px)`;
  railPill.classList.add("on");
}

function setActiveChip(id){
  chips.forEach((btn, key) => {
    const on = key === id;
    btn.classList.toggle("active", on);
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    if (!on) btn.classList.remove("loading-progress");
  });
  const btn = id ? chips.get(id) : null;
  moveRailPill(btn);
  if (btn) btn.scrollIntoView({ inline: "center", block: "nearest", behavior: reduceMotion ? "auto" : "smooth" });
}

/* ---------- 불티 ---------- */

function buildEmbers(){
  if (reduceMotion) return;
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 14; i++){
    const e = document.createElement("i");
    e.className = "ember";
    e.style.left = (Math.random() * 100).toFixed(1) + "%";
    e.style.setProperty("--dx", (Math.random() * 80 - 40).toFixed(0) + "px");
    e.style.animationDuration = (11 + Math.random() * 12).toFixed(1) + "s";
    e.style.animationDelay = (-Math.random() * 20).toFixed(1) + "s";
    e.style.opacity = "0";
    frag.appendChild(e);
  }
  embersBox.appendChild(frag);
}

// 스틸 이미지 크로스페이드
function setStill(src){
  return new Promise((resolve) => {
    if (stillFront.getAttribute("src") === src) return resolve();

    const img = new Image();
    img.decoding = "async";
    const done = () => {
      stillBack.src = src;
      stillBack.style.opacity = "1";
      stillFront.style.opacity = "0";
      const t = stillFront; stillFront = stillBack; stillBack = t;
      resolve();
    };
    img.onload = done;
    img.onerror = () => resolve();
    img.src = src;
  });
}

// 앰비언트(흐린 배경) 크로스페이드
function setAmbient(src){
  const img = new Image();
  img.decoding = "async";
  img.onload = () => {
    ambientBack.src = src;
    ambientBack.classList.add("on");
    ambientFront.classList.remove("on");
    const t = ambientFront; ambientFront = ambientBack; ambientBack = t;
  };
  img.src = src;
}

/**
 * 영상이 멈춘 순간의 프레임을 캔버스로 떠서 영상 밑에 깔아 둔다.
 * iOS 는 정지된 <video> 의 프레임을 버리거나 poster 를 다시 띄우는 경우가 있는데,
 * 그때 드러나는 그림이 PNG 면 인코딩 차이 때문에 눈에 띄게 튄다.
 * 영상에서 직접 뜬 프레임이면 픽셀이 같아 무엇이 드러나도 보이지 않는다.
 */
function holdFrame(el){
  if (!el || el.readyState < 2 || !el.videoWidth) return false;
  try {
    if (frameHold.width !== el.videoWidth || frameHold.height !== el.videoHeight){
      frameHold.width  = el.videoWidth;
      frameHold.height = el.videoHeight;
    }
    frameHold.getContext("2d").drawImage(el, 0, 0, frameHold.width, frameHold.height);
    return true;
  } catch (e) {
    return false;   // 그리기에 실패하면 그냥 쓰지 않는다
  }
}

function showHold(on, instant){
  frameHold.classList.toggle("instant", !!instant);
  frameHold.classList.toggle("show", !!on);
}

function showLoader(on){
  clearTimeout(loaderTimer);
  if (on){
    loaderTimer = setTimeout(() => loader.classList.add("on"), 320);
  } else {
    loader.classList.remove("on");
  }
}

function flash(){
  if (reduceMotion) return;
  shimmer.classList.remove("flash");
  void shimmer.offsetWidth;
  shimmer.classList.add("flash");
}

  $("infoNum").textContent     = String(m.id).padStart(2, "0");

    const li = document.createElement("li");

    return li;
  }));

function infoStep(n){
  for (let i = 1; i <= 5; i++){
    info.classList.toggle("step-" + i, n >= i);
  }
}

function infoReset(){
  info.classList.remove("leaving");

}

function infoExit(){
  info.classList.add("leaving");
  infoStep(0);
}

function stopLoop(){
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}

/**
 * 메뉴 선택 진입점.
 * 어떤 상태에서 눌러도 "마지막에 누른 것"만 기억한다.
 */
function select(id){
  hint.classList.add("gone");

  // 같은 메뉴를 다시 누르면 아무 것도 하지 않는다
  if (currentMenu && currentMenu.id === id && (state === State.VIEWING || state === State.ENTERING)){
    pendingMenuId = null;
    return;
  }

  pendingMenuId = id;

  if (state === State.IDLE){
    runPending();
  } else if (state === State.VIEWING || state === State.ENTERING){
    startLeave();
  }
  // LEAVING 중이면 pendingMenuId 만 갱신하고 되감기가 끝나기를 기다린다
}

function runPending(){
  const id = pendingMenuId;
  pendingMenuId = null;
  if (!id) return;
  const m = getMenu(id);
  if (m) enter(m);
}

/* ---------- 정방향 재생 ---------- */

async function enter(m){
  state = State.ENTERING;
  currentMenu = m;

  // 되감기 레이어와 프레임 홀드가 페이드 중일 수 있다. 새 영상 위에 겹치지 않게 즉시 걷는다.
  // 이 순간 아래 스틸은 pizza00, 새 영상의 첫 프레임도 pizza00 이라 티가 나지 않는다.
  videoRev.pause();
  videoRev.classList.add("instant");
  videoRev.classList.remove("show");
  showHold(false, true);

  // 새 영상은 부드럽게 떠오른다. 아래 스틸도 첫 프레임도 pizza00 이라 안전하다.
  video.classList.remove("instant");

  // 첫 프레임 전 검은 화면만 막고, 재생이 시작되면 걷어낸다(아래 finishEnter 참고)
  video.poster = asset(BASE_IMAGE);

  showHero(false);
  setActiveChip(m.id);
  infoReset();
  fillInfo(m);
  setAmbient(asset(m.image));

  // 모션 최소화 설정이면 영상 없이 이미지 전환만
  if (reduceMotion){
    video.classList.remove("show");
    await setStill(asset(m.image));
    infoStep(5);
    state = State.VIEWING;
    if (pendingMenuId) startLeave();
    return;
  }

  showLoader(true);

  const chip = chips.get(m.id);
  if (chip){
    chip.classList.add("loading-progress");
    chip.style.setProperty("--p", "0");
  }

  const ok = await loadVideo(asset(m.video));

  // 로딩 중 다른 메뉴를 눌렀다면 이 재생은 버린다
  if (currentMenu !== m){ showLoader(false); return; }

  showLoader(false);

  if (!ok){
    // 영상 실패 → 대응 PNG 로 폴백
    video.classList.remove("show");
    await setStill(asset(m.image));
    if (currentMenu !== m) return;
    infoStep(5);
    state = State.VIEWING;
    if (pendingMenuId) startLeave();
    return;
  }

  video.playbackRate = PLAYBACK_RATE;
  video.muted = !soundOn;
  video.currentTime = 0;
  video.classList.add("show");

  try {
    await video.play();
  } catch (err) {
    // 자동재생이 막히면 음소거로 재시도
    video.muted = true;
    soundOn = false;
    syncSoundBtn();
    try { await video.play(); } catch (e2) { /* 그래도 안 되면 아래 루프가 정지 감지 */ }
  }

  runEnterLoop(m);
}

function loadVideo(src){
  return new Promise((resolve) => {
    const abs = new URL(src, location.href).href;
    if (video.src === abs && video.readyState >= 3) return resolve(true);

    let settled = false;
    const finish = (val) => {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      video.removeEventListener("canplay", onOk);
      video.removeEventListener("loadeddata", onOk);
      video.removeEventListener("error", onErr);
      resolve(val);
    };
    const onOk  = () => { if (video.readyState >= 2) finish(true); };
    const onErr = () => finish(false);

    video.addEventListener("canplay", onOk);
    video.addEventListener("loadeddata", onOk);
    video.addEventListener("error", onErr);

    const timer = setTimeout(() => finish(video.readyState >= 2), 9000);

    video.src = src;
    video.load();
  });
}

/** 재생 진행률에 맞춰 UI 를 단계적으로 등장시킨다 */
function runEnterLoop(m){
  stopLoop();

  let plated = false;
  let step   = 0;
  let lastTime = -1;
  let stillAt  = performance.now();

  const chip = chips.get(m.id);

  const tick = (now) => {
    if (state !== State.ENTERING || currentMenu !== m) return;

    const dur = video.duration;
    const cur = video.currentTime;
    const p = (dur && isFinite(dur)) ? Math.min(cur / dur, 1) : 0;

    if (chip) chip.style.setProperty("--p", p.toFixed(3));

    // 피자가 놓이는 순간
    if (!plated && p >= CUE.plate){
      plated = true;
      stage.classList.add("plated", "impact");
      setTimeout(() => stage.classList.remove("plated", "impact"), 1200);
    }

    let next = step;
    if (p >= CUE.step5) next = 5;
    else if (p >= CUE.step4) next = 4;
    else if (p >= CUE.step3) next = 3;
    else if (p >= CUE.step2) next = 2;
    else if (p >= CUE.step1) next = 1;
    if (next !== step){ step = next; infoStep(step); }

    // ended 이벤트만 믿지 않는다: 진행률과 정지 여부를 함께 본다
    const nearEnd = dur && (cur >= dur - 0.06);
    if (Math.abs(cur - lastTime) > 0.001){ lastTime = cur; stillAt = now; }
    const frozen = (now - stillAt) > 900 && !video.paused === false;

    if (video.ended || nearEnd || (video.paused && p > 0.98) || (frozen && p > 0.9)){
      finishEnter(m);
      return;
    }

    rafId = requestAnimationFrame(tick);
  };

  rafId = requestAnimationFrame(tick);
  video.addEventListener("ended", () => { if (state === State.ENTERING && currentMenu === m) finishEnter(m); }, { once: true });
}

function finishEnter(m){
  stopLoop();
  // 마지막 프레임을 그대로 유지한다 (PNG 와의 미세한 차이보다 프레임 유지를 우선).
  // currentTime 을 건드리지 않는다 — 되감기는 전용 클립이 담당하므로 seek 이 필요 없다.
  video.pause();

  // 지금 화면에 떠 있는 바로 그 프레임을 떠서 영상 밑에 깔아 둔다.
  // 여기서 PNG 를 깔면 인코딩이 달라 iOS 에서 그림이 튀었다.
  if (holdFrame(video)) showHold(true, true);

  // poster 를 떼어 둔다. iOS 가 정지 후 poster 를 다시 띄우면 그것도 튀는 원인이 된다.
  video.removeAttribute("poster");

  // 되감기 전용 요소에 클립을 미리 물려 둔다. 여기서 첫 프레임까지 디코드해 두면
  // 나중에 불투명하게 만들기만 하면 되므로 전환에 빈 구간이 생기지 않는다.
  prepareReverse(m);

  infoStep(5);
  const chip = chips.get(m.id);
  if (chip) chip.classList.remove("loading-progress");

  state = State.VIEWING;

  if (pendingMenuId) startLeave();
}

/* ---------- 역방향 되감기 ---------- */

/**
 * 되감기 클립을 전용 요소에 물려 두고 첫 프레임까지 준비시킨다.
 * VIEWING 에 들어가는 순간 호출되므로 사용자가 곧바로 다른 메뉴를 눌러도 대기가 짧다.
 */
function prepareReverse(m){
  if (reduceMotion || !m.reverse) return;

  const src = asset(m.reverse);
  if (videoRev.dataset.src === src) return;   // 이미 같은 클립이 물려 있다

  videoRev.dataset.src = src;
  videoRev.dataset.ready = "";
  videoRev.muted = true;
  videoRev.playbackRate = REVERSE_RATE;

  const onReady = () => {
    if (videoRev.dataset.src !== src) return;
    videoRev.dataset.ready = "1";
    videoRev.removeEventListener("loadeddata", onReady);
  };
  videoRev.addEventListener("loadeddata", onReady);
  videoRev.addEventListener("error", () => {
    if (videoRev.dataset.src === src) videoRev.dataset.ready = "err";
  }, { once: true });

  videoRev.src = src;
  videoRev.load();
}

/** 되감기 클립이 첫 프레임을 그릴 수 있을 때까지 기다린다 */
function waitReverse(timeoutMs){
  if (videoRev.readyState >= 2) return Promise.resolve(true);
  if (videoRev.dataset.ready === "err") return Promise.resolve(false);

  return new Promise((resolve) => {
    let done = false;
    const finish = (ok) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      videoRev.removeEventListener("loadeddata", ok2);
      videoRev.removeEventListener("canplay", ok2);
      videoRev.removeEventListener("error", bad);
      resolve(ok);
    };
    const ok2 = () => { if (videoRev.readyState >= 2) finish(true); };
    const bad = () => finish(false);

    videoRev.addEventListener("loadeddata", ok2);
    videoRev.addEventListener("canplay", ok2);
    videoRev.addEventListener("error", bad);
    const timer = setTimeout(() => finish(videoRev.readyState >= 2), timeoutMs);
  });
}

/**
 * 되감기는 미리 만들어 둔 역재생 클립(pizzaNN_rev.mp4)을 정방향으로 재생한다.
 * tools/make_reverse.py 로 생성한다.
 *
 * 브라우저에서 currentTime 을 되돌리는 방식은 서버의 HTTP Range 지원이 필요하고
 * seek 이 키프레임 단위로 튀어서 부드럽지 않았다. 클립을 미리 만들면 그냥 재생이다.
 */
async function startLeave(){
  if (state === State.LEAVING) return;
  state = State.LEAVING;
  stopLoop();

  const leavingMenu = currentMenu;

  infoExit();
  video.pause();
  video.muted = true;   // 되감기 중에는 항상 무음

  const chip = leavingMenu ? chips.get(leavingMenu.id) : null;
  if (chip) chip.classList.remove("loading-progress");

  // 되감기가 어떤 이유로든 끝나지 않아도 LEAVING 에 갇히지 않도록 보장한다
  clearTimeout(leaveGuard);
  leaveGuard = setTimeout(() => {
    if (state === State.LEAVING) arriveIdle();
  }, REVERSE_MAX_MS + 600);

  // 모션 최소화이거나 되감기 클립이 없으면 영상 레이어를 페이드아웃해 돌아간다
  if (reduceMotion || !leavingMenu || !leavingMenu.reverse){
    video.classList.remove("show");
    setTimeout(() => arriveIdle(), reduceMotion ? 160 : 300);
    return;
  }

  // 아직 안 물려 있으면 지금 물린다 (finishEnter 를 건너뛴 경로 대비)
  prepareReverse(leavingMenu);

  const ok = await waitReverse(1800);

  // 기다리는 사이 상태가 바뀌었으면 이 되감기는 버린다
  if (state !== State.LEAVING) return;

  if (!ok){
    // 클립을 못 받았다 → 정방향 영상을 페이드아웃해 아래 스틸로 되돌아간다
    video.classList.remove("show");
    setTimeout(() => arriveIdle(), 300);
    return;
  }

  videoRev.muted = true;
  videoRev.playbackRate = REVERSE_RATE;   // 8.04초 클립 → 약 1.3초
  try { videoRev.currentTime = 0; } catch(e){}

  // 페이드 없이 즉시 덮는다. 이 클립의 첫 프레임은 정방향의 마지막 프레임이라
  // 아래에 깔린 정방향 영상과 그림이 같아 전환이 보이지 않는다.
  videoRev.classList.add("instant", "show");

  try {
    await videoRev.play();
  } catch (e) {
    arriveIdle();
    return;
  }

  if (state !== State.LEAVING) return;

  // ended 만 믿지 않는다. 진행률도 함께 본다
  const watch = () => {
    if (state !== State.LEAVING) return;
    const dur = videoRev.duration;
    if (videoRev.ended || (dur && isFinite(dur) && videoRev.currentTime >= dur - 0.08)){
      arriveIdle();
      return;
    }
    rafId = requestAnimationFrame(watch);
  };
  rafId = requestAnimationFrame(watch);
  videoRev.addEventListener("ended", () => {
    if (state === State.LEAVING) arriveIdle();
  }, { once: true });
}

/** 빈 테이블 도착: 여기서 상태를 정리하고 대기 중인 메뉴를 실행한다 */
function arriveIdle(){
  stopLoop();
  clearTimeout(leaveGuard);

  // 되감기가 멈춘 바로 그 프레임으로 홀드를 갱신한다. 이걸 빼먹으면 홀드에 남아 있던
  // "피자가 놓인 프레임"이 영상이 걷히는 순간 다시 드러난다.
  const held = holdFrame(videoRev) || holdFrame(video);
  showHold(held, true);

  video.pause();
  videoRev.pause();
  video.playbackRate = 1;

  // 스틸은 처음부터 pizza00 이다(중간에 바꾸지 않는다). 영상 두 장을 즉시 걷어도
  // 픽셀이 같은 홀드가 그 자리를 그대로 이어받아 화면이 튀지 않는다.
  //
  // 정방향을 페이드로 걷으면 안 된다. 이 시점 정방향은 "피자가 놓인" 마지막 프레임을
  // 들고 있어서, 위를 덮던 역방향이 사라지는 순간 그 그림이 드러났다가 사라진다.
  setStill(asset(BASE_IMAGE));
  video.classList.add("instant");
  video.classList.remove("show");
  videoRev.classList.add("instant");
  videoRev.classList.remove("show");

  // 홀드만 부드럽게 사라지며 아래 pizza00 스틸이 드러난다
  requestAnimationFrame(() => showHold(false, false));
  setTimeout(() => showHold(false, false), 50);   // rAF 가 멈춘 환경 대비

  setAmbient(asset(BASE_IMAGE));
  flash();

  infoReset();
  const leftId = currentMenu ? currentMenu.id : null;
  currentMenu = null;
  state = State.IDLE;

  if (pendingMenuId){
    setActiveChip(pendingMenuId);
    // 스틸 전환이 화면에 반영될 틈을 준다. rAF 대신 타이머를 쓰는 이유는
    // rAF 가 멈춘 환경(백그라운드 탭 등)에서도 다음 메뉴가 반드시 시작되게 하기 위해서다
    setTimeout(runPending, 40);
  } else {
    setActiveChip(null);
    // 방금 본 메뉴를 다시 제안하지 않도록 순환을 한 칸 넘긴다
    if (leftId !== null){
      const at = menus.findIndex((m) => m.id === leftId);
      if (at >= 0) cycleIdx = (at + 1) % menus.length;
    }
    showHero(true);   // 빈 테이블로 돌아왔으니 중앙 로크업을 되살린다
  }
}

/* ============================================================
   프리로드
   ============================================================ */

const warmed = new Set();

/** HTTP 캐시만 데운다. <video> 는 하나만 쓰기 위해 fetch 로 처리 */
function warmVideo(file){
  if (warmed.has(file)) return;
  warmed.add(file);
  try {
    fetch(asset(file), { mode: "no-cors", cache: "force-cache" }).catch(() => {});
  } catch (e) { /* file:// 등에서는 무시 */ }
}

const warmedPosters = new Set();

function warmPoster(file){
  if (warmedPosters.has(file)) return;
  warmedPosters.add(file);
  const img = new Image();
  img.decoding = "async";
  img.src = asset(file);
}

/**
 * 에셋이 무거워서(포스터 2MB+, 영상 5~6MB) 한 번에 받지 않는다.
 * 초기에는 pizza00 과 첫 메뉴만, 나머지는 마우스가 닿을 때 데운다.
 */
function idlePreload(){
  const idle = window.requestIdleCallback || ((fn) => setTimeout(fn, 900));
  idle(() => {
    const first = menus[0];
    warmPoster(first.image);
    warmVideo(first.video);
  }, { timeout: 2500 });
}

/* ============================================================
   이벤트
   ============================================================ */

function syncSoundBtn(){
  soundBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
  soundBtn.setAttribute("aria-label", soundOn ? T().soundOff : T().soundOn);
}

function bindEvents(){
  soundBtn.addEventListener("click", () => {
    soundOn = !soundOn;
    // 되감기 중에는 무조건 무음 유지
    video.muted = !soundOn || state === State.LEAVING;
    syncSoundBtn();
  });

  langBox.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) setLang(btn.dataset.lang);
  });

  // 중앙에서 순환 중인 이름을 누르면 그 메뉴로 바로 들어간다
  heroCycle.addEventListener("click", () => select(menus[cycleIdx].id));
  heroCycle.addEventListener("pointerenter", () => {
    const m = menus[cycleIdx];
    warmVideo(m.video);
    warmPoster(m.image);
  });

  $("orderBtn").addEventListener("click", () => {
    const name = currentMenu ? `${L(currentMenu).name} (${currentMenu.title})` : "-";
    window.open("https://www.instagram.com/oxoosourdoughpizza/", "_blank", "noopener");
    console.info("주문 문의:", name);
  });

  // 키보드: 좌우로 메뉴 이동, 숫자키로 바로 선택
  window.addEventListener("keydown", (e) => {
    const t = e.target;
    if (t instanceof Element && t.closest("input, textarea, [contenteditable]")) return;

    if (e.key >= "1" && e.key <= "6"){
      select(Number(e.key));
      chips.get(Number(e.key))?.focus();
      return;
    }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft"){
      const list = menus.map((m) => m.id);
      const cur = currentMenu ? list.indexOf(currentMenu.id) : -1;
      const dir = e.key === "ArrowRight" ? 1 : -1;
      const nextIdx = (cur + dir + list.length) % list.length;
      const id = list[cur === -1 ? (dir > 0 ? 0 : list.length - 1) : nextIdx];
      select(id);
      chips.get(id)?.focus();
      e.preventDefault();
    }
    if (e.key === "Escape" && (state === State.VIEWING || state === State.ENTERING)){
      pendingMenuId = null;
      startLeave();
    }
  });

  // 레일 알약 위치는 레이아웃이 바뀌면 다시 잡는다
  const ro = new ResizeObserver(() => {
    if (currentMenu) moveRailPill(chips.get(currentMenu.id));
    else if (pendingMenuId) moveRailPill(chips.get(pendingMenuId));
  });
  ro.observe(rail);

  rail.addEventListener("scroll", () => {
    const id = currentMenu?.id ?? pendingMenuId;
    if (id) moveRailPill(chips.get(id));
  }, { passive: true });

  // 탭이 가려지면 재생을 멈춰 배터리를 아낀다
  document.addEventListener("visibilitychange", () => {
    if (document.hidden){
      // 숨겨진 동안에는 rAF 가 돌지 않는다. 되감기 중이면 즉시 빈 테이블로 정리한다
      if (state === State.LEAVING) arriveIdle();
      else if (state === State.ENTERING) video.pause();
    } else if (state === State.ENTERING && video.paused){
      video.play().catch(() => {});
    }
  });

  window.addEventListener("pagehide", () => {
    stopLoop();
    [video, videoRev].forEach((el) => {
      el.pause();
      el.removeAttribute("src");
      el.load();
    });
  });
}

init();

})();
</script>
