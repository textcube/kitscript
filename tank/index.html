<style>

<script>
'use strict';
/* ==========================================================================
 * ETERNAL INVASION: TANK EDITION - single-file campaign build
 *
 *  SECTION 1   Engine basics: helpers, seeded RNG, storage, URL/debug params, save data, score table
 *  SECTION 2   Audio: SFX + procedural music sequencer (WebAudio only)
 *  SECTION 3   Data: constants, unit roster, skills, upgrades, info cards, planets
 *  SECTION 4   Missions: 16 authored missions + the endless generator
 *  SECTION 5   Simulation: lanes, structures, units, projectiles, hazards, objectives, deployment, tank + skills
 *  SECTION 6   Bosses: Iron Leviathan, Colossus, Eternal Citadel (and the Warlord duel champion)
 *  SECTION 7   Auto-pilot AI: tank driver, deploy AI, skill AI, auto-shop, loadout AI
 *  SECTION 7b  Results, stars, economy, headless simulation harness
 *  SECTION 8   Renderer: backdrops, terrain, sprites, units, bosses, effects, fog
 *  SECTION 9   UI: HUD, panels, screens, flow; 9b input; main loop
 *  SECTION 10  Debug hooks (off by default) and boot
 *
 *  The simulation (sections 3-7b) never touches the DOM, so the same code runs in the headless balance tests.
 *  The field is a fixed 1200x600 logical battlefield, letterboxed to any window.
 * ========================================================================== */

/* ==========================================================================
 * SECTION 1 - ENGINE BASICS
 * ========================================================================== */
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const TAU = Math.PI * 2;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const smooth = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const hyp = Math.hypot;

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
// Gameplay RNG (seedable so balance tests are reproducible). Cosmetics use Math.random.
let R = mulberry32(12345);
function seedGame(s) { R = mulberry32(s >>> 0); }
const rr = (a, b) => a + R() * (b - a);
const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
const pick = arr => arr[Math.floor(R() * arr.length)];

const Store = {
    get(key, def) { try { const raw = localStorage.getItem(key); return raw === null ? def : JSON.parse(raw); } catch (e) { return def; } },
    set(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); return true; } catch (e) { return false; } },
    del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }
};
const KEY_SAVE = 'tank_save_v1', KEY_SCORES = 'tank_scores_v1', KEY_SETTINGS = 'tank_settings_v1';

const PARAMS = (() => { try { return new URLSearchParams(location.search); } catch (e) { return new URLSearchParams(''); } })();
const MISSION_COUNT = 16;
const DBG = {
    mission: PARAMS.has('mission') ? clamp(parseInt(PARAMS.get('mission'), 10) || 1, 1, MISSION_COUNT) : 0,
    god: PARAMS.get('god') === '1',
    speed: PARAMS.has('speed') ? clamp(parseFloat(PARAMS.get('speed')) || 1, 0.25, 20) : 1,
    unlock: PARAMS.get('unlock') === 'all',
    money: PARAMS.has('money') ? Math.max(0, parseInt(PARAMS.get('money'), 10) || 0) : -1,
    seed: PARAMS.has('seed') ? (parseInt(PARAMS.get('seed'), 10) || 1) : 0,
    manual: PARAMS.get('auto') === '0',
    endless: PARAMS.get('endless') === '1',
    on: false
};
DBG.noPersist = DBG.unlock || DBG.mission > 0 || DBG.money >= 0 || PARAMS.get('nosave') === '1';
DBG.on = ['mission', 'god', 'speed', 'unlock', 'money', 'debug', 'seed', 'endless', 'nosave'].some(k => PARAMS.has(k));

const REDUCED_MOTION = (() => { try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const IS_TOUCH = (() => { try { return ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();

/* ---------- Settings (music / sfx / shake persist separately from progress) ---------- */
const settings = Object.assign({ music: true, sfx: true, shake: !REDUCED_MOTION }, Store.get(KEY_SETTINGS, {}) || {});
if (REDUCED_MOTION && Store.get(KEY_SETTINGS, null) === null) settings.shake = false;
function saveSettings() { if (!DBG.noPersist) Store.set(KEY_SETTINGS, settings); }

/* ---------- Save data (versioned key + inner version, sanitised on load) ---------- */
const UNIT_IDS = ['rifle', 'shield', 'rocket', 'artillery', 'drone', 'medic', 'walker', 'sapper'];
const UP_IDS = ['hull', 'gun', 'load', 'engine', 'reactor', 'strike', 'emp', 'salvo', 'depot', 'armor', 'turret', 'deck'];
const UP_MAX = { hull: 5, gun: 5, load: 5, engine: 4, reactor: 4, strike: 4, emp: 4, salvo: 4, depot: 5, armor: 4, turret: 3, deck: 1 };
const UNIT_LV_MAX = 3;
function defaultSave() {
    const up = {}; UP_IDS.forEach(id => { up[id] = 0; });
    const un = {}; UNIT_IDS.forEach(id => { un[id] = { own: id === 'rifle' ? 1 : 0, lv: 1 }; });
    return { v: 1, cr: 0, m: {}, up, un, deck: ['rifle'], seen: {}, done: false, endless: { wave: 0, score: 0 }, plays: 0, lastName: 'AAA' };
}
let save = defaultSave();
function loadSave() {
    const raw = Store.get(KEY_SAVE, null);
    const s = defaultSave();
    if (raw && typeof raw === 'object' && raw.v === 1) {
        if (typeof raw.cr === 'number' && isFinite(raw.cr)) s.cr = Math.max(0, Math.floor(raw.cr));
        if (raw.m && typeof raw.m === 'object') {
            Object.keys(raw.m).forEach(k => {
                const r = raw.m[k];
                if (r && typeof r === 'object' && /^\d+$/.test(k) && +k < MISSION_COUNT) s.m[k] = { stars: clamp(r.stars | 0, 0, 3), best: Math.max(0, r.best | 0), clears: Math.max(0, r.clears | 0), bestTime: r.bestTime > 0 ? r.bestTime : 0 };
            });
        }
        if (raw.up && typeof raw.up === 'object') UP_IDS.forEach(id => { if (typeof raw.up[id] === 'number') s.up[id] = clamp(Math.floor(raw.up[id]), 0, UP_MAX[id]); });
        if (raw.un && typeof raw.un === 'object') UNIT_IDS.forEach(id => { const u = raw.un[id]; if (u && typeof u === 'object') { s.un[id] = { own: u.own ? 1 : 0, lv: clamp(u.lv | 0, 1, UNIT_LV_MAX) }; } });
        s.un.rifle.own = 1;
        if (Array.isArray(raw.deck)) { const d = raw.deck.filter((u, i, a) => UNIT_IDS.indexOf(u) >= 0 && s.un[u].own && a.indexOf(u) === i); if (d.length) s.deck = d.slice(0, 5); }
        if (raw.seen && typeof raw.seen === 'object') Object.keys(raw.seen).forEach(k => { if (raw.seen[k]) s.seen[k] = 1; });
        s.done = !!raw.done;
        if (raw.endless && typeof raw.endless === 'object') s.endless = { wave: Math.max(0, raw.endless.wave | 0), score: Math.max(0, raw.endless.score | 0) };
        s.plays = Math.max(0, raw.plays | 0);
        if (typeof raw.lastName === 'string') s.lastName = raw.lastName.slice(0, 3).toUpperCase() || 'AAA';
    }
    save = s;
    if (DBG.unlock) {
        s.done = true;
        for (let i = 0; i < MISSION_COUNT; i++) if (!s.m[i]) s.m[i] = { stars: 1, best: 0, clears: 1, bestTime: 0 };
        UNIT_IDS.forEach(id => { s.un[id].own = 1; });
    }
    if (DBG.money >= 0) s.cr = DBG.money;
    return s;
}
function persist() { if (!DBG.noPersist) Store.set(KEY_SAVE, save); }

    Store.del(KEY_SAVE);

}

/* ---------- High-score table (local top 10, initials) ---------- */
let scoresCache = null;
function loadScores() {
    if (scoresCache) return scoresCache;
    const raw = Store.get(KEY_SCORES, []);
    const out = [];
    if (Array.isArray(raw)) raw.forEach(r => {
        if (r && typeof r.s === 'number' && isFinite(r.s)) out.push({ n: String(r.n || '???').slice(0, 3).toUpperCase(), s: Math.max(0, Math.floor(r.s)), m: r.m === 'END' ? 'END' : 'CAM', d: String(r.d || '').slice(0, 12) });
    });
    out.sort((a, b) => b.s - a.s);
    scoresCache = out.slice(0, 10);
    return scoresCache;
}
function scoreQualifies(s) { const t = loadScores(); return s > 0 && (t.length < 10 || s > t[t.length - 1].s); }
function addScore(name, s, mode, detail) {
    const t = loadScores();
    const e = { n: (name || 'AAA').slice(0, 3).toUpperCase(), s: Math.floor(s), m: mode, d: detail || '' };
    t.push(e); t.sort((a, b) => b.s - a.s);
    scoresCache = t.slice(0, 10);
    if (!DBG.noPersist) Store.set(KEY_SCORES, scoresCache);

const JINGLES = {
    victory: { bpm: 132, root: 60, scale: 'major', wave: 'square', notes: [[0, 0, 2], [2, 2, 2], [4, 4, 2], [6, 7, 2], [8, 4, 2], [10, 7, 2], [12, 9, 4], [16, 11, 2], [18, 9, 2], [20, 12, 10]] },

    warning: { bpm: 150, root: 45, scale: 'phrygian', wave: 'sawtooth', notes: [[0, 0, 3], [4, 0, 3], [8, 1, 3], [12, 0, 3], [16, 7, 6]] }

const AudioEngine = (() => {
    let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
    let unsupported = !(window.AudioContext || window.webkitAudioContext);
    let voices = 0, cur = null;
    const lastAt = {};

    const ensureCtx = () => {
        if (unsupported) return false;
        try {
            if (!ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                ctx = new AC();
                master = ctx.createGain(); master.gain.value = 0.9;
                sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
                musBus = ctx.createGain(); musBus.gain.value = 0.3; musBus.connect(master);
                if (ctx.createDynamicsCompressor) { const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
                else master.connect(ctx.destination);
            }
            if (ctx.state === 'suspended') { const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
            return true;
        } catch (e) { unsupported = true; ctx = null; return false; }
    };
    const running = () => ctx && ctx.state === 'running';

    const note = (bus, t, freq, type, dur, vol, slideTo) => {
        if (voices >= 28) return;
        try {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain); gain.connect(bus);
            voices++;
            osc.onended = () => { voices--; osc.disconnect(); gain.disconnect(); };
            osc.start(t); osc.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const noise = (bus, t, dur, vol, ftype, f0, f1) => {
        if (voices >= 28) return;
        try {
            if (!noiseBuf) {
                noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            const src = ctx.createBufferSource(), filt = ctx.createBiquadFilter(), gain = ctx.createGain();
            src.buffer = noiseBuf; filt.type = ftype;
            filt.frequency.setValueAtTime(f0, t);
            if (f1) filt.frequency.exponentialRampToValueAtTime(f1, t + dur);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(filt); filt.connect(gain); gain.connect(bus);
            voices++;
            src.onended = () => { voices--; src.disconnect(); filt.disconnect(); gain.disconnect(); };
            src.start(t); src.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const sfxOk = () => settings.sfx && running();
    const gate = (key, ms) => {   // the same key can't fire twice within `ms`
        const n = Date.now();
        if (lastAt[key] && n - lastAt[key] < ms) return false;
        lastAt[key] = n; return true;
    };
    const tone = (freq, type, dur, vol, slideTo, delay) => { if (!sfxOk()) return; note(sfxBus, ctx.currentTime + (delay || 0), freq, type, dur, vol, slideTo); };
    const boom = (dur, vol, cutoff) => { if (!sfxOk() || !gate('boom', 45)) return; noise(sfxBus, ctx.currentTime, dur, vol, 'lowpass', cutoff, 120); };
    const hiss = (dur, vol, f0, f1, delay) => { if (!sfxOk()) return; noise(sfxBus, ctx.currentTime + (delay || 0), dur, vol, 'highpass', f0, f1); };

    const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
    const degMidi = (root, scale, deg) => {
        const sc = SCALES[scale], oct = Math.floor(deg / 7), idx = ((deg % 7) + 7) % 7;
        return root + sc[idx] + 12 * oct;
    };
    const schedStep = (c, t, step) => {
        const d = c.def, stepDur = c.stepDur;
        if (c.jingle) {
            for (let i = 0; i < d.notes.length; i++) {
                const n = d.notes[i];
                if (n[0] === step) note(musBus, t, midiFreq(degMidi(d.root, d.scale, n[1])), d.wave, n[2] * stepDur * 0.95, 0.2);
            }
            return;
        }
        const bars = d.sections.length * 4, bar = Math.floor(step / 16) % bars, s = step % 16;
        const sec = d.sections[Math.floor(bar / 4)], bi = bar % 4, chord = sec.prog[bi];
        const motif = bi === 3 ? sec.fill : sec.lead, tok = motif[s];
        if (typeof tok === 'number') {
            let len = 1; while (s + len < 16 && motif[s + len] === 'T') len++;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, tok + chord)), d.wave, len * stepDur * 0.9, 0.11);
        }
        const bt = d.bass[s];
        if (typeof bt === 'number') note(musBus, t, midiFreq(degMidi(d.root - 12, d.scale, bt + chord)), 'triangle', stepDur * 1.6, 0.2);
        if (d.arp && s % d.arp.every === 0) {
            const k = (s / d.arp.every) | 0;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, chord + d.arp.pat[k % d.arp.pat.length])), 'square', stepDur * 0.7, 0.035);
        }
        const dr = (bi === 3 ? d.fill : d.drums).charAt(s);
        if (dr === 'k') note(musBus, t, 150, 'sine', 0.13, 0.42, 42);
        else if (dr === 's') { noise(musBus, t, 0.11, 0.2, 'highpass', 1800); note(musBus, t, 210, 'triangle', 0.07, 0.12, 120); }
        else if (dr === 'h') noise(musBus, t, 0.035, 0.09, 'highpass', 7000);
    };
    const startTrack = name => {
        const isJ = !!JINGLES[name], def = isJ ? JINGLES[name] : TRACKS[name];
        if (!def) { cur = null; return; }
        cur = { name, def, jingle: isJ, step: 0, next: 0, stepDur: 60 / def.bpm / 4, total: 0 };
        if (isJ) { let mx = 0; def.notes.forEach(n => { mx = Math.max(mx, n[0] + n[2]); }); cur.total = mx + 4; }
    };

    return {
        supported: () => !unsupported,
        prime: () => { if (settings.music || settings.sfx) ensureCtx(); },
        suspend: () => { try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch (e) { /* ignore */ } },
        resume: () => { if (settings.music || settings.sfx) ensureCtx(); if (cur) cur.next = 0; },
        setMusic: v => { settings.music = !!v; saveSettings(); if (v) ensureCtx(); if (cur) cur.next = 0; },
        setSfx: v => { settings.sfx = !!v; saveSettings(); if (v) ensureCtx(); },
        // music
        play: (name, then) => {
            if (cur && cur.name === name && !cur.done) return;
            startTrack(name);
            if (cur && then) cur.then = then;
        },
        stop: () => { cur = null; },
        current: () => (cur && !cur.done ? cur.name : ''),
        tick: () => {
            if (!cur || cur.done || !settings.music || !running()) return;
            const now = ctx.currentTime;
            if (cur.next < now - 0.3) cur.next = now + 0.05;
            let guard = 0;
            while (cur.next < now + 0.2 && guard++ < 24) {
                schedStep(cur, cur.next, cur.step);
                cur.next += cur.stepDur; cur.step++;
                if (cur.jingle && cur.step >= cur.total) {
                    const th = cur.then;
                    if (th) startTrack(th); else cur.done = true;
                    break;
                }
            }
        },
        // sfx (rate-limited where they can spam)
        rifle: () => { if (gate('rifle', 60)) tone(620, 'square', 0.04, 0.014, 420); },
        erifle: () => { if (gate('erifle', 60)) tone(340, 'sawtooth', 0.05, 0.014, 240); },
        cannon: () => { if (gate('cannon', 80)) { tone(200, 'sawtooth', 0.12, 0.05, 90); boom(0.1, 0.06, 2500); } },
        rocket: () => { if (gate('rocket', 90)) { hiss(0.3, 0.05, 900, 2600); tone(180, 'sawtooth', 0.25, 0.04, 320); } },
        shellup: () => { if (gate('shellup', 90)) { tone(120, 'triangle', 0.25, 0.06, 60); boom(0.15, 0.08, 900); } },
        shellland: () => { if (gate('shellland', 50)) { boom(0.35, 0.16, 1500); tone(90, 'sawtooth', 0.28, 0.06, 40); } },
        hit: () => { if (gate('hit', 45)) tone(1100, 'square', 0.03, 0.02, 700); },
        tink: () => { if (gate('tink', 60)) { tone(2400, 'triangle', 0.06, 0.04, 1700); tone(3100, 'sine', 0.05, 0.02, 2600, 0.02); } },
        pop: () => { if (gate('pop', 40)) { boom(0.2, 0.12, 2200); tone(190, 'sawtooth', 0.15, 0.045, 70); } },
        blast: () => { boom(0.5, 0.22, 2400); tone(110, 'sawtooth', 0.4, 0.07, 45); },
        big: () => { boom(1.2, 0.34, 2600); tone(80, 'sawtooth', 1.0, 0.1, 35); },
        hurt: () => { boom(0.5, 0.3, 1400); tone(160, 'sawtooth', 0.5, 0.11, 45); },
        strike: () => { tone(300, 'sawtooth', 0.5, 0.05, 900); hiss(0.5, 0.05, 1000, 4000); },
        emp: () => { tone(90, 'sawtooth', 0.7, 0.09, 700); tone(1800, 'sine', 0.5, 0.05, 200); hiss(0.6, 0.06, 500, 6000); },
        salvo: () => { for (let i = 0; i < 4; i++) tone(500 + i * 90, 'triangle', 0.14, 0.04, 1100, i * 0.07); },
        warp: () => { tone(300, 'sine', 1.6, 0.06, 1800); hiss(1.4, 0.04, 400, 4000); },
        deploy: () => { if (gate('deploy', 70)) { tone(500, 'square', 0.06, 0.035); tone(760, 'square', 0.09, 0.035, null, 0.06); } },
        heal: () => { if (gate('heal', 400)) tone(900, 'sine', 0.2, 0.025, 1300); },
        capture: () => { tone(660, 'triangle', 0.12, 0.06); tone(880, 'triangle', 0.12, 0.06, null, 0.1); tone(1320, 'triangle', 0.25, 0.06, null, 0.2); },
        lost: () => { tone(500, 'sawtooth', 0.15, 0.06, 300); tone(300, 'sawtooth', 0.3, 0.06, 150, 0.15); },
        alarm: () => { if (gate('alarm', 600)) { tone(880, 'square', 0.1, 0.04); tone(660, 'square', 0.1, 0.04, null, 0.12); } },
        tele: () => { if (gate('tele', 200)) { tone(1400, 'sine', 0.3, 0.04, 300); hiss(0.3, 0.03, 2500, 800); } },
        charge: () => { if (gate('charge', 300)) tone(200, 'sawtooth', 0.8, 0.05, 1200); },
        beam: () => { if (gate('beam', 200)) { tone(110, 'sawtooth', 0.6, 0.09, 80); hiss(0.6, 0.07, 1200, 3000); } },
        stomp: () => { boom(0.7, 0.3, 500); tone(60, 'sawtooth', 0.6, 0.12, 30); },
        quake: () => { boom(1.4, 0.3, 300); tone(45, 'sawtooth', 1.4, 0.1, 28); },
        thunder: () => { boom(0.9, 0.26, 700); hiss(0.4, 0.06, 3000, 500); },
        meteor: () => { if (gate('meteor', 120)) { tone(800, 'sawtooth', 0.6, 0.04, 90); boom(0.6, 0.22, 1600); } },
        vent: () => { if (gate('vent', 120)) { boom(0.5, 0.18, 900); hiss(0.5, 0.05, 600, 2000); } },
        roar: () => { tone(90, 'sawtooth', 0.9, 0.12, 60); tone(140, 'square', 0.8, 0.06, 90, 0.05); boom(0.9, 0.2, 700); },
        coin: () => { if (gate('coin', 70)) { tone(1200, 'sine', 0.09, 0.05); tone(1800, 'sine', 0.16, 0.05, null, 0.06); } },
        buy: () => { tone(600, 'square', 0.06, 0.045); tone(900, 'square', 0.06, 0.045, null, 0.06); tone(1400, 'square', 0.14, 0.045, null, 0.12); },

        back: () => tone(420, 'triangle', 0.08, 0.05, 280),

function endlessMission() { return JSON.parse(JSON.stringify(ENDLESS_MISSION)); }
function endlessTick(r) {
    const len = r.m.waveLen, sec = r.t / 60;
    const w = Math.floor(sec / len) + 1;
    if (w > (r.endWave || 0)) {
        r.endWave = w;
        r.stats.score += w > 1 ? 100 * (w - 1) : 0;
        // planet rotates every 4 waves: changes the backdrop and the hazard
        r.planetNow = Math.floor((w - 1) / 4) % 4;
        const k = Math.min(w, 40), pool = ['rifle', 'rifle', 'shield', 'rocket', 'drone'];
        if (w >= 3) pool.push('artillery', 'sapper');
        if (w >= 5) pool.push('medic', 'walker');
        if (w >= 9) pool.push('walker', 'rocket', 'sapper');
        let foes = 0; for (const u of r.units) if (!u.dead && u.side === 1) foes++;
        const n = foes > 90 ? 0 : Math.min(3 + Math.floor(k * 0.8), 20), t0 = sec + 1;
        for (let i = 0; i < n; i++) {
            const u = i % 4 === 0 ? pick(pool) : (R() < 0.5 ? 'rifle' : pick(pool));
            r.waves.push({ t: t0 + i * rr(0.7, 1.6), lane: -1, u, n: u === 'walker' ? 1 : 1 + (u === 'rifle' ? 1 : 0), gap: 0.5, hpM: 1 + 0.06 * (w - 1) });
        }
        if (w % 5 === 0) { r.etank = r.etank || null; r.champWave = w; }
        r.emM = (r.m.em || 1) * (1 + 0.05 * (w - 1));
        r.edM = (r.m.ed || 1) * (1 + 0.025 * (w - 1));
        if (w > 1) { r.banner = { text: 'WAVE ' + w, sub: w % 5 === 0 ? 'A champion approaches' : 'They keep coming', t: 0, T: 2, color: '#ffd600' }; }
        // hazards by planet
        r.vents = []; r.m.meteor = null; r.m.ion = null;
        if (r.planetNow === 0) r.vents = [{ lane: 1, x: 680, per: 8, ph: 2, warn: 1.6, r: 54, dmg: 70, phase: 0 }, { lane: 2, x: 760, per: 8, ph: 5, warn: 1.6, r: 54, dmg: 70, phase: 0 }];
        if (r.planetNow === 1) r.m.ion = { t0: 0, every: 22, dur: 4, bolt: 0.6, warn: 0.9, dmg: 55, stun: 1.4 }, r.nextIon = r.t + 600;
        if (r.planetNow === 2) r.m.meteor = { t0: 0, every: 10, n: 3, r: 60, warn: 1.7, dmg: 120, x0: 320, x1: 1000 }, r.nextMeteor = r.t + 300;
        if (r.planetNow === 3) { r.m.ion = { t0: 0, every: 26, dur: 4, bolt: 0.6, warn: 0.9, dmg: 55, stun: 1.4 }; r.nextIon = r.t + 800; r.m.meteor = { t0: 0, every: 13, n: 2, r: 60, warn: 1.7, dmg: 120, x0: 320, x1: 1000 }; r.nextMeteor = r.t + 500; }
    }
    if (r.champWave && !r.champ) {
        // the endless champion is a regular etank with growing hp
        r.champ = true;
        const cfg = { hp: 700 + 260 * r.champWave, resp: 0, first: 0, dmg: 21 + r.champWave, cd: 0.6, ab: ['barrage', 'guard'], name: 'CHAMPION' };
        r.m.etank = cfg;
        const t = mkTank(1, cfg); t.defeated = false;
        r.etank = t; r.units.push(t);
        spawnEtank(t);
        r.champ = false; r.champWave = 0;
    }
}

                } });

            });

/* ---------- Warlord duel champion / enemy tank AI ---------- */
function stepETank(t) {
    const r = run, cfg = r.m.etank || {};
    if (t.hidden) { if (r.t >= (t.respT || 0) && !r.over) spawnEtank(t); return; }
    if (t.dead) { if (t.defeated || r.over) return; if (--t.respT <= 0) spawnEtank(t); return; }
    t.ph += DT * 3;
    if (t.fl > 0) t.fl--;
    if (t.atk > 0) t.atk--;
    if (t.guard > 0) t.guard -= DT;
    if (t.stun > 0) { t.stun -= DT; t.mv = false; return; }
    if (t.cdT > 0) t.cdT -= DT;
    t.recoil *= 0.86;
    const duel = r.m.obj === 'duel';
    const hpf = t.hp / t.mhp;
    const p2 = hpf < 0.5;
    if (p2 && t.phase === 1) { t.phase = 2; r.banner = { text: 'KAEL ENRAGED', sub: 'Faster fire, faster shells', t: 0, T: 2, color: '#ff5470' }; }
    // targets: nearest visible ally (tank preferred in duels)
    let foe = null, fd = 1e9;
    for (let i = 0; i < r.units.length; i++) {
        const u = r.units[i];
        if (u.dead || u.side !== 0 || u.hidden || u.type === 'hauler') continue;
        const d = Math.abs(u.x - t.x) + (u.hero && duel ? -140 : 0);
        if (d < fd) { fd = d; foe = u; }
    }
    // lane choice
    t.laneT = (t.laneT || 0) - DT;
    if (t.laneT <= 0) {
        t.laneT = rr(3.5, 6);
        if (foe && (duel || R() < 0.5)) t.lane = foe.hero ? nearestLane(foe.ly) : foe.lane; else t.lane = ri(0, r.nl - 1);
    }
    const range = (cfg.range || 235);
    const keep = range * 0.78;
    let goal = t.x;
    if (foe) goal = foe.x + keep;
    else goal = 900;
    const retreat = !duel && hpf < 0.28;
    if (retreat) goal = 1030;
    if (duel && foe && foe.hero && Math.abs(foe.x - t.x) < 150) goal = foe.x + keep + 30;
    // the champion never leaves its own army's cover far: stay within 420px of its nearest unit in normal missions
    if (!duel) {
        let front = 1e9;
        for (let i = 0; i < r.units.length; i++) { const u = r.units[i]; if (!u.dead && u.side === 1 && !u.hero && !u.air && u.x < front) front = u.x; }
        if (front < 1e8) goal = Math.max(goal, front - 30);
    }
    const dx = goal - t.x;
    let sp = t.dashT > 0 ? 320 : t.spd;
    if (Math.abs(dx) > 8) t.x += Math.sign(dx) * Math.min(Math.abs(dx), sp * DT);
    t.mv = Math.abs(dx) > 8; t.face = -1;
    t.x = clamp(t.x, 260, Math.min(1170, r.edgeX - 30));
    const gy = laneY(clamp(t.lane, 0, r.nl - 1));
    t.ly += clamp(gy - t.ly, -TANK.laneSpeed * DT, TANK.laneSpeed * DT);
    if (retreat && t.x > 980) t.hp = Math.min(t.mhp, t.hp + 30 * DT);
    if (t.dashT > 0) {
        t.dashT -= DT;
        for (let i = 0; i < r.units.length; i++) { const u = r.units[i]; if (!u.dead && u.side === 0 && !u.hidden && Math.abs(u.x - t.x) < 40 && (u.hero ? Math.abs(u.ly - t.ly) < 40 : u.lane === nearestLane(t.ly)) && !(t.dashHit && t.dashHit.has(u.id))) { (t.dashHit = t.dashHit || new Set()).add(u.id); hurt(u, u.hero ? 55 : 100, 'beam', 1, { dir: 0, raw: true }); } }
    }
    tankCombat(t, range, (cfg.dmg || 22) * r.edM, (cfg.cd || 0.55) * (p2 ? 0.75 : 1));
    // abilities
    const ab = cfg.ab || [];
    if (ab.includes('barrage') && foe) {
        t.abT = (t.abT == null ? 3 : t.abT) - DT;
        if (t.abT <= 0) {
            t.abT = (p2 ? 5.2 : 7.2);
            const n = p2 ? 4 : 3, fx = foe.x, fy = foe.hero ? foe.ly : laneY(foe.lane);
            for (let k = 0; k < n; k++) {
                const px = fx + (k - (n - 1) / 2) * 62 + rr(-18, 18), py = clamp(fy - 10 + rr(-30, 30), 150, 500);
                addDang({ kind: 'circle', x: px, y: py, r: 58, T: 1.25 + k * 0.16, side: 1, fn: d => explode(d.x, d.y, d.r, 85 * r.edM, 'shell', 1, { c: '#ff8a50' }) });
            }
            if (!HEADLESS) AudioEngine.shellup();
        }
    }
    if (ab.includes('guard')) {
        t.gT = (t.gT == null ? 9 : t.gT) - DT;
        if (t.gT <= 0 && hpf < 0.85) { t.gT = p2 ? 12 : 16; t.guard = 4.2; addTxt(t.x, t.ly - 70, 'GUARD UP - EMP breaks it', '#7fd8ff', 1.8); if (!HEADLESS) AudioEngine.tink(); }
    }
    if (ab.includes('dash') && p2 && foe) {
        t.dT = (t.dT == null ? 4 : t.dT) - DT;
        if (t.dT <= 0 && !t.dashT) {
            t.dT = 11;
            addTxt(t.x, t.ly - 70, 'CHARGING!', '#ff5470', 1.2);
            addDang({ kind: 'lane', lane: nearestLane(t.ly), x0: 60, x1: t.x, T: 1.1, side: 1, fn: () => { t.dashT = 1.1; t.dashHit = new Set(); t.dashDir = -1; if (!HEADLESS) AudioEngine.charge(); } });
        }
    }
    if (t.dashT > 0) t.x -= 0;   // dash speed is applied through `sp` above
}

/* ==========================================================================
 * SECTION 7 - AUTO-PILOT AI (the demo AND the balance-test bot)
 *  tank driver: lane choice, frontline holding, kiting rockets, objective goals, boss target order, retreat + warp, telegraph dodging
 *  skill AI: EMP / Strike / Salvo when the situation pays for them
 *  deploy AI: reads the enemy mix and picks counters + lanes from the loadout
 *  shop AI: fixed build order; loadout AI: mission-aware deck
 * It is intentionally imperfect: it reacts to new threats after a delay, plans every few frames, aims with positional error,
 * misjudges occasionally, and sometimes wastes a skill. The `casual` profile is a much sloppier player.
 * ========================================================================== */
const PROFILES = {
    normal: { name: 'normal', react: 0.2, plan: 9, err: 14, sk: 0.92, dep: 34, depNoise: 0.18, dodge: 0.92, warp: true, mistakes: 0.05 },
    casual: { name: 'casual', react: 0.5, plan: 26, err: 40, sk: 0.2, dep: 84, depNoise: 0.45, dodge: 0.5, warp: false, mistakes: 0.18 }
};

function foesList(r, needVis) {
    const a = [];
    for (let i = 0; i < r.units.length; i++) {
        const u = r.units[i];
        if (u.dead || u.side !== 1 || u.hidden) continue;
        if (needVis && r.fog && !u.vis) continue;
        a.push(u);
    }
    return a;
}
function allyFront(r, lane) {
    let fx = -1;
    const l = r.gl[0][lane];
    for (let i = 0; i < l.length; i++) if (l[i].x > fx && l[i].type !== 'medic') fx = l[i].x;
    return fx;
}
function laneThreat(r, lane) {
    // how badly does this lane need the tank? enemy weight near our line minus our own weight
    let e = 0, a = 0;
    const l1 = r.gl[1][lane], l0 = r.gl[0][lane];
    for (let i = 0; i < l1.length; i++) { const u = l1[i]; const w = (u.cls === 'veh' ? 2.5 : 1) * (1 + (1200 - u.x) / 1200); e += w; }
    for (let i = 0; i < l0.length; i++) a += l0[i].cls === 'veh' ? 2 : 0.8;
    // walls/turret/structure objectives
    r.structs.forEach(s => { if (!s.dead && s.side === 1 && (s.k === 'target' || s.k === 'turret') && s.lane === lane) e += 1.5; });
    if (r.haulers) r.haulers.forEach(h => { if (!h.dead && !h.exited && h.lane === lane) e += 2.5 + l1.filter(f => f.x > h.x && f.x < h.x + 350).length * 1.2; });
    if (r.boss) e += lane === 1 ? 0.5 : 0;
    return e - a * 0.55;
}

/* ---------- entry point per tick ---------- */
function aiStep(r) {
    const P = r.prof, t = r.tank;
    if (!r.ai) r.ai = { lane: t.lane, laneT: 0, mode: 'fight', goal: 300, jit: rr(-1, 1), planT: 0, depT: rr(20, 60), skT: 0, dodgeX: null, dodgeLane: -1, dodgeUntil: 0, laneHold: 0, gapT: 0, tgtPart: null, warpTry: 0 };
    const A = r.ai;
    if (t.dead) { t.inp.dx = 0; return; }
    if (t.warping) return;
    if (r.t >= (A.override || 0)) {
        if (r.t >= A.planT) { A.planT = r.t + P.plan + ri(0, 3); tankPlan(r, A); }
        tankDodge(r, A);
        // drive
        const inp = t.inp;
        const goal = A.dodgeX != null && r.t < A.dodgeUntil ? A.dodgeX : A.goal + A.jit * P.err;
        const dx = goal - t.x;
        inp.dx = Math.abs(dx) < 6 ? 0 : clamp(dx / 36, -1, 1);
        inp.lane = A.dodgeLane >= 0 && r.t < A.dodgeUntil ? A.dodgeLane : A.lane;

/* ---------- flow: missions ---------- */

function beginMission(idx) {

    HEADLESS = false;
    const fails = game.fails[idx] || 0;
    const r = startRun(m, { seed: fieldSeed(), idx, god: DBG.god, auto: game.auto, fails, deck: save.deck.slice(0, deckSlots()).filter(unitOwned) });
    if (!r.deck.length) r.deck = ['rifle'];
    ui.bannerQ = []; ui.hud = {}; ui.card = null; ui.overSeen = false; ui.lastBoss = null; ui.bottomKey = '';
    r.bannerQ = [];
    if (idx % 4 === 0) r.bannerQ.push({ text: 'PLANET ' + (m.planet + 1), sub: PLANETS[m.planet].name, sub2: PLANETS[m.planet].sub, t: 0, T: 2.6, color: PLANETS[m.planet].color });
    r.bannerQ.push({ text: 'MISSION ' + m.id, sub: m.name, sub2: m.sub, t: 0, T: 2.6, color: '#ffe27a' });
    r.banner = r.bannerQ.shift();
    if (idx > 0 && !save.seen['m:' + idx] && !fails) r.cardQ.unshift('m:' + idx);
    if (fails) toast(mercyText(Math.min(4, fails)), 380);
    AudioEngine.play(planetMusic(m)); AudioEngine.banner();
    buildBottom(r); syncChrome(); syncAutoBtn(); syncPauseBtn(); layoutCanvas();
    announce('Mission ' + m.id + ': ' + m.name + '. ' + m.intent);
    later(() => { if (run === r && game.scene === 'mission' && !game.paused && !fails) toast(esc(m.teach), innerWidth < 620 ? 340 : 560); }, 2200);
}
function beginEndless() {
    hidePanels(); clearTimers();
    game.scene = 'mission'; game.mode = 'endless'; game.idx = -1; game.paused = false;
    HEADLESS = false;
    const r = startRun(endlessMission(), { seed: fieldSeed(), idx: -1, endless: true, god: DBG.god, auto: game.auto, deck: save.deck.slice(0, deckSlots()).filter(unitOwned) });
    if (!r.deck.length) r.deck = ['rifle'];
    ui.hud = {}; ui.card = null; ui.overSeen = false; ui.lastBoss = null; ui.bottomKey = '';
    r.bannerQ = []; r.banner = { text: 'ENDLESS', sub: 'Eternal Invasion', sub2: 'Hold the line as long as you can', t: 0, T: 2.6, color: '#ffd600' };

}
function restartCurrent() { if (game.mode === 'endless') beginEndless(); else beginMission(game.idx); }
function recommended() {
    if (clearedCount() >= MISSION_COUNT && save.done) return 'endless';
    return frontier();
}

function afterMissionStep() {
    const r = run;
    if (!r || game.scene !== 'mission') return;
    if (r.banner) { r.banner.t += DT; if (r.banner.t >= r.banner.T) r.banner = (r.bannerQ && r.bannerQ.shift()) || null; }
    else if (r.bannerQ && r.bannerQ.length && !ui.card) r.banner = r.bannerQ.shift();
    if (r.cardQ.length && !ui.card && !r.over && !r.banner) {

        } else { AudioEngine.play('defeat', null); r.banner = { text: r.endless ? 'OVERRUN' : 'MISSION FAILED', sub: r.failWhy || '', t: 0, T: 2.2, color: '#ff6b6b' }; }

    const res = missionResult(r);
    applyResult(r, res);
    game.fails[game.idx] = res.clear ? 0 : (game.fails[game.idx] || 0) + 1;
    if (res.clear) showTally(res); else showFail(res);

    const tags = [OBJ_LINE[m.obj] || m.brief || 'Complete the objective'];
    if (m.par) tags.push('Par time ' + m.par + 's for three stars'); else tags.push('Keep the base healthy for three stars');
    const hz = []; if (m.vents) hz.push('lava vents'); if (m.meteor) hz.push('meteors'); if (m.ion) hz.push('ion storms'); if (m.fog) hz.push('fog'); if (m.lowg) hz.push('low gravity'); if (m.collapse) hz.push('collapse');
    if (hz.length) tags.push('Hazards: ' + hz.join(', '));
    return { type: 'MISSION ' + m.id + ' BRIEFING', title: m.name.toUpperCase(), text: m.intent, counter: tags, icon: m.boss ? m.boss === 'dread' ? 'dread' : m.boss === 'colossus' ? 'colossus' : 'citadel' : (OBJ_ICON[m.obj] || 'point') };
}
function showCard(key) {

/* ---------- tally ---------- */
function showTally(res) {

        ['Enemies destroyed', res.kills], ['Units lost', res.lost], ['Tank losses', res.tankDeaths], ['Time', Math.round(res.secs) + 's' + (m.par ? ' (par ' + m.par + 's)' : '')],
        ['Mission reward' + (res.first ? '' : ' (replay 50%)'), r.clearBonus], ['Star bonus', r.starBonus], ['Salvage', r.killCr]
    ];

    h += '<div class="muted" style="margin-bottom:4px">&#9733; clear &middot; &#9733;&#9733; base stayed above 45% &middot; &#9733;&#9733;&#9733; base above 72%, at most one tank loss' + (m.par ? ', under ' + m.par + 's' : '') + '</div>';

    if (res.grant) h += '<div class="pop" style="animation-delay:.8s"><span class="tag new">NEW UNIT: ' + esc(UNITS[res.grant].name.toUpperCase()) + '</span></div>';
    if (m.boss) h += '<div class="pop" style="animation-delay:.9s"><span class="tag new">PLANET ' + (m.planet + 1) + ' SECURED - ' + PLANETS[m.planet].name + '</span></div>';
    if (finale) h += '<div class="pop" style="animation-delay:1s"><span class="tag new">CAMPAIGN COMPLETE - ENDLESS MODE UNLOCKED</span></div>';
    h += '<div class="row"><button class="btn primary" data-act="tnext">' + (finale ? 'FINALE' : 'GARAGE') + '</button><button class="btn" data-act="treplay">REPLAY</button><button class="btn" data-act="tmap">MAP</button></div>';
    h += '<div class="auto-note" id="auto-note"></div></div>';
    showPanel('tally', h, true);
    clearTimers();
    const starEl = $('t-stars');
    for (let i = 1; i <= res.stars; i++) later(() => { if (ui.panel === 'tally') { starEl.innerHTML = starsHtml(i); AudioEngine.star(i - 1); } }, 350 + i * 420);
    let shown = 0; const target = res.cr;

function tallyNext() {

    openGarage(() => showMap());

function upItemHtml(u, flash) {
    const lv = upLevel(u.id), maxed = lv >= u.max, cost = maxed ? 0 : u.cost[lv];
    let pips = ''; for (let i = 0; i < u.max; i++) pips += '<i class="' + (i < lv ? 'on' : '') + '"></i>';
    const can = !maxed && save.cr >= cost;
    const label = maxed ? 'MAX' : (can ? 'BUY ' + cost : cost + ' CR');
    const desc = maxed ? u.desc(lv) : 'Next: ' + u.desc(lv + 1);
    return '<div class="item"><div class="top"><span class="name">' + esc(u.name) + '</span><span class="muted">' + lv + '/' + u.max + '</span></div><div class="pips">' + pips + '</div><div class="desc">' + esc(desc) + '</div>' +
        '<button class="btn buy' + (flash && flash.indexOf(u.id) >= 0 ? ' flash' : '') + '" data-act="buy" data-id="' + u.id + '"' + (can ? '' : ' disabled') + ' aria-label="' + esc(u.name) + ' ' + label + '">' + label + '</button></div>';
}
function unitItemHtml(id, flash) {
    const d = UNITS[id], s = UNIT_SHOP[id], own = unitOwned(id), lv = unitLevel(id);
    let pips = ''; for (let i = 0; i < UNIT_LV_MAX; i++) pips += '<i class="' + (own && i < lv ? 'on' : '') + '"></i>';
    let label, can, act, desc;
    if (!own) {
        const avail = unitAvailable(id);
        can = avail && save.cr >= s.unlock; act = 'buyunit';
        label = avail ? (can ? 'UNLOCK ' + s.unlock : s.unlock + ' CR') : 'AFTER MISSION ' + s.at;
        desc = d.role + '. ' + d.desc;
    } else if (lv >= UNIT_LV_MAX) { can = false; act = 'buylv'; label = 'MAX'; desc = d.desc + ' ' + d.counter; }
    else { const c = s.lv[lv - 1]; can = save.cr >= c; act = 'buylv'; label = can ? 'LEVEL UP ' + c : c + ' CR'; desc = 'Lv' + (lv + 1) + ': hp x' + LV_HP[lv] + ', damage x' + LV_DMG[lv] + '. ' + d.counter; }
    return '<div class="item' + (own ? '' : ' locked') + '"><div class="top"><span class="name">' + esc(d.name) + '</span><span class="muted">' + (own ? 'Lv' + lv : 'locked') + ' &middot; ' + d.cost + ' sup</span></div><div class="pips">' + pips + '</div><div class="desc">' + esc(desc) + '</div>' +
        '<button class="btn buy' + (flash && flash.indexOf(id) >= 0 ? ' flash' : '') + '" data-act="' + act + '" data-id="' + id + '"' + (can ? '' : ' disabled') + '>' + label + '</button></div>';

function missionTags(m) {
    const out = [OBJ_NAME[m.obj] || m.obj.toUpperCase()];
    const en = {}; (m.waves || []).forEach(w => { en[w.u] = 1; }); if (m.tr && m.tr.e) (m.tr.e.u instanceof Array ? m.tr.e.u : [m.tr.e.u]).forEach(u => { en[u] = 1; });
    Object.keys(en).forEach(k => { if (k !== 'rifle') out.push(UNITS[k].name); });
    if (m.boss) out.push('BOSS: ' + BOSS_INFO[m.boss].name);
    if (m.etank) out.push(m.etank.name || 'Enemy tank');
    if (m.vents) out.push('Lava vents'); if (m.meteor) out.push('Meteors'); if (m.ion) out.push('Ion storms'); if (m.fog) out.push('Fog'); if (m.lowg) out.push('Low gravity'); if (m.collapse) out.push('Collapse');
    if (m.structs && m.structs.some(s => s.k === 'bridge')) out.push('Bridge'); if (m.structs && m.structs.some(s => s.k === 'point')) out.push('Outposts'); if (m.structs && m.structs.some(s => s.k === 'wall' && s.side === 1)) out.push('Enemy walls');
    if (m.lanes.length > 1) out.push(m.lanes.length + ' lanes');
    return out;
}

    if (joyS.active && Math.abs(joyS.y) > 0.62 && r.t - joyS.laneT > 26) { joyS.laneT = r.t; laneStep(joyS.y > 0 ? 1 : -1); }

/* touch joystick */
(function () {
    const base = $('joy'), knob = base.querySelector('i');
    const upd = e => {
        const rc = base.getBoundingClientRect(), cx = rc.left + rc.width / 2, cy = rc.top + rc.height / 2, max = rc.width / 2 - 8;
        let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.min(Math.hypot(dx, dy), max), a = Math.atan2(dy, dx);
        dx = Math.cos(a) * d; dy = Math.sin(a) * d;
        knob.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
        joyS.x = dx / max; joyS.y = dy / max;
    };
    const end = e => { if (joyS.id !== e.pointerId) return; joyS.active = false; joyS.id = null; joyS.x = 0; joyS.y = 0; knob.style.transform = ''; };
    base.addEventListener('pointerdown', e => { e.preventDefault(); userTouched(); AudioEngine.prime(); joyS.active = true; joyS.id = e.pointerId; try { base.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } upd(e); });
    base.addEventListener('pointermove', e => { if (joyS.active && joyS.id === e.pointerId) { e.preventDefault(); upd(e); } });
    base.addEventListener('pointerup', end); base.addEventListener('pointercancel', end);
})();

/* ---------- main loop (fixed 60 Hz simulation) ---------- */
let lastFrame = null, acc = 0;
function tick() {
    ui.idle++;
    if (ui.toastT > 0 && --ui.toastT === 0) $('toast').classList.remove('show');
    if (game.scene === 'mission' && run) {
        if (ui.card) { ui.cardT--; if (ui.cardT <= 0 && (game.auto || ui.idle > 600)) dismissCard(); return; }
        if (game.paused) return;
        syncInput();
        stepRun();
        afterMissionStep();
    } else if (game.scene === 'menu') { /* paused */ }
    else sceneTick();
}
function loop(ts) {
    if (lastFrame === null) lastFrame = ts;
    let dt = ts - lastFrame; lastFrame = ts;
    if (dt > 250) dt = 250;
    acc += dt * DBG.speed;
    let n = 0;
    const cap = MAX_STEPS * Math.ceil(DBG.speed);
    while (acc >= FRAME_MS && n < cap) { tick(); acc -= FRAME_MS; n++; }
    if (n >= cap) acc = 0;
    try { if (run && (game.scene === 'mission' || game.scene === 'menu' || game.scene === 'tally' || game.scene === 'fail' || game.scene === 'endover')) updateHud(); render(ts); AudioEngine.tick(); } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
}
