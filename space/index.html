<style>
:root {
  color-scheme: dark;
  --bg: #05070f; --panel: rgba(9, 14, 30, .95); --line: rgba(126, 162, 255, .28);
  --ink: #e8f0ff; --dim: #8cb0ff; --cy: #7ee0ff; --gold: #ffd873; --ok: #7cff9e; --bad: #ff6b6b;

}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; user-select: none; -webkit-user-select: none;
  touch-action: none; overscroll-behavior: none; }
#app { position: fixed; inset: 0; }
canvas#game { position: absolute; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; background: #02030a; }

/* ---------- top bar (brand + controls) ---------- */
#topbar { position: absolute; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 12px; padding-top: max(7px, env(safe-area-inset-top)); background: linear-gradient(180deg, rgba(9,14,29,.9), rgba(9,14,29,.55));
  border-bottom: 1px solid var(--line); }
@supports (backdrop-filter: blur(8px)) or (-webkit-backdrop-filter: blur(8px)) {
  #topbar { background: linear-gradient(180deg, rgba(9,14,29,.74), rgba(9,14,29,.4)); backdrop-filter: blur(8px) saturate(1.2); -webkit-backdrop-filter: blur(8px) saturate(1.2); }
}
.brand { display: flex; align-items: center; gap: 9px; min-width: 0; }
.brand-logo { width: 30px; height: 30px; flex: none; filter: drop-shadow(0 0 4px rgba(96,212,255,.55)); }
.game-title { display: flex; flex-direction: column; line-height: 1.12; font-weight: 800; white-space: nowrap; }
.game-title .l1, .game-title .l2 { background: linear-gradient(90deg, #eaf9ff, #7ee0ff 55%, #7cd8ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.game-title .l1 { font-size: 16px; } .game-title .l2 { font-size: 12.5px; font-weight: 700; opacity: .92; }
.studio { font-size: 9.5px; font-weight: 800; color: #8cb0ff; letter-spacing: .6px; text-transform: uppercase; margin-left: .5em; opacity: .85; -webkit-text-fill-color: #8cb0ff; }
.ctrl { display: flex; gap: 6px; align-items: center; flex: none; }
.ibtn { min-width: 36px; height: 36px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; border: 1px solid #7ea2ff; border-radius: 10px;
  background: #19284d; color: var(--ink); font: 800 12px system-ui, sans-serif; letter-spacing: .4px; text-decoration: none; cursor: pointer;
  transition: filter .15s, box-shadow .15s, border-color .15s, transform .1s; }
.ibtn svg { width: 18px; height: 18px; display: block; }
.ibtn:hover, .ibtn:focus-visible { filter: brightness(1.18); border-color: #bcd6ff; box-shadow: 0 0 0 3px rgba(126,162,255,.25), 0 0 12px rgba(124,216,255,.5); outline: none; }
.ibtn:active { transform: scale(.94); }
.ibtn.on { border-color: var(--ok); box-shadow: 0 0 9px rgba(124,255,158,.32); }
.ibtn.off { opacity: .6; }
.ibtn.txt { padding: 0 10px; }
.ibtn.link { display: inline-flex; }

/* ---------- HUD strip ---------- */
#hud { position: absolute; left: 0; right: 0; top: var(--top-h); z-index: 9; display: flex; flex-wrap: wrap; align-items: center; gap: 5px 6px; padding: 5px 10px; pointer-events: none; }

  font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
@supports (backdrop-filter: blur(4px)) { .chip { backdrop-filter: blur(4px); } }
.chip .lbl { font-size: 9px; letter-spacing: 1.4px; font-weight: 800; color: var(--dim); }
.chip b { font-weight: 900; }
#v-score { color: var(--ink); } #v-coin { color: var(--gold); }
.chip .nm { color: #b8c8ee; font-weight: 700; }
.ships { display: inline-flex; gap: 3px; }
.ships svg { width: 16px; height: 16px; }
.ships svg.on { fill: #7cd8ff; } .ships svg.off { fill: rgba(124,216,255,.16); }
.ships.low svg.on { fill: #ff8a6a; }
.xpbar { width: 44px; height: 6px; border-radius: 3px; background: rgba(126,162,255,.2); overflow: hidden; }
.xpbar i { display: block; height: 100%; width: 0; background: var(--gold); }
.chip.pu { gap: 4px; padding: 3px 8px; font-weight: 800; font-size: 12px; }
.chip.pu i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 5px; color: #05070f; font-size: 11px; font-weight: 900; }
#btn-bomb { pointer-events: auto; cursor: pointer; color: var(--ink); font-family: inherit; }
#btn-bomb svg { width: 16px; height: 16px; fill: #ff9a6a; }
#btn-bomb:disabled { opacity: .45; cursor: default; }
#btn-bomb:not(:disabled):hover, #btn-bomb:not(:disabled):focus-visible { border-color: #ffb08a; box-shadow: 0 0 10px rgba(255,150,100,.5); outline: none; }
#hud[hidden], .chip[hidden] { display: none; }

#toast { position: absolute; left: 50%; transform: translateX(-50%); bottom: 14px; max-width: 92vw; z-index: 12; background: rgba(15,23,42,.92); border: 1px solid rgba(255,216,115,.45);
  padding: 9px 20px; border-radius: 20px; font-size: 13px; font-weight: 700; letter-spacing: .3px; text-align: center; opacity: 0; transition: opacity .5s; pointer-events: none; }
#toast.show { opacity: 1; } #toast b { color: var(--gold); }
#sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- panels ---------- */
#panels { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.panel { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 12px; background: rgba(3,6,16,.78); pointer-events: auto; overflow-y: auto; touch-action: pan-y; }
.panel.show { display: flex; }
.panel.clear { background: rgba(3,6,16,.5); }
.panel.top { background: rgba(3,6,16,.4); align-items: flex-start; padding-top: calc(var(--top-h) + 52px); }
.panel.top .card { margin: 0 auto; }
.card { position: relative; width: min(560px, 100%); max-height: 100%; margin: auto; overflow-y: auto; background: var(--panel); border: 1px solid rgba(126,220,255,.4); border-radius: 18px; padding: 22px 24px; text-align: center;
  box-shadow: 0 0 0 1px rgba(126,162,255,.08), 0 0 32px rgba(96,212,255,.18), 0 20px 60px rgba(0,0,0,.6); }
.card h1 { font-size: 34px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; background: linear-gradient(90deg, #eaf9ff, #7ee0ff 55%, #7cd8ff); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 4px; }
.card h2 { font-size: 22px; font-weight: 900; letter-spacing: 1px; color: var(--cy); margin-bottom: 8px; }
.card h3 { font-size: 16px; color: var(--gold); }
.card p { margin: 6px 0; color: #cbd5e1; font-size: 14px; line-height: 1.45; }
.card .muted { color: #94a3b8; font-size: 12px; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.card .stack { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; align-items: stretch; }
.card .row.sticky { position: sticky; bottom: -22px; padding: 10px 0 2px; margin-top: 8px; background: linear-gradient(rgba(9,14,30,0), var(--panel) 35%); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; padding: 8px 16px; border: 1px solid #7ea2ff; border-radius: 10px; background: #19284d; color: var(--ink);
  font: 800 13px system-ui, sans-serif; letter-spacing: .5px; cursor: pointer; text-decoration: none; transition: filter .15s, box-shadow .15s, transform .1s; }
.btn:hover:not(:disabled), .btn:focus-visible { filter: brightness(1.2); box-shadow: 0 0 0 3px rgba(126,162,255,.25), 0 0 14px rgba(124,216,255,.45); outline: none; transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.primary { border-color: var(--cy); background: linear-gradient(180deg, #2a5fb0, #19284d); padding: 12px 26px; font-size: 15px; box-shadow: 0 0 0 1px rgba(126,220,255,.15), 0 4px 18px rgba(60,150,255,.28); }
.btn.on { border-color: var(--ok); color: #d8ffe4; }
.btn.danger { border-color: var(--bad); color: #ffb0b0; background: #3a1420; }
.card .stack .btn { padding: 11px 16px; font-size: 14px; }
.auto-note { margin-top: 12px; font-size: 12px; color: #64789e; min-height: 16px; }
.stars { display: inline-flex; gap: 4px; vertical-align: middle; }
.stars svg { width: 30px; height: 30px; }
.stars svg path { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
.stars svg.on path { fill: var(--gold); stroke: #f59e0b; filter: drop-shadow(0 0 5px rgba(255,216,115,.7)); }
.stars.small svg { width: 12px; height: 12px; } .stars.small { gap: 1px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; text-align: left; margin: 12px auto; max-width: 360px; font-size: 14px; }
.kv span:nth-child(odd) { color: #94a3b8; } .kv span:nth-child(even) { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.kv .gold { color: var(--gold) !important; }
.pop { animation: pop .45s cubic-bezier(.2,1.5,.4,1) both; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 2px 9px; font-size: 11px; font-weight: 800; letter-spacing: .4px; margin: 2px; color: #cbd5e1; }
.tag.new { border-color: var(--gold); color: var(--gold); } .tag.ctr { border-color: var(--ok); color: #a6f7bd; }
canvas.icon { width: 112px; height: 112px; display: block; margin: 0 auto 6px; background: rgba(126,162,255,.07); border-radius: 14px; border: 1px solid var(--line); }

/* shop */
.shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.coins { font-size: 20px; font-weight: 900; color: var(--gold); }
.shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; text-align: left; }
.item { background: rgba(30,41,74,.55); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.item .name { font-weight: 900; font-size: 14px; } .item .desc { font-size: 11.5px; color: #9fb0d4; min-height: 32px; line-height: 1.3; }
.pips { display: flex; gap: 3px; } .pips i { width: 16px; height: 6px; border-radius: 3px; background: #334155; } .pips i.on { background: var(--gold); }
.item .buy { padding: 6px 10px; min-height: 32px; font-size: 12px; }
.item .buy.flash, .coins.flash { animation: buyflash .5s; }
@keyframes buyflash { 0% { box-shadow: 0 0 0 0 rgba(255,216,115,.9); } 100% { box-shadow: 0 0 0 14px rgba(255,216,115,0); } }

/* map */
.map { display: flex; flex-direction: column; gap: 7px; margin: 6px 0 8px; }
.sec { display: flex; align-items: center; gap: 10px; padding: 8px 10px 22px; border-radius: 12px; border: 1px solid var(--line); text-align: left; position: relative; overflow: hidden; }
.sec .sn { width: 96px; flex: none; font-size: 11px; font-weight: 900; letter-spacing: 1px; line-height: 1.25; }
.sec .sn small { display: block; font-weight: 600; letter-spacing: 0; color: #9fb0d4; font-size: 10px; margin-top: 1px; }
.sec .nodes { display: flex; gap: 14px; flex: 1; justify-content: flex-start; flex-wrap: wrap; align-items: center; }
.sec.locked { opacity: .55; }
.node { position: relative; width: 44px; height: 44px; border-radius: 50%; background: #1e293b; border: 3px solid #475569; color: #e2e8f0; font: 900 13px system-ui, sans-serif; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center; }
.node.boss { border-radius: 12px; border-color: #ef4444; background: #3d0c14; }
.node.bonus { border-radius: 50%; width: 38px; height: 38px; border-style: dashed; border-color: #c4a5ff; background: #241a44; }
.node.cleared { border-color: var(--ok); background: #123d26; } .node.cleared.boss { border-color: #ff8a6a; background: #4a1a14; }
.node.open { border-color: var(--gold); background: #4a3712; animation: pulse 1.6s infinite; }
.node.locked { opacity: .45; cursor: not-allowed; }
.node.sel { outline: 3px solid #fff; outline-offset: 3px; }
.node .st { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 1px; white-space: nowrap; pointer-events: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,216,115,.55); } 50% { box-shadow: 0 0 0 9px rgba(255,216,115,0); } }
.brief { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
.brief h3 { margin: 0; } .brief p { margin: 3px 0; font-size: 12.5px; }

/* scores / settings / howto */
table.hs { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
table.hs th { color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-align: left; padding: 4px 8px; }
table.hs td { padding: 6px 8px; border-top: 1px solid rgba(255,255,255,.07); text-align: left; font-variant-numeric: tabular-nums; }
table.hs tr.me td { color: var(--gold); font-weight: 900; }
table.hs td:nth-child(1) { color: #64748b; width: 30px; } table.hs td:nth-child(3) { text-align: right; font-weight: 800; }
input.name { font: 900 34px ui-monospace, monospace; letter-spacing: 8px; text-align: center; width: 190px; text-transform: uppercase; padding: 8px; border-radius: 10px; border: 2px solid var(--gold); background: #0b1226; color: var(--gold); user-select: text; -webkit-user-select: text; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 4px; border-top: 1px solid rgba(255,255,255,.07); font-weight: 700; text-align: left; }
.toggle:first-of-type { border-top: 0; }
.legend { text-align: left; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
.legend kbd { background: #1e293b; border: 1px solid #475569; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--gold); font-family: inherit; font-weight: 800; }
.cardlink { color: #93c5fd; }

#btn-touchbomb { display: none; }
@media (pointer: coarse) { #btn-touchbomb { display: none; } }

/* narrow phones: compact bar; YouTube/Kitscript links move into the menu */
@media (max-width: 620px) {
  :root { --top-h: 50px; }
  #topbar { padding: 5px 8px; padding-top: max(5px, env(safe-area-inset-top)); gap: 6px; }
  .brand { gap: 6px; } .brand-logo { width: 26px; height: 26px; }
  .game-title .l1 { font-size: 13px; } .game-title .l2 { font-size: 10.5px; } .studio { font-size: 8.5px; }
  .ctrl { gap: 4px; } .ibtn { min-width: 34px; height: 34px; padding: 0 6px; border-radius: 9px; } .ibtn svg { width: 17px; height: 17px; }
  .ibtn.link { display: none; }
  #hud { padding: 4px 8px; gap: 4px; }
  .chip { padding: 2px 8px; min-height: 26px; font-size: 12px; gap: 5px; } .chip .lbl { font-size: 8.5px; letter-spacing: 1px; }
  .chip .nm { display: none; }
  .card { padding: 16px 14px; } .card h1 { font-size: 28px; letter-spacing: 2px; } .card h2 { font-size: 19px; }
  .shop-grid { gap: 7px; } .item { padding: 8px 9px; } .item .name { font-size: 12.5px; } .item .desc { font-size: 10.5px; min-height: 44px; }
  .item .buy { padding: 5px 6px; font-size: 11px; min-height: 30px; } .pips i { width: 11px; }
  .sec { padding: 6px 8px 20px; gap: 6px; } .sec .nodes { gap: 10px; } .sec .sn { width: 68px; font-size: 10px; } .sec .sn small { display: none; }
  .node { width: 38px; height: 38px; font-size: 12px; border-width: 2px; } .node.bonus { width: 34px; height: 34px; }
  .brief { grid-template-columns: 1fr; }
  #toast { bottom: max(10px, env(safe-area-inset-bottom)); font-size: 11.5px; padding: 7px 12px; border-radius: 14px; max-width: 94vw; }
}
@media (max-width: 440px) { .game-title .l2 .studio { display: none; } .ibtn.txt { padding: 0 6px; } .game-title .l1 { font-size: 12.5px; } }
@media (max-height: 460px) { :root { --top-h: 44px; } .brand-logo { width: 24px; height: 24px; } .ibtn { height: 30px; } .card { padding: 12px 14px; } .card h1 { font-size: 24px; } .panel.top { padding-top: 100px; } }
@media (prefers-reduced-motion: reduce) { .node.open, .pop, .item .buy.flash, .coins.flash { animation: none; } * { transition-duration: .01ms !important; } }
</style>

            gain.gain.linearRampToValueAtTime(vol, t + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain); gain.connect(bus);
            voices++;
            osc.onended = () => { voices--; osc.disconnect(); gain.disconnect(); };
            osc.start(t); osc.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const noise = (bus, t, dur, vol, ftype, f0, f1) => {
        if (voices >= 26) return;
        try {
            if (!noiseBuf) {
                noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            const src = ctx.createBufferSource(), filt = ctx.createBiquadFilter(), gain = ctx.createGain();
            src.buffer = noiseBuf; filt.type = ftype;
            filt.frequency.setValueAtTime(f0, t);
            if (f1) filt.frequency.exponentialRampToValueAtTime(f1, t + dur);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(filt); filt.connect(gain); gain.connect(bus);
            voices++;
            src.onended = () => { voices--; src.disconnect(); filt.disconnect(); gain.disconnect(); };
            src.start(t); src.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const sfxOk = () => settings.sfx && running();
    const gate = (key, ms) => {   // same key can't fire twice within `ms`
        const n = Date.now();
        if (lastAt[key] && n - lastAt[key] < ms) return false;
        lastAt[key] = n; return true;
    };
    const tone = (freq, type, dur, vol, slideTo, delay) => { if (!sfxOk()) return; note(sfxBus, ctx.currentTime + (delay || 0), freq, type, dur, vol, slideTo); };
    const boom = (dur, vol, cutoff) => { if (!sfxOk() || !gate('boom', 45)) return; noise(sfxBus, ctx.currentTime, dur, vol, 'lowpass', cutoff, 120); };
    const hiss = (dur, vol, f0, f1, delay) => { if (!sfxOk()) return; noise(sfxBus, ctx.currentTime + (delay || 0), dur, vol, 'highpass', f0, f1); };

    const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
    const degMidi = (root, scale, deg) => {
        const sc = SCALES[scale], oct = Math.floor(deg / 7), idx = ((deg % 7) + 7) % 7;
        return root + sc[idx] + 12 * oct;
    };
    const schedStep = (c, t, step) => {
        const d = c.def, stepDur = c.stepDur;
        if (c.jingle) {
            for (let i = 0; i < d.notes.length; i++) {
                const n = d.notes[i];
                if (n[0] === step) note(musBus, t, midiFreq(degMidi(d.root, d.scale, n[1])), d.wave, n[2] * stepDur * 0.95, 0.2);
            }
            return;
        }
        const bars = d.sections.length * 4, bar = Math.floor(step / 16) % bars, s = step % 16;
        const sec = d.sections[Math.floor(bar / 4)], bi = bar % 4, chord = sec.prog[bi];
        const motif = bi === 3 ? sec.fill : sec.lead, tok = motif[s];
        if (typeof tok === 'number') {
            let len = 1; while (s + len < 16 && motif[s + len] === 'T') len++;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, tok + chord)), d.wave, len * stepDur * 0.9, 0.11);
        }
        const bt = d.bass[s];
        if (typeof bt === 'number') note(musBus, t, midiFreq(degMidi(d.root - 12, d.scale, bt + chord)), 'triangle', stepDur * 1.6, 0.2);
        if (d.arp && s % d.arp.every === 0) {
            const k = (s / d.arp.every) | 0;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, chord + d.arp.pat[k % d.arp.pat.length])), 'square', stepDur * 0.7, 0.035);
        }
        const dr = (bi === 3 ? d.fill : d.drums).charAt(s);
        if (dr === 'k') note(musBus, t, 150, 'sine', 0.13, 0.42, 42);
        else if (dr === 's') { noise(musBus, t, 0.11, 0.2, 'highpass', 1800); note(musBus, t, 210, 'triangle', 0.07, 0.12, 120); }
        else if (dr === 'h') noise(musBus, t, 0.035, 0.09, 'highpass', 7000);
    };
    const startTrack = name => {
        const isJ = !!JINGLES[name], def = isJ ? JINGLES[name] : TRACKS[name];
        if (!def) { cur = null; return; }
        cur = { name, def, jingle: isJ, step: 0, next: 0, stepDur: 60 / def.bpm / 4, total: 0 };
        if (isJ) { let mx = 0; def.notes.forEach(n => { mx = Math.max(mx, n[0] + n[2]); }); cur.total = mx + 4; }
    };

    return {
        supported: () => !unsupported,
        prime: () => { if (settings.music || settings.sfx) ensureCtx(); },
        suspend: () => { try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch (e) { /* ignore */ } },
        resume: () => { if (settings.music || settings.sfx) ensureCtx(); if (cur) cur.next = 0; },
        setMusic: v => { settings.music = !!v; saveSettings(); if (v) ensureCtx(); if (cur) cur.next = 0; },
        setSfx: v => { settings.sfx = !!v; saveSettings(); if (v) ensureCtx(); },
        // music
        play: (name, then) => {
            if (cur && cur.name === name && !cur.done) return;
            startTrack(name);
            if (cur && then) cur.then = then;
        },
        stop: () => { cur = null; },
        current: () => (cur && !cur.done ? cur.name : ''),
        tick: () => {
            if (!cur || cur.done || !settings.music || !running()) return;
            const now = ctx.currentTime;
            if (cur.next < now - 0.3) cur.next = now + 0.05;
            let guard = 0;
            while (cur.next < now + 0.2 && guard++ < 24) {
                schedStep(cur, cur.next, cur.step);
                cur.next += cur.stepDur; cur.step++;
                if (cur.jingle && cur.step >= cur.total) {
                    const th = cur.then;
                    if (th) startTrack(th); else cur.done = true;
                    break;
                }
            }
        },
        // sfx (all rate-limited where they can spam)
        fire: () => { if (gate('fire', 70)) tone(760, 'square', 0.05, 0.02, 520); },
        efire: () => { if (gate('efire', 60)) tone(300, 'sawtooth', 0.09, 0.025, 210); },
        hit: () => { if (gate('hit', 40)) tone(1300, 'square', 0.035, 0.025, 800); },
        tink: () => { if (gate('tink', 60)) { tone(2400, 'triangle', 0.06, 0.04, 1700); tone(3100, 'sine', 0.05, 0.02, 2600, 0.02); } },
        pop: () => { if (gate('pop', 40)) { boom(0.2, 0.13, 2200); tone(190, 'sawtooth', 0.15, 0.05, 70); } },
        blast: () => { boom(0.5, 0.22, 2400); tone(110, 'sawtooth', 0.4, 0.07, 45); },
        big: () => { boom(1.2, 0.34, 2600); tone(80, 'sawtooth', 1.0, 0.1, 35); },
        pick: () => { if (gate('pick', 60)) { tone(880, 'square', 0.07, 0.04); tone(1320, 'square', 0.12, 0.04, null, 0.06); } },
        power: () => { tone(500, 'triangle', 0.1, 0.05, 900); tone(750, 'triangle', 0.1, 0.05, 1300, 0.08); tone(1100, 'triangle', 0.2, 0.05, 1800, 0.16); },
        bomb: () => { boom(0.9, 0.34, 2800); tone(90, 'sawtooth', 0.7, 0.14, 30); hiss(0.6, 0.08, 400, 4000); },
        hurt: () => { boom(0.5, 0.3, 1400); tone(160, 'sawtooth', 0.5, 0.11, 45); },
        shield: () => { tone(1500, 'triangle', 0.2, 0.06, 500); hiss(0.2, 0.05, 3000, 900); },
        level: () => { tone(520, 'square', 0.09, 0.05, 730); tone(720, 'square', 0.09, 0.05, 1000, 0.07); tone(960, 'square', 0.16, 0.05, 1250, 0.14); },
        life: () => { [660, 880, 1100, 1320].forEach((f, i) => tone(f, 'square', 0.1, 0.05, null, i * 0.07)); },
        warn: () => { tone(660, 'square', 0.09, 0.04); tone(520, 'square', 0.12, 0.04, null, 0.11); },
        alarm: () => { if (gate('alarm', 500)) { tone(880, 'square', 0.1, 0.04); tone(660, 'square', 0.1, 0.04, null, 0.12); } },
        charge: () => { if (gate('charge', 300)) tone(300, 'sawtooth', 0.6, 0.04, 1300); },
        beam: () => { if (gate('beam', 200)) { tone(120, 'sawtooth', 0.5, 0.09, 90); hiss(0.5, 0.07, 1200, 3000); } },
        tele: () => { tone(1400, 'sine', 0.3, 0.05, 300); hiss(0.3, 0.04, 2500, 800); },
        mine: () => { boom(0.55, 0.26, 1800); tone(140, 'square', 0.3, 0.08, 50); },
        split: () => { tone(400, 'triangle', 0.14, 0.05, 700); tone(300, 'triangle', 0.14, 0.05, 550, 0.04); },
        coin: () => { if (gate('coin', 70)) { tone(1200, 'sine', 0.09, 0.05); tone(1800, 'sine', 0.16, 0.05, null, 0.06); } },
        buy: () => { tone(600, 'square', 0.06, 0.045); tone(900, 'square', 0.06, 0.045, null, 0.06); tone(1400, 'square', 0.14, 0.045, null, 0.12); },
        deny: () => { tone(160, 'square', 0.14, 0.05, 110); },
        select: () => tone(700, 'square', 0.05, 0.035),
        confirm: () => { tone(600, 'square', 0.06, 0.045); tone(900, 'square', 0.1, 0.045, null, 0.06); },
        back: () => tone(420, 'triangle', 0.08, 0.05, 280),
        pause: () => tone(400, 'triangle', 0.1, 0.05, 250),
        banner: () => { tone(300, 'sawtooth', 0.4, 0.05, 700); hiss(0.4, 0.04, 800, 3500); },
        card: () => { tone(880, 'triangle', 0.08, 0.05); tone(1320, 'triangle', 0.16, 0.05, null, 0.08); },
        star: i => { tone(880 * Math.pow(1.26, i), 'square', 0.16, 0.06); tone(1760 * Math.pow(1.26, i), 'sine', 0.24, 0.04, null, 0.05); },
        roar: () => { tone(90, 'sawtooth', 0.9, 0.12, 60); tone(140, 'square', 0.8, 0.06, 90, 0.05); boom(0.9, 0.2, 700); }
    };
})();

    while (p.fireCd <= 0) { if (r.t > 0.5) firePlayer(r); p.fireCd += cd; if (r.t <= 0.5) { p.fireCd = 0.5 - r.t + 0.001; break; } }
    const nd = droneCount(p);
    if (nd) {
        p.droneCd -= dt;
        if (p.droneCd <= 0) {
            p.droneCd = 0.34;
            for (let i = 0; i < nd; i++) { const d = dronePos(p, i, nd); r.pb.push({ x: d.x, y: d.y - 14, vx: 0, vy: -P_BULLET_SPEED, dmg: p.dmg * 0.55, pierce: 0, on: false, hit: null, tgt: null, age: 0 }); }
        }
    }

    // --- world
    updateWaves(r, dt);
    updateForms(r, dt);
    updateEnemies(r, dt);
    if (r.boss) updateBoss(r, dt);
    updateRocks(r, dt);
    updateMines(r, dt);
    updateBunkers(r);
    updateBeams(r, dt);
    updatePlayerBullets(r, dt);
    updateEnemyBullets(r, dt);
    updatePickups(r, dt);
    if (r.stats) { const s = r.stats; if (r.eb.length > s.maxEb) s.maxEb = r.eb.length; if (r.en.length > s.maxEn) s.maxEn = r.en.length; if (r.parts.length > s.maxParts) s.maxParts = r.parts.length; }
}

function updateFx(r, dt) {
    if (r.sim) return;
    for (let i = r.parts.length - 1; i >= 0; i--) {
        const q = r.parts[i]; q.life += dt;
        if (q.life >= q.max) { r.parts.splice(i, 1); continue; }
        const dmp = Math.pow(0.9, dt * 60); q.vx *= dmp; q.vy *= dmp; q.x += q.vx * dt; q.y += q.vy * dt;
    }
    for (let i = r.rings.length - 1; i >= 0; i--) { r.rings[i].life += dt; if (r.rings[i].life >= r.rings[i].max) r.rings.splice(i, 1); }
    for (let i = r.pops.length - 1; i >= 0; i--) { r.pops[i].life += dt; if (r.pops[i].life >= r.pops[i].max) r.pops.splice(i, 1); }
    if (r.banner) { r.banner.t += dt; if (r.banner.t >= r.banner.T) r.banner = null; }
}

/* ---------- lifecycle ---------- */
function summon(r, rows, entry) {
    const wi = r.wi, wt = r.watch, na = r.nextAt;
    spawnWave(r, W(rows, { entry, side: 'split', vx: 60, step: 16, fire: [1.6, 2.6] }));
    r.wi = wi; r.watch = wt; r.nextAt = na;
}
function spawnBoss(r, id) {
    const d = BOSSDEF[id];
    const hs = (r.st.bhp || r.st.hpm || 1) * (r.endless ? 1 + 0.12 * Math.floor(r.wi / 8) : 1);
    const b = { id, d, x: GW / 2, y: -240, t: 0, state: 'enter', phase: 0, tt: 0, parts: d.parts(hs), atk: null, atkI: 0, cool: 1.6, marks: [], w: d.w, h: d.h, dying: 0, exposed: 0, flash: 0, ghost: 0, rot: 0, hs };
    r.boss = b; r.bossT = 0; r.eb.length = 0;
    if (id === 'veil') b.tp = { s: 'vis', t: 0, i: 0 };
    b.bossFogFrom = r.fog;
    if (!r.sim) {
        r.banner = { text: 'WARNING', sub: d.name, t: 0, T: 3.0, color: '#ff6b6b', alarm: true };
        if (!save.seen[d.card]) r.cardQ.push(d.card);
    }
    AudioEngine.roar();
    layoutParts(r, b);
    return b;
}
function layoutParts(r, b) {
    if (b.d.layout) b.d.layout(r, b, DT);
    for (const p of b.parts) { p.x = b.x + p.ox; p.y = b.y + p.oy; }
}
function bossHpFrac(b) { let h = 0, m = 0; for (const p of b.parts) if (p.bar) { m += p.maxHp; h += Math.max(0, p.hp); } return m ? h / m : 0; }

function updateBoss(r, dt) {
    const b = r.boss, d = b.d;
    b.t += dt;
    if (b.flash > 0) b.flash -= dt * 3;
    for (const p of b.parts) { if (p.flash > 0) p.flash -= dt * 5; if (p.warn > 0) p.warn -= dt; }
    if (b.exposed > 0) b.exposed -= dt;
    if (b.state === 'enter') {
        b.y += (d.y - b.y) * Math.min(1, dt * 1.7) + 30 * dt;
        if (b.y >= d.y - 2) { b.y = d.y; b.state = 'fight'; b.t = 0; }
        layoutParts(r, b); return;
    }
    if (b.state === 'dying') {
        b.dying += dt;
        layoutParts(r, b);
        if (!r.sim && Math.random() < 0.55) { const p = b.parts[(Math.random() * b.parts.length) | 0]; spark(r, b.x + (Math.random() - 0.5) * b.w, b.y + (Math.random() - 0.5) * b.h, 10, '255,180,90', 260, 0.7); ring(r, b.x + (Math.random() - 0.5) * b.w * 0.8, b.y + (Math.random() - 0.5) * b.h * 0.8, 6, 60, 0.4, '#ffc27a'); addShake(r, 2); }
        if (b.dying > 3.2) finishBoss(r, b);
        return;
    }
    if (b.state === 'trans') {
        b.tt -= dt; layoutParts(r, b);
        if (b.tt <= 0) { b.state = 'fight'; b.cool = 0.6; }
        return;
    }
    d.move(r, b, dt);
    layoutParts(r, b);
    const core = bp(b, 'core');
    // phase change?
    const ph = d.phaseOf(r, b);
    if (ph > b.phase) {
        b.phase = ph; b.state = 'trans'; b.tt = 1.7; b.atk = null; b.atkI = 0;
        r.eb.length = 0; r.beams.length = 0; b.marks.length = 0;
        if (!r.sim) { r.banner = { text: d.name, sub: 'PHASE ' + (ph + 1), t: 0, T: 2.0, color: '#ff9a6a' }; ring(r, b.x, b.y, 30, 500, 0.7, '#ff9a6a'); spark(r, b.x, b.y, 30, '255,150,90', 300, 0.8); r.flash = 0.4; addShake(r, 8); }
        AudioEngine.roar();
        if (d.onPhase) d.onPhase(r, b, ph);
        return;
    }
    // attack scheduler
    if (!b.atk && (!b.tp || b.tp.s === 'vis')) {
        b.cool -= dt;
        if (b.cool <= 0) {
            const list = d.phases[b.phase].atk;
            const spec = list[b.atkI % list.length]; b.atkI++;
            b.atk = { s: spec, t: 0, k: 0, nt: spec.tele || 0, done: false };
            if (spec.n === 'summon') b.atk.t = 0;
        }
    }
    if (b.atk) {
        b.atk.t += dt;
        if (ATK[b.atk.s.n](r, b, b.atk, dt)) { b.atk = null; b.cool = d.phases[b.phase].cool; b.marks.length = 0; }

}

/* ---------- draw helpers ---------- */
function rrect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function drawGlow(sprite, x, y, s, a) { X.globalAlpha = a; X.drawImage(sprite, x - s / 2, y - s / 2, s, s); X.globalAlpha = 1; }
function textOut(txt, x, y, font, fill, stroke, lw) {

    X.fillStyle = fill; X.fillText(txt, x, y);
}

function drawBackdrop(r, sector, t) {
    const S = SECTORS[sector];
    X.drawImage(BACKDROP[sector], 0, 0);
    const speedMul = sector === 4 ? 3.6 : sector === 1 ? 1.5 : 1;
    for (const s of STARS) {
        const py = (s.y * GH + t * s.speed * speedMul) % GH;
        const a = s.a * (0.7 + 0.3 * Math.sin(s.t + t * 1.3));
        X.fillStyle = `rgba(${S.star},${a.toFixed(3)})`;
        if (sector === 4) X.fillRect(s.x * GW, py, s.size, s.size * (3 + s.speed / 5)); else X.fillRect(s.x * GW, py, s.size, s.size);
    }
    if (sector === 1) {   // drifting dust
        X.fillStyle = 'rgba(255,220,180,.12)';
        for (let i = 0; i < 22; i++) { const x = (i * 97 + t * (14 + i % 5 * 6)) % (GW + 40) - 20, y = (i * 173 + t * (30 + i % 4 * 10)) % GH; X.fillRect(x, y, 2 + i % 3, 2); }
    } else if (sector === 2) {   // slow gas puffs
        for (let i = 0; i < 4; i++) {
            const x = GW * (0.15 + 0.25 * i) + Math.sin(t * 0.12 + i * 2) * 90, y = ((t * (14 + i * 4) + i * 300) % (GH + 400)) - 200, rad = 190 + i * 30;
            const rg = X.createRadialGradient(x, y, 0, x, y, rad); rg.addColorStop(0, 'rgba(170,120,255,.10)'); rg.addColorStop(1, 'rgba(170,120,255,0)'); X.fillStyle = rg; X.fillRect(x - rad, y - rad, rad * 2, rad * 2);
        }
    } else if (sector === 3) {   // blinking hazard lights on the wreckage

        for (let i = 0; i < 6; i++) X.fillRect(70 + i * 118, 300 + (i * 173) % 600, 4, 4);
    }
}

function drawDangerLine(r, t) {
    let gap = 1e9;
    for (const e of r.en) if (e.st === 'form') gap = Math.min(gap, DANGER_Y - (e.y + e.h * 0.5));
    const prox = gap < 260 ? 1 - Math.max(0, gap) / 260 : 0;

    X.fillStyle = bg; X.fillRect(0, DANGER_Y - 50, GW, 50);
    X.strokeStyle = `rgba(255,90,90,${a.toFixed(3)})`; X.lineWidth = 2; X.setLineDash([10, 8]); X.lineDashOffset = -t * (30 + prox * 90);
    X.beginPath(); X.moveTo(0, DANGER_Y); X.lineTo(GW, DANGER_Y); X.stroke(); X.setLineDash([]); X.lineDashOffset = 0;
}

    X.save(); X.translate(GW / 2 + Math.sin(t * 0.2) * 20, 250 + Math.sin(t * 0.3) * 12); X.rotate(0.28 + Math.sin(t * 0.15) * 0.05); X.globalAlpha = 0.5;
    X.drawImage(sp.img, -sp.w / 2 * 0.9, -sp.h / 2 * 0.9, sp.w * 0.9, sp.h * 0.9); X.restore(); X.globalAlpha = 1;
    const g = X.createRadialGradient(GW / 2, 250, 10, GW / 2, 250, 280); g.addColorStop(0, 'rgba(255,140,60,.28)'); g.addColorStop(1, 'rgba(255,60,60,0)'); X.fillStyle = g; X.fillRect(0, 0, GW, 600);
}
function drawBunkers(r) {
    for (const bk of r.bunk) {

function drawEnemy(e, r, t) {
    const k = e.k, spr = SPRITES[k.spr];
    if (!spr) return;
    const s = e.w / 68, d = 136 * s;
    let alpha = e.alpha == null ? 1 : e.alpha;
    // fog: ships far from the ship's lantern are dim shadows until shots (or their own fire) light them
    if (r.fog) {
        let rev = clamp(1 - (dist(e.x, e.y, r.p.x, r.p.y) - r.fog) / 200, 0, 1);
        if (e.flash > 0.05 || (e.sn && e.sn.s > 0)) rev = 1;
        else for (const b of r.pb) if (Math.abs(b.x - e.x) < 130 && Math.abs(b.y - e.y) < 130) { rev = 1; break; }
        alpha *= 0.3 + 0.7 * rev;
    }
    if (alpha <= 0.01) return;
    X.save(); X.translate(e.x, e.y);
    if (e.kind === 'diver' && e.st === 'dive' && e.dive.phase === 1) X.rotate(Math.atan2(-e.vx, e.vy || 1) - 0);
    else if (e.st === 'dive' || e.st === 'enter') X.rotate(clamp(e.vx / 900, -0.35, 0.35));
    if (e.k.aura && e.shield > 0.2) {   // Aegis field
        const ra = k.aura * (0.55 + 0.45 * e.shield / 8), pulse = 0.5 + 0.5 * Math.sin(t * 3 + e.id);
        const g = X.createRadialGradient(0, 0, ra * 0.5, 0, 0, ra); g.addColorStop(0, 'rgba(92,225,255,0)'); g.addColorStop(0.85, `rgba(92,225,255,${(0.06 + 0.05 * pulse + (e.aflash || 0) * 0.25).toFixed(3)})`); g.addColorStop(1, `rgba(150,240,255,${(0.35 + (e.aflash || 0) * 0.5).toFixed(3)})`);
        X.globalAlpha = alpha; X.fillStyle = g; X.beginPath(); X.arc(0, 0, ra, 0, TAU); X.fill();
        if (e.aflash > 0) e.aflash = Math.max(0, e.aflash - 0.06);
    }
    X.globalAlpha = alpha;
    if (e.st === 'dive' && e.dive && e.dive.style === 'dash' && e.dive.phase === 0) {   // wobble telegraph
        X.strokeStyle = `rgba(255,80,60,${(0.5 + 0.5 * Math.sin(t * 40)).toFixed(2)})`; X.lineWidth = 3; X.beginPath(); X.arc(0, 0, e.w * 0.7, 0, TAU); X.stroke();
    }
    X.drawImage(spr, -d / 2, -d / 2, d, d);
    if (e.flash > 0 && FLASH[k.spr]) { X.globalAlpha = alpha * Math.min(1, e.flash); X.drawImage(FLASH[k.spr], -d / 2, -d / 2, d, d); X.globalAlpha = alpha; }
    if (e.kind === 'core' && isInvuln(e)) {
        const pulse = 0.5 + 0.5 * Math.sin(t * 5);
        const g = X.createRadialGradient(0, 0, e.w * 0.3, 0, 0, e.w * 0.85); g.addColorStop(0, 'rgba(92,225,255,.05)'); g.addColorStop(1, `rgba(120,235,255,${(0.35 + 0.2 * pulse).toFixed(2)})`);
        X.fillStyle = g; X.beginPath(); X.arc(0, 0, e.w * 0.85, 0, TAU); X.fill();
        X.strokeStyle = 'rgba(200,250,255,.7)'; X.lineWidth = 2; X.stroke();

    if (e.kind === 'plated') { X.strokeStyle = 'rgba(255,230,140,.35)'; X.lineWidth = 2; X.strokeRect(-e.w * 0.42, -e.h * 0.5, e.w * 0.84, e.h * 0.9); }
    if (e.k.hive && e.hiveT < 0.8 && e.st === 'form') { X.fillStyle = `rgba(255,154,255,${(0.6 + 0.4 * Math.sin(t * 30)).toFixed(2)})`; X.fillRect(-e.w * 0.3, e.h * 0.38, e.w * 0.6, 4); }

    }
}

function drawLinks(r, t) {
    for (const c of r.en) {
        if (c.kind !== 'core' || !c.links) continue;
        for (const l of c.links) {
            if (l.hp <= 0 || l.dead) continue;
            X.strokeStyle = `rgba(120,240,255,${(0.45 + 0.3 * Math.sin(t * 6 + l.id)).toFixed(2)})`; X.lineWidth = 3; X.setLineDash([8, 6]); X.lineDashOffset = -t * 40;
            X.beginPath(); X.moveTo(l.x, l.y); X.lineTo(c.x, c.y); X.stroke(); X.setLineDash([]);
        }
    }
}

function drawMine(m, r, t) {

    const near = dist(m.x, m.y, r.p.x, r.p.y) < 330;
    X.strokeStyle = `rgba(255,140,90,${near ? 0.22 : 0.09})`; X.lineWidth = 2; X.setLineDash([6, 8]); X.beginPath(); X.arc(0, 0, 120, 0, TAU); X.stroke(); X.setLineDash([]);
    X.rotate(t * 0.5 + m.ph);
    X.fillStyle = '#5a4045'; for (let i = 0; i < 8; i++) { X.rotate(TAU / 8); X.beginPath(); X.moveTo(-4, -20); X.lineTo(0, -32); X.lineTo(4, -20); X.fill(); }
    const g = X.createRadialGradient(-6, -8, 2, 0, 0, 26); g.addColorStop(0, '#9c8285'); g.addColorStop(0.6, '#4a3538'); g.addColorStop(1, '#1e1416');
    X.fillStyle = g; X.beginPath(); X.arc(0, 0, 21, 0, TAU); X.fill(); X.strokeStyle = 'rgba(0,0,0,.6)'; X.lineWidth = 1.5; X.stroke();
    X.rotate(-(t * 0.5 + m.ph) - 0);

    X.fillStyle = blink ? '#ff4a3a' : '#5a1410'; X.beginPath(); X.arc(0, 0, 6, 0, TAU); X.fill();

}
function drawRock(k) {
    const sp = ROCKS[k.size][Math.floor(k.seed) % 4];
    X.save(); X.translate(k.x, k.y); X.rotate(k.rot);
    const d = sp.half * 2; X.drawImage(sp.img, -d / 2, -d / 2, d, d);

    drawGlow(glowW, k.x, k.y, 62 + pulse * 10, 0.3);
    X.strokeStyle = K.color; X.lineWidth = 2; X.globalAlpha = 0.6 + pulse * 0.3; X.beginPath(); X.arc(k.x, k.y, 24 + pulse * 3, 0, TAU); X.stroke(); X.globalAlpha = 1;

}

/* ---------- player ---------- */
function drawPlayer(r, t) {
    const p = r.p;
    if (r.over === 'fail') return;
    const inv = p.inv > 0 && !p.shieldFlash;
    if (inv && Math.floor(t * 16) % 2) return;
    const T = THEME.player;
    X.save(); X.translate(p.x, p.y); X.rotate(p.tilt);
    X.save(); X.scale(SHIP_SCALE, SHIP_SCALE);
    const fl = Math.sin(t * 20), fl2 = Math.sin(t * 20 + 1.4), fl3 = 9 + fl * 3, fl4 = 9 + fl2 * 3;
    X.fillStyle = T.engineGlow; X.beginPath(); X.arc(-7, 14, Math.max(2, 6 + fl * 1.2), 0, TAU); X.arc(7, 14, Math.max(2, 6 + fl * 1.2), 0, TAU); X.fill();
    X.globalAlpha = 0.75 + fl * 0.2; X.beginPath(); X.moveTo(-7, 16); X.lineTo(-9, 16 + fl3); X.lineTo(-5, 16 + fl3); X.closePath(); X.fill(); X.beginPath(); X.moveTo(7, 16); X.lineTo(5, 16 + fl4); X.lineTo(9, 16 + fl4); X.closePath(); X.fill(); X.globalAlpha = 1; X.restore();
    if (playerSprite) X.drawImage(playerSprite, -SPR_HALF, -SPR_HALF, SPR_HALF * 2, SPR_HALF * 2);
    X.save(); X.scale(SHIP_SCALE, SHIP_SCALE);
    X.globalAlpha = 0.55 + 0.45 * (Math.sin(t * 6) * .5 + .5); X.fillStyle = T.wingtipLight; X.beginPath(); X.arc(-15.5, 12, 1.7, 0, TAU); X.arc(15.5, 12, 1.7, 0, TAU); X.fill(); X.globalAlpha = 1;
    X.fillStyle = T.engineCore; X.fillRect(-6, 13, 4, 2.6); X.fillRect(2, 13, 4, 2.6);
    X.restore();
    if (p.hitFlash > 0) { X.globalAlpha = p.hitFlash * 0.5; X.fillStyle = '#ff6b6b'; X.beginPath(); X.arc(0, 0, 30, 0, TAU); X.fill(); X.globalAlpha = 1; }
    X.restore();
    // shield bubble
    if (p.shield > 0) {
        const low = p.shield < 3 && Math.floor(t * 8) % 2;
        if (!low) {
            const g = X.createRadialGradient(p.x, p.y, 20, p.x, p.y, 50); g.addColorStop(0, 'rgba(92,225,255,.05)'); g.addColorStop(1, 'rgba(120,235,255,.42)');
            X.fillStyle = g; X.beginPath(); X.arc(p.x, p.y, 50, 0, TAU); X.fill(); X.strokeStyle = 'rgba(190,250,255,.85)'; X.lineWidth = 2; X.stroke();
        }
    }
    // the hit box, like every shmup: a small bright dot
    X.fillStyle = 'rgba(255,255,255,.9)'; X.beginPath(); X.arc(p.x, p.y - 2, 3.2, 0, TAU); X.fill(); X.strokeStyle = 'rgba(120,220,255,.9)'; X.lineWidth = 1.4; X.stroke();
    // option drones
    const nd = droneCount(p);
    for (let i = 0; i < nd; i++) {
        const d = dronePos(p, i, nd);
        X.save(); X.translate(d.x, d.y + Math.sin(t * 5 + i) * 2); X.drawImage(optionSprite, -SPR_HALF, -SPR_HALF, SPR_HALF * 2, SPR_HALF * 2); X.restore();
        drawGlow(glowP, d.x, d.y + 12, 24, 0.5 + 0.3 * Math.sin(t * 20 + i));
    }
    // level-up ring is part of r.rings
}

/* ---------- bullets ---------- */
function drawBullets(r) {
    for (const b of r.pb) {
        const dmg = b.dmg, big = clamp(dmg, 1, 6);
        const bw = 4 + Math.min(4, (big - 1) * 0.9), bh = 9 + Math.min(7, (big - 1) * 1.5), gs = 22 + Math.min(14, (big - 1) * 3);
        const drone = b.vx === 0 && b.tgt == null && b.dmg < r.p.dmg * 0.6;
        drawGlow(glowP, b.x, b.y, gs, 0.85);
        const ang = Math.atan2(b.vx, -b.vy);
        X.save(); X.translate(b.x, b.y); X.rotate(ang);
        X.fillStyle = b.on ? '#fff3b0' : (drone ? '#a6ffd0' : '#e9fbff'); X.fillRect(-bw / 2, -bh / 2, bw, bh);
        X.fillStyle = b.on ? 'rgba(255,214,120,.5)' : 'rgba(124,216,255,.35)'; X.fillRect(-bw / 2, bh / 2, bw, bh * 0.7);
        X.restore();
    }
    for (const b of r.eb) {

function beginEndless() {

function afterStageStep() {

    if (r.cardQ.length && !ui.card && !r.over && !r.banner) showCard(r.cardQ.shift());
    if (!r.banner && r.bannerQ && r.bannerQ.length && !ui.card) r.banner = r.bannerQ.shift();

/* ---------- main loop (fixed 60 Hz simulation) ---------- */
let lastFrame = null, acc = 0;
function tick() {
    ui.idle++;
    if (game.scene === 'stage' && run) {
        if (ui.card) { ui.cardT--; if (ui.cardT <= 0 && (game.auto || ui.idle > 600)) dismissCard(); return; }
        if (game.paused) return;
        syncInput();
        stepRun();
        afterStageStep();
    } else sceneTick();
}
function loop(ts) {
    if (lastFrame === null) lastFrame = ts;
    let dt = ts - lastFrame; lastFrame = ts;
    if (dt > 250) dt = 250;
    acc += dt * DBG.speed;
    let n = 0;
    const cap = MAX_STEPS * Math.ceil(DBG.speed);
    while (acc >= FRAME_MS && n < cap) { tick(); acc -= FRAME_MS; n++; }
    if (n >= cap) acc = 0;
    try { updateHud(); render(ts); AudioEngine.tick(); } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
}
