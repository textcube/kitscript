<style>
:root {
    --primary: #3498db; --danger: #e74c3c; --success: #2ecc71; --dark: #2c3e50; --light: #ecf0f1;
    --gold: #f1c40f; --ice: #7dd3fc; --panel: rgba(8, 14, 30, 0.94); --line: rgba(255,255,255,0.14);
    --top-h: 54px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
    margin: 0; padding: 0; overflow: hidden; background: #020617; color: var(--light);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none;
}
#app { position: fixed; inset: 0; }
canvas#c { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: #020617; }

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#topbar {
    position: absolute; top: 0; left: 0; right: 0; min-height: var(--top-h);
    display: flex; align-items: center; gap: 10px; padding: 6px 12px; padding-top: max(6px, env(safe-area-inset-top));
    background: linear-gradient(180deg, rgba(2,6,23,0.88), rgba(2,6,23,0.55) 75%, rgba(2,6,23,0));
    pointer-events: none; z-index: 10;
}
#topbar > * { pointer-events: auto; }
.brand { display: flex; flex-direction: column; line-height: 1; margin-right: 6px; }
.brand .title { font-size: 19px; font-weight: 900; color: var(--gold); letter-spacing: 1px; text-shadow: 2px 2px #000; white-space: nowrap; }
.brand .sub { font-size: 9px; color: var(--success); letter-spacing: 3px; font-weight: 800; margin-top: 3px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; flex: 1; min-width: 0; }
.chip {
    background: rgba(15,23,42,0.72); border: 1px solid var(--line); border-radius: 16px; padding: 4px 11px;
    font-size: 13px; display: flex; align-items: center; gap: 6px; white-space: nowrap; backdrop-filter: blur(4px);
}
.chip .lbl { font-size: 9px; letter-spacing: 1.5px; color: #94a3b8; font-weight: 800; }
.chip b { font-weight: 900; font-variant-numeric: tabular-nums; }
#chip-stage b { color: var(--gold); }
#chip-stage span { color: #cbd5e1; font-weight: 700; }
#v-coin { color: var(--gold); }
#v-combo { color: #22d3ee; font-weight: 900; }
.chip[hidden] { display: none; }
.hearts { display: inline-flex; gap: 2px; }
.hearts i { width: 9px; height: 14px; border-radius: 2px; background: #334155; display: block; }
.hearts i.on { background: linear-gradient(#fde68a, #f59e0b); box-shadow: 0 0 5px rgba(245,158,11,0.6); }
.hearts.low i.on { background: linear-gradient(#fca5a5, #ef4444); box-shadow: 0 0 6px rgba(239,68,68,0.8); }
.hearts.flash { animation: hflash .5s; }
@keyframes hflash { 0%,100% { transform: none; } 30% { transform: translateX(-3px); } 60% { transform: translateX(3px); } }
.ctrl { display: flex; gap: 6px; align-items: center; margin-left: auto; }
.btn {
    background: rgba(15,23,42,0.85); border: 1px solid rgba(255,255,255,0.22); color: var(--light);
    padding: 8px 13px; cursor: pointer; font-family: inherit; font-size: 12px; font-weight: 800; letter-spacing: .5px;
    border-radius: 7px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px;
    transition: background .15s, color .15s, transform .15s; text-decoration: none; white-space: nowrap;
}
.btn:hover:not(:disabled), .btn:focus-visible { background: var(--light); color: #0f172a; outline: none; transform: translateY(-1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.on { background: var(--gold); color: #1a1300; border-color: var(--gold); }
.btn.primary { background: var(--gold); color: #1a1300; border-color: var(--gold); padding: 12px 26px; font-size: 15px; }
.btn.primary:hover:not(:disabled), .btn.primary:focus-visible { background: #fff3b0; color: #1a1300; }
.btn.danger { border-color: var(--danger); color: #fca5a5; }
.btn.danger:hover:not(:disabled) { background: var(--danger); color: #fff; }
.btn.icon { padding: 6px; min-width: 36px; }
.btn svg { width: 18px; height: 18px; display: block; }

/* weapons */
#weapons { position: absolute; z-index: 10; display: flex; gap: 8px; pointer-events: auto; }
.wslot {
    position: relative; width: 62px; height: 62px; border-radius: 12px; cursor: pointer;
    background: rgba(15,23,42,0.86); border: 2px solid #334155; color: var(--light);
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; overflow: hidden;
    font-family: inherit; transition: border-color .15s, box-shadow .15s;
}
.wslot svg { width: 24px; height: 24px; }
.wslot .nm { font-size: 9px; font-weight: 900; letter-spacing: .5px; color: #94a3b8; margin-top: 4px; text-transform: uppercase; }
.wslot .key { position: absolute; top: 2px; right: 3px; background: var(--gold); color: #000; font-size: 9px; font-weight: 900; padding: 0 4px; border-radius: 3px; }
.wslot .lv { position: absolute; bottom: 2px; left: 4px; font-size: 8px; font-weight: 900; color: var(--gold); }
.wslot .cd { position: absolute; left: 0; bottom: 0; width: 100%; height: 0; background: rgba(0,0,0,0.62); z-index: 1; }
.wslot .cdt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; z-index: 3; text-shadow: 0 0 4px #000; }
.wslot.active { border-color: var(--gold); box-shadow: 0 0 14px rgba(241,196,15,0.45); }
.wslot.active .nm { color: var(--gold); }
.wslot.ready::after { content: ''; position: absolute; top: 4px; left: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); z-index: 4; }
.wslot.ai { border-color: #22d3ee; box-shadow: 0 0 16px rgba(34,211,238,0.75); }
.wslot.locked { opacity: .45; cursor: default; }

@media (min-width: 761px) and (min-height: 421px), (min-width: 900px) {
    #weapons { flex-direction: column; left: 10px; top: calc(var(--top-h) + 10px); }
}
@media (max-width: 760px), (max-height: 420px) {
    #weapons { left: 0; right: 0; bottom: 0; justify-content: center; padding: 8px 8px max(8px, env(safe-area-inset-bottom)); background: linear-gradient(0deg, rgba(2,6,23,0.92), rgba(2,6,23,0)); }
    .wslot { width: 58px; height: 58px; flex: 0 0 auto; }
}
@media (max-height: 420px) and (min-width: 600px) {
    #weapons { flex-direction: column; left: 6px; right: auto; top: calc(var(--top-h) + 4px); bottom: auto; background: none; padding: 0; gap: 5px; }
    .wslot { width: 46px; height: 46px; border-radius: 10px; }
    .wslot .nm { font-size: 7px; margin-top: 2px; } .wslot svg { width: 18px; height: 18px; }
}

#toast {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; max-width: 92vw; z-index: 12;
    background: rgba(15,23,42,0.9); border: 1px solid rgba(241,196,15,0.45); padding: 10px 22px; border-radius: 22px;
    font-size: 13px; font-weight: 700; letter-spacing: .5px; text-align: center; opacity: 0; transition: opacity .6s; pointer-events: none;
    backdrop-filter: blur(4px);
}
#toast.show { opacity: 1; }
#toast b { color: var(--gold); }
#sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- panels ---------- */
#panels { position: absolute; inset: 0; pointer-events: none; z-index: 30; }
.panel {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 14px;
    background: rgba(2,6,23,0.80); pointer-events: auto; overflow-y: auto; touch-action: pan-y;
}
.panel.show { display: flex; }
.panel.clear { background: rgba(2,6,23,0.55); }
.panel.top { background: rgba(2,6,23,0.35); align-items: flex-start; padding-top: calc(var(--top-h) + 14px); }
.card {
    width: min(560px, 100%); max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--line);
    border-radius: 16px; padding: 22px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}
.card.wide { width: min(820px, 100%); }
.card h1 { margin: 0 0 6px; font-size: 40px; font-weight: 900; letter-spacing: -1px; color: var(--gold); }
.card h2 { margin: 0 0 10px; font-size: 24px; font-weight: 900; color: var(--gold); letter-spacing: .5px; }
.card p { margin: 6px 0; color: #cbd5e1; font-size: 14px; line-height: 1.45; }
.card .muted { color: #94a3b8; font-size: 12px; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.card .stack { display: flex; flex-direction: column; gap: 9px; margin-top: 14px; align-items: stretch; }
.card .stack .btn { padding: 12px 16px; font-size: 14px; }
.card .row.sticky { position: sticky; bottom: -22px; padding: 10px 0 2px; margin-top: 8px; background: linear-gradient(rgba(8,14,30,0), var(--panel) 35%); }
.auto-note { margin-top: 12px; font-size: 12px; color: #64748b; min-height: 16px; }
.stars { display: inline-flex; gap: 4px; }
.stars svg { width: 30px; height: 30px; }
.stars svg path { fill: #1e293b; stroke: #475569; stroke-width: 1.5; }
.stars svg.on path { fill: var(--gold); stroke: #f59e0b; filter: drop-shadow(0 0 5px rgba(241,196,15,.7)); }
.stars.small svg { width: 15px; height: 15px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 4px 18px; text-align: left; margin: 12px auto; max-width: 340px; font-size: 14px; }
.kv span:nth-child(odd) { color: #94a3b8; } .kv span:nth-child(even) { font-weight: 800; text-align: right; font-variant-numeric: tabular-nums; }
.kv .gold { color: var(--gold) !important; }
.pop { animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(0.2); opacity: 0; } to { transform: none; opacity: 1; } }
.tag { display: inline-block; border: 1px solid var(--line); border-radius: 10px; padding: 2px 9px; font-size: 11px; font-weight: 800; letter-spacing: .5px; margin: 2px; color: #cbd5e1; }
.tag.new { border-color: var(--gold); color: var(--gold); }
.tag.ctr { border-color: var(--success); color: #86efac; }
canvas.icon { width: 96px; height: 96px; display: block; margin: 0 auto 4px; background: rgba(255,255,255,0.05); border-radius: 12px; }

/* shop */
.shop-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 8px; }
.coins { font-size: 20px; font-weight: 900; color: var(--gold); }
.shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; text-align: left; }
.item { background: rgba(30,41,59,0.7); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.item.locked { opacity: .5; }
.item .top { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.item .name { font-weight: 900; font-size: 14px; } .item .desc { font-size: 11.5px; color: #94a3b8; min-height: 30px; line-height: 1.3; }
.pips { display: flex; gap: 3px; } .pips i { width: 16px; height: 6px; border-radius: 3px; background: #334155; } .pips i.on { background: var(--gold); }
.item .buy { padding: 7px 10px; min-height: 32px; font-size: 12px; }
.item .buy.flash, .coins.flash { animation: buyflash .5s; }
@keyframes buyflash { 0% { box-shadow: 0 0 0 0 rgba(241,196,15,.9); } 100% { box-shadow: 0 0 0 14px rgba(241,196,15,0); } }

/* map */
.mapbox { position: relative; width: 100%; aspect-ratio: 16 / 8.2; border-radius: 12px; overflow: hidden; background: linear-gradient(#0b1220, #1e293b); border: 1px solid var(--line); }
.mapbox svg.bg { position: absolute; inset: 0; width: 100%; height: 100%; }
.node {
    position: absolute; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%;
    background: #1e293b; border: 3px solid #475569; color: #e2e8f0; font-weight: 900; font-size: 15px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center; padding: 0;
}
.node.cleared { border-color: var(--success); background: #14532d; }
.node.open { border-color: var(--gold); background: #713f12; animation: pulse 1.6s infinite; }
.node.boss { width: 52px; height: 52px; border-radius: 12px; border-color: #ef4444; background: #450a0a; }
.node.locked { opacity: .45; cursor: not-allowed; }
.node.sel { outline: 3px solid #fff; outline-offset: 3px; }
.node .st { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 2px; white-space: nowrap; }
.node .ttl { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 3px; font-size: 10px; font-weight: 800; white-space: nowrap; color: #cbd5e1; text-shadow: 0 0 4px #000; pointer-events: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(241,196,15,.6); } 50% { box-shadow: 0 0 0 9px rgba(241,196,15,0); } }
.brief { text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; margin-top: 10px; }
.brief h3 { margin: 0; font-size: 18px; color: var(--gold); } .brief p { margin: 3px 0; font-size: 12.5px; }

/* scores */
table.hs { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 14px; }
table.hs th { color: #94a3b8; font-size: 11px; letter-spacing: 1px; text-align: left; padding: 4px 8px; }
table.hs td { padding: 6px 8px; border-top: 1px solid rgba(255,255,255,.07); text-align: left; font-variant-numeric: tabular-nums; }
table.hs tr.me td { color: var(--gold); font-weight: 900; }
table.hs td:nth-child(1) { color: #64748b; width: 30px; } table.hs td:nth-child(3) { text-align: right; font-weight: 800; }
input.name { font: 900 34px monospace; letter-spacing: 8px; text-align: center; width: 190px; text-transform: uppercase; padding: 8px; border-radius: 10px; border: 2px solid var(--gold); background: #0f172a; color: var(--gold); user-select: text; -webkit-user-select: text; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 4px; border-top: 1px solid rgba(255,255,255,.07); font-weight: 700; text-align: left; }
.toggle:first-of-type { border-top: 0; }
.legend { text-align: left; font-size: 13px; line-height: 1.6; color: #cbd5e1; }
.legend kbd { background: #1e293b; border: 1px solid #475569; border-bottom-width: 2px; border-radius: 4px; padding: 0 6px; font-size: 12px; color: var(--gold); font-family: inherit; font-weight: 800; }

@media (max-width: 560px) {
    :root { --top-h: 84px; }
    #topbar { flex-wrap: wrap; gap: 4px 6px; padding: 5px 8px; padding-top: max(5px, env(safe-area-inset-top)); }
    .brand .title { font-size: 11px; letter-spacing: 0; } .brand .sub { font-size: 7px; letter-spacing: 2px; margin-top: 2px; }
    .brand { margin-right: 0; }
    .ctrl { gap: 3px; }
    .btn { padding: 4px 8px; font-size: 11px; min-height: 32px; }
    .btn.icon { min-width: 32px; padding: 4px; }
    .btn svg { width: 16px; height: 16px; }
    .chips { order: 3; flex: 0 0 100%; gap: 4px; }
    .chip { padding: 3px 8px; font-size: 11px; gap: 4px; } .chip .lbl { font-size: 8px; letter-spacing: 1px; }
    #chip-stage span { display: none; }
    .hearts i { width: 7px; height: 12px; }
    .card { padding: 16px 14px; } .card h1 { font-size: 30px; } .card h2 { font-size: 20px; }
    .shop-grid { grid-template-columns: 1fr 1fr; gap: 7px; }
    .item { padding: 8px 9px; gap: 4px; } .item .name { font-size: 12.5px; } .item .desc { font-size: 10.5px; min-height: 42px; }
    .item .buy { padding: 5px 6px; font-size: 11px; min-height: 30px; }
    .pips i { width: 12px; }
    .node { width: 34px; height: 34px; font-size: 12px; border-width: 2px; } .node.boss { width: 40px; height: 40px; }
    .node .ttl { display: none; }
    .mapbox { aspect-ratio: 4 / 3.6; }
    .brief { grid-template-columns: 1fr; }
    #toast { bottom: auto; top: calc(var(--top-h) + 6px); font-size: 11px; padding: 7px 12px; white-space: normal; border-radius: 14px; }
}
@media (max-width: 760px) and (min-width: 561px) { :root { --top-h: 56px; } .brand .title { font-size: 15px; } .chip { font-size: 12px; padding: 3px 8px; } }
@media (max-height: 420px) { :root { --top-h: 44px; } .brand .title { font-size: 14px; } .brand .sub { display: none; } .btn { min-height: 30px; padding: 4px 8px; } .chip { padding: 2px 8px; font-size: 11px; } .card { padding: 12px 16px; } .card h1 { font-size: 26px; } }
body.cine #weapons, body.cine .chips { visibility: hidden; }
@media (prefers-reduced-motion: reduce) { .node.open, .pop, .hearts.flash { animation: none; } }
</style>
</head>
<body>
<noscript><p style="color:#f1c40f;font-family:sans-serif;padding:24px">Cable Car Defense needs JavaScript. Please enable it and reload.</p></noscript>
<div id="app">
    <canvas id="c" aria-label="Cable Car Defense playfield: a gun-car rides the cable above the snow and shoots down at raiders climbing the ladders" role="img"></canvas>
    <div id="hud">
        <div id="topbar">
            <div class="brand"><div class="title">CABLE CAR DEFENSE</div><div class="sub">BUNTGAMES</div></div>
            <div class="chips">
                <div class="chip" id="chip-stage"><b id="v-stage">S1</b><span id="v-stname">Base Valley</span></div>
                <div class="chip" id="chip-hp" aria-label="Cable integrity"><span class="lbl">CABLE</span><span id="v-hp" class="hearts"></span></div>
                <div class="chip" aria-label="Wave"><span class="lbl">WAVE</span><b id="v-wave">1/4</b></div>
                <div class="chip" aria-label="Score"><span class="lbl">SCORE</span><b id="v-score">0</b></div>
                <div class="chip" aria-label="Coins"><span class="lbl">COIN</span><b id="v-coin">0</b></div>
                <div class="chip" id="v-combo" hidden></div>
            </div>
            <div class="ctrl">
                <button class="btn on" id="btn-auto" aria-label="Toggle auto-pilot" title="Auto-pilot (A)">AUTO: ON</button>
                <button class="btn icon" id="btn-pause" aria-label="Pause" title="Pause (P / Esc)"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
                <button class="btn icon" id="btn-menu" aria-label="Menu: map, upgrades, scores, settings" title="Menu (M)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
                <button class="btn icon" id="btn-music" aria-label="Toggle music" title="Music"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17V7.6l8-1.6v6.3A3.5 3.5 0 1 0 21 15.5V3z" transform="scale(.9) translate(1 1)"/></svg></button>
                <button class="btn icon" id="btn-sfx" aria-label="Toggle sound effects" title="Sound effects"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 4V5L7 9z"/><path d="M15.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
            </div>
        </div>
        <div id="weapons" role="toolbar" aria-label="Weapons"></div>
        <div id="toast" role="status"></div>
        <div id="sr" aria-live="polite"></div>
    </div>
    <div id="panels"></div>
</div>
<script>
'use strict';
/* ==========================================================================
 * CABLE CAR DEFENSE - single-file campaign build
 *
 *  SECTION 1  Engine basics: helpers, RNG, storage, URL/debug params, save data
 *  SECTION 2  Audio: SFX + procedural music sequencer
 *  SECTION 3  Data: weapons, enemies, upgrades
 *  SECTION 4  Stage data: ten authored stages, boss definitions
 *  SECTION 5  Simulation: runs, waves, spawning, weapons, enemies, hazards
 *  SECTION 6  Bosses
 *  SECTION 7  Auto-pilot AI (demo + test bot) and auto-shop
 *  SECTION 8  Renderer: backgrounds, terrain, sprites, effects, vision
 *  SECTION 9  UI: HUD, panels, screens, input, game flow, main loop
 *  SECTION 10 Debug hooks (off by default) and boot

function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}
// Gameplay RNG (seedable so balance tests are reproducible); cosmetics use Math.random.
let R = mulberry32(12345);

    del(key) { try { localStorage.removeItem(key); } catch (e) { /* ignore */ } }

    unlock: PARAMS.get('unlock') === 'all',

/* ---------- Save data (versioned) ---------- */
const UP_IDS = ['drop', 'arc', 'freeze', 'pit', 'sticky', 'speed', 'hull'];
function defaultSave() {
    return {
        v: 2, coins: 0, stages: {}, seen: {}, done: false,
        up: { drop: 1, arc: 1, freeze: 1, pit: 1, sticky: 1, speed: 1, hull: 0 },
        endless: { wave: 0, score: 0 }, plays: 0, lastName: 'AAA', hints: {}
    };
}
let save = defaultSave();
function loadSave() {
    const raw = Store.get(KEY_SAVE, null);
    const s = defaultSave();
    if (raw && typeof raw === 'object' && raw.v === 2) {
        if (typeof raw.coins === 'number' && isFinite(raw.coins)) s.coins = Math.max(0, Math.floor(raw.coins));
        if (raw.stages && typeof raw.stages === 'object') {
            Object.keys(raw.stages).forEach(k => {
                const r = raw.stages[k];
                if (r && typeof r === 'object' && /^\d+$/.test(k)) s.stages[k] = { stars: clamp(r.stars | 0, 0, 3), best: Math.max(0, r.best | 0), clears: Math.max(0, r.clears | 0), bestTime: r.bestTime > 0 ? r.bestTime : 0 };
            });
        }
        if (raw.up && typeof raw.up === 'object') UP_IDS.forEach(id => { if (typeof raw.up[id] === 'number') s.up[id] = clamp(Math.floor(raw.up[id]), id === 'hull' ? 0 : 1, id === 'hull' ? 3 : 5); });
        if (raw.seen && typeof raw.seen === 'object') Object.keys(raw.seen).forEach(k => { if (raw.seen[k]) s.seen[k] = 1; });
        if (raw.hints && typeof raw.hints === 'object') Object.keys(raw.hints).forEach(k => { if (raw.hints[k]) s.hints[k] = 1; });
        s.done = !!raw.done;
        if (raw.endless && typeof raw.endless === 'object') s.endless = { wave: Math.max(0, raw.endless.wave | 0), score: Math.max(0, raw.endless.score | 0) };
        s.plays = Math.max(0, raw.plays | 0);
        if (typeof raw.lastName === 'string') s.lastName = raw.lastName.slice(0, 3).toUpperCase() || 'AAA';
    }
    save = s;
    if (DBG.unlock) { s.done = true; for (let i = 0; i < 10; i++) if (!s.stages[i]) s.stages[i] = { stars: 1, best: 0, clears: 1, bestTime: 0 }; }
    if (DBG.money >= 0) s.coins = DBG.money;
    return s;
}

    Store.del(KEY_SAVE);

}

/* ---------- High-score table (top 10) ---------- */
let scoresCache = null;
function loadScores() {
    if (scoresCache) return scoresCache;
    const raw = Store.get(KEY_SCORES, []);
    const out = [];
    if (Array.isArray(raw)) raw.forEach(r => {
        if (r && typeof r.s === 'number' && isFinite(r.s)) out.push({ n: String(r.n || '???').slice(0, 3).toUpperCase(), s: Math.max(0, Math.floor(r.s)), m: r.m === 'END' ? 'END' : 'CAM', d: String(r.d || '').slice(0, 10) });
    });
    out.sort((a, b) => b.s - a.s);
    scoresCache = out.slice(0, 10);
    return scoresCache;
}
function scoreQualifies(s) { const t = loadScores(); return s > 0 && (t.length < 10 || s > t[t.length - 1].s); }
function addScore(name, s, mode, detail) {
    const t = loadScores();
    const e = { n: (name || 'AAA').slice(0, 3).toUpperCase(), s: Math.floor(s), m: mode, d: detail };
    t.push(e); t.sort((a, b) => b.s - a.s);
    scoresCache = t.slice(0, 10);
    Store.set(KEY_SCORES, scoresCache);
    return scoresCache.indexOf(e);
}

// One-shot jingles: notes are [step, degree, lengthInSteps]
const JINGLES = {
    victory: { bpm: 132, root: 60, scale: 'major', wave: 'square', notes: [[0, 0, 2], [2, 2, 2], [4, 4, 2], [6, 7, 2], [8, 4, 2], [10, 7, 2], [12, 9, 4], [16, 11, 2], [18, 9, 2], [20, 12, 10]] },

    warning: { bpm: 150, root: 45, scale: 'phrygian', wave: 'sawtooth', notes: [[0, 0, 3], [4, 0, 3], [8, 1, 3], [12, 0, 3], [16, 7, 6]] }

const AudioEngine = (() => {
    let ctx = null, master = null, sfxBus = null, musBus = null, noiseBuf = null;
    let unsupported = !(window.AudioContext || window.webkitAudioContext);
    let voices = 0, cur = null;
    const lastAt = {};

    const ensureCtx = () => {
        if (unsupported) return false;
        try {
            if (!ctx) {
                const AC = window.AudioContext || window.webkitAudioContext;
                ctx = new AC();
                master = ctx.createGain(); master.gain.value = 0.9;
                sfxBus = ctx.createGain(); sfxBus.gain.value = 0.9; sfxBus.connect(master);
                musBus = ctx.createGain(); musBus.gain.value = 0.32; musBus.connect(master);
                if (ctx.createDynamicsCompressor) { const comp = ctx.createDynamicsCompressor(); master.connect(comp); comp.connect(ctx.destination); }
                else master.connect(ctx.destination);
            }
            if (ctx.state === 'suspended') { const pr = ctx.resume(); if (pr && pr.catch) pr.catch(() => {}); }
            return true;
        } catch (e) { unsupported = true; ctx = null; return false; }
    };
    const running = () => ctx && ctx.state === 'running';

    const note = (bus, t, freq, type, dur, vol, slideTo) => {
        if (voices >= 24) return;
        try {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t);
            if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(vol, t + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            osc.connect(gain); gain.connect(bus);
            voices++;
            osc.onended = () => { voices--; osc.disconnect(); gain.disconnect(); };
            osc.start(t); osc.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const noise = (bus, t, dur, vol, ftype, f0, f1) => {
        if (voices >= 24) return;
        try {
            if (!noiseBuf) {
                noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate), ctx.sampleRate);
                const d = noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            const src = ctx.createBufferSource(), filt = ctx.createBiquadFilter(), gain = ctx.createGain();
            src.buffer = noiseBuf; filt.type = ftype;
            filt.frequency.setValueAtTime(f0, t);
            if (f1) filt.frequency.exponentialRampToValueAtTime(f1, t + dur);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            src.connect(filt); filt.connect(gain); gain.connect(bus);
            voices++;
            src.onended = () => { voices--; src.disconnect(); filt.disconnect(); gain.disconnect(); };
            src.start(t); src.stop(t + dur + 0.03);
        } catch (e) { /* ignore */ }
    };
    const sfxOk = () => settings.sfx && running();
    // rate-limited: same key can't fire twice within `ms`
    const gate = (key, ms) => {
        const n = performance.now();
        if (lastAt[key] && n - lastAt[key] < ms) return false;
        lastAt[key] = n; return true;
    };
    const tone = (freq, type, dur, vol, slideTo, delay) => { if (!sfxOk()) return; note(sfxBus, ctx.currentTime + (delay || 0), freq, type, dur, vol, slideTo); };
    const boom = (dur, vol, cutoff) => { if (!sfxOk() || !gate('boom', 45)) return; noise(sfxBus, ctx.currentTime, dur, vol, 'lowpass', cutoff, 120); };
    const hiss = (dur, vol, f0, f1, delay) => { if (!sfxOk()) return; noise(sfxBus, ctx.currentTime + (delay || 0), dur, vol, 'highpass', f0, f1); };

    const midiFreq = m => 440 * Math.pow(2, (m - 69) / 12);
    const degMidi = (root, scale, deg) => {
        const sc = SCALES[scale], oct = Math.floor(deg / 7), idx = ((deg % 7) + 7) % 7;
        return root + sc[idx] + 12 * oct;
    };
    const schedStep = (c, t, step) => {
        const d = c.def, stepDur = c.stepDur;
        if (c.jingle) {
            for (let i = 0; i < d.notes.length; i++) {
                const n = d.notes[i];
                if (n[0] === step) note(musBus, t, midiFreq(degMidi(d.root, d.scale, n[1])), d.wave, n[2] * stepDur * 0.95, 0.2);
            }
            return;
        }
        const bars = d.sections.length * 4, bar = Math.floor(step / 16) % bars, s = step % 16;
        const sec = d.sections[Math.floor(bar / 4)], bi = bar % 4, chord = sec.prog[bi];
        const motif = bi === 3 ? sec.fill : sec.lead, tok = motif[s];
        if (typeof tok === 'number') {
            let len = 1; while (s + len < 16 && motif[s + len] === 'T') len++;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, tok + chord)), d.wave, len * stepDur * 0.9, 0.11);
        }
        const bt = d.bass[s];
        if (typeof bt === 'number') note(musBus, t, midiFreq(degMidi(d.root - 12, d.scale, bt + chord)), 'triangle', stepDur * 1.6, 0.2);
        if (d.arp && s % d.arp.every === 0) {
            const k = (s / d.arp.every) | 0;
            note(musBus, t, midiFreq(degMidi(d.root + 12, d.scale, chord + d.arp.pat[k % d.arp.pat.length])), 'square', stepDur * 0.7, 0.035);
        }
        const dr = (bi === 3 ? d.fill : d.drums).charAt(s);
        if (dr === 'k') note(musBus, t, 150, 'sine', 0.13, 0.42, 42);
        else if (dr === 's') { noise(musBus, t, 0.11, 0.2, 'highpass', 1800); note(musBus, t, 210, 'triangle', 0.07, 0.12, 120); }
        else if (dr === 'h') noise(musBus, t, 0.035, 0.09, 'highpass', 7000);
    };
    const startTrack = name => {
        const isJ = !!JINGLES[name], def = isJ ? JINGLES[name] : TRACKS[name];
        if (!def) { cur = null; return; }
        cur = { name, def, jingle: isJ, step: 0, next: 0, stepDur: 60 / def.bpm / 4, total: 0 };
        if (isJ) { let mx = 0; def.notes.forEach(n => { mx = Math.max(mx, n[0] + n[2]); }); cur.total = mx + 4; }
    };

    return {
        supported: () => !unsupported,
        prime: () => { if (settings.music || settings.sfx) ensureCtx(); },
        suspend: () => { try { if (ctx && ctx.state === 'running') ctx.suspend(); } catch (e) { /* ignore */ } },
        resume: () => { if (settings.music || settings.sfx) ensureCtx(); if (cur) cur.next = 0; },
        setMusic: v => { settings.music = !!v; saveSettings(); if (v) ensureCtx(); if (cur) cur.next = 0; },
        setSfx: v => { settings.sfx = !!v; saveSettings(); if (v) ensureCtx(); },
        // music
        play: (name, then) => {
            if (cur && cur.name === name && !cur.done) return;
            startTrack(name);
            if (cur && then) cur.then = then;
        },
        stop: () => { cur = null; },
        current: () => (cur && !cur.done ? cur.name : ''),
        tick: () => {
            if (!cur || cur.done || !settings.music || !running()) return;
            const now = ctx.currentTime;
            if (cur.next < now - 0.3) cur.next = now + 0.05;
            let guard = 0;
            while (cur.next < now + 0.2 && guard++ < 24) {
                schedStep(cur, cur.next, cur.step);
                cur.next += cur.stepDur; cur.step++;
                if (cur.jingle && cur.step >= cur.total) {
                    const th = cur.then;
                    if (th) startTrack(th); else cur.done = true;
                    break;
                }
            }
        },
        // sfx
        drop: () => { if (gate('drop', 50)) tone(520, 'square', 0.07, 0.025, 320); },
        arc: () => { if (gate('arc', 50)) tone(300, 'triangle', 0.16, 0.05, 620); },

// Generated wave for endless mode: budget grows with the wave number; deterministic per wave.
function genEndlessWave(n) {
    const rr = mulberry32(n * 7919 + 13);
    const budget = 10 + n * 3.2;
    const menu = [['basic', 2, 1]];
    if (n >= 2) menu.push(['shield', 3, 1]);
    if (n >= 3) menu.push(['runner', 3, 1]);
    if (n >= 4) menu.push(['splitter', 5, 1]);
    if (n >= 5) menu.push(['sapper', 4, 0.7]);
    if (n >= 6) menu.push(['glider', 5, 1]);
    if (n >= 7) menu.push(['climber', 5, 0.9]);
    if (n >= 8) menu.push(['healer', 6, 0.6]);
    if (n >= 9) menu.push(['brute', 9, 0.7]);
    const groups = []; let spent = 0, t = 0, guard = 0;
    const boss = n % 10 === 0 ? (n % 20 === 0 ? 'siege' : 'yeti') : null;
    const target = boss ? budget * 0.5 : budget;
    while (spent < target && guard++ < 40) {
        const total = menu.reduce((s, m) => s + m[2], 0);
        let r = rr() * total, pick = menu[0];
        for (const m of menu) { if (r < m[2]) { pick = m; break; } r -= m[2]; }
        const cnt = Math.max(1, Math.min(6, Math.round((3 + rr() * 3) / Math.max(1, pick[1] / 2))));
        const side = rr() < 0.5 ? 'LR' : (rr() < 0.5 ? 'L' : 'R');
        const opt = { t, side, to: side === 'R' ? 0 : (side === 'L' ? 1 : [1, 0]), hp: n >= 12 ? 1 : 0 };
        if (pick[0] === 'sapper') opt.to = 0;   // pylon 0
        groups.push(g(pick[0], cnt, 1100 + rr() * 900, opt));
        spent += cnt * pick[1]; t += 1500 + rr() * 2500;
    }
    return { name: boss ? 'BOSS' : ('WAVE ' + n), boss, rest: n <= 1 ? 900 : 2800, left: 3, wait: 16000, g: groups };
}

/* ---------- terrain queries ---------- */
let TERR = [[0, 0], [1, 0]];
function terrH(x) {
    const t = TERR;
    if (x <= t[0][0]) return t[0][1];
    for (let i = 1; i < t.length; i++) {
        if (x <= t[i][0]) { const a = t[i - 1], b = t[i], k = (x - a[0]) / (b[0] - a[0] || 1); return a[1] + (b[1] - a[1]) * k; }
    }
    return t[t.length - 1][1];
}

    for (let i = 0; i < r.zonesT.length; i++) { const z = r.zonesT[i]; if (x >= z.a && x <= z.b) return z.k; }
    for (let i = 0; i < r.tz.length; i++) { const z = r.tz[i]; if (x >= z.a && x <= z.b) return z.k; }
    return null;
}

    r.ladders.forEach(l => { l.baseY = groundY(l.x); l.len = l.baseY - LADDER_TOP; });

/* ---------- waves, events, hints ---------- */

/* ---------- main step ---------- */
function stepRun() {

            if (e.boss === 'siege' && e.phase === 2 && (r.t - e.born) % 560 === 300) bossSummon(r, [['glider', 2, 900, 'R'], ['runner', 2, 500]]);
            if (e.boss === 'siege' && e.phase === 3 && (r.t - e.born) % 500 === 250) bossSummon(r, [['runner', 3, 500], ['sapper', 1, 500], ['glider', 1, 500, 'R']]);
            if (e.boss === 'yeti' && e.phase === 2 && (r.t - e.born) % 700 === 350) bossSummon(r, [['basic', 3, 700]]);

/* ==========================================================================
 * SECTION 7 - AUTO-PILOT AI (attract demo, AUTO mode and the headless test bot)
 * It plays like a careful human: it ranks threats by time-to-breach, picks a
 * weapon per target, parks the car on the shared intercept point, throws CC

 * little sloppy (aim noise, re-target delay) so it leaks now and then.

    if (px <= 0 || px >= LW) return null;

}

}

}

function aiThink(r) {

    if (AIP.lapse) {
        if (ai.lapseT > 0) { ai.lapseT--; return; }

    set('v-coin', 'co', String(r.coins));
    const hk = r.hp + '/' + r.maxHp;
    if (H.hp !== hk) {
        H.hp = hk; let h = ''; for (let i = 0; i < r.maxHp; i++) h += '<i class="' + (i < r.hp ? 'on' : '') + '"></i>';
        const el = $('v-hp'); el.innerHTML = h; el.classList.toggle('low', r.hp <= Math.ceil(r.maxHp * 0.34));
        if (H.hpLast !== undefined && r.hp < H.hpLast) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }

    if (H.combo !== ck) { H.combo = ck; cb.hidden = !ck; cb.textContent = ck ? 'COMBO ' + ck : ''; }
    // weapons
    const slots = $('weapons').children;
    for (let i = 0; i < 5; i++) {
        const s = slots[i], w = r.w[i], wd = WDEF[i], av = r.avail[i];
        const left = Math.max(0, r.cd[i] - r.t), rdy = av && left === 0;
        const pct = av ? Math.round(clamp(left / w.cdF, 0, 1) * 100) : 0;
        const key = [av, rdy, pct, ui.ccSel === i || (ui.ccSel < 0 && r.sel === i), r.aiUsed[i] > r.t, Math.ceil(left / 60), r.up[wd.id]].join('|');
        if (s._k === key) continue;
        s._k = key;
        s.classList.toggle('locked', !av); s.classList.toggle('ready', rdy);
        s.classList.toggle('active', ui.ccSel === i || (ui.ccSel < 0 && r.sel === i));
        s.classList.toggle('ai', r.aiUsed[i] > r.t && game.auto);
        s.querySelector('.cd').style.height = pct + '%';
        s.querySelector('.cdt').textContent = (!rdy && av && wd.cc) ? Math.ceil(left / 60) + '' : '';
        s.querySelector('.lv').textContent = av ? 'L' + r.up[wd.id] : 'S' + (UNLOCK_AT[i] + 1);
    }

}

/* ---------- flow: stages ---------- */
function stageMusic(st) { return st.music || 'st1'; }
function beginStage(idx) {
    hidePanels(); clearTimers();
    game.scene = 'stage'; game.mode = 'campaign'; game.stageIdx = idx; game.paused = false;
    // field repairs: after repeated losses on the same stage the cable starts a little stronger (no grinding needed)
    const bonus = Math.min(2, Math.floor((game.fails[idx] || 0) / 2));
    startRun(idx, { auto: game.auto });
    if (bonus) { run.maxHp += bonus; run.hp += bonus; }
    run.god = DBG.god; ui.ccSel = -1; ui.card = null; ui.hud = {};
    const st = run.st;
    if (bonus) toast('<b>Field repairs:</b> +' + bonus + ' cable point' + (bonus > 1 ? 's' : '') + ' after your last attempts', 300);
    run.banner = { text: 'STAGE ' + (idx + 1), sub: st.name, sub2: st.teach, t: 0, T: 160, color: '#f1c40f' };
    AudioEngine.play(stageMusic(st)); AudioEngine.banner();
    bgDirty = true; buildWeapons(); syncAutoBtn(); syncPauseBtn();
    announce('Stage ' + (idx + 1) + ': ' + st.name + '. ' + st.teach);
}
function beginEndless() {
    hidePanels(); clearTimers();
    game.scene = 'stage'; game.mode = 'endless'; game.stageIdx = -1; game.paused = false;
    startRun(-1, { endless: true, auto: game.auto });
    run.god = DBG.god; ui.ccSel = -1; ui.card = null; ui.hud = {};
    run.banner = { text: 'ENDLESS PEAKS', sub: 'Hold the line as long as you can', t: 0, T: 160, color: '#f1c40f' };
    AudioEngine.play('endless'); AudioEngine.banner();
    bgDirty = true; buildWeapons(); syncAutoBtn(); syncPauseBtn();
    announce('Endless mode');
}
function restartCurrent() { if (game.mode === 'endless') beginEndless(); else beginStage(Math.max(0, game.stageIdx)); }
function recommendedStage() {
    const c = clearedCount();
    return Math.min(STAGE_COUNT - 1, c);
}
function afterStageStep() {
    const r = run;
    if (!r || game.scene !== 'stage') return;
    if (r.cardQ.length && !ui.card && !r.over) showCard(r.cardQ.shift());
    if (r.hintQ.length) toast(r.hintQ.shift(), 330);
    if (!game.auto && r.sel === 0 && r.avail[1] && r.t - (ui.shieldHintT || -9999) > 1200 && r.t % 30 === 0 &&
        r.enemies.some(e => !e.dead && (e.shield || e.armorHp > 0 || e.air) && e.x > 0 && e.x < LW)) {
        ui.shieldHintT = r.t; toast('Shielded or flying target: press <b>2</b> for the <b>ARC</b> mortar', 240);
    }
    if (r.over) {
        if (r.overT === 2) { if (r.over === 'clear') { AudioEngine.play('victory', null); r.banner = { text: 'STAGE CLEAR', sub: '', t: 0, T: 130, color: '#86efac' }; } else r.banner = { text: 'CABLE CUT', sub: '', t: 0, T: 130, color: '#ef4444' }; }
        if (r.overT >= (r.over === 'clear' ? 130 : 110)) finishStage();
    }
}
function finishStage() {
    const r = run;
    if (game.mode === 'endless') return finishEndless();
    const res = stageResult(r);
    applyResult(r, res);
    game.scene = res.clear ? 'tally' : 'fail';
    game.fails[r.idx] = res.clear ? 0 : (game.fails[r.idx] || 0) + 1;
    if (res.clear) showTally(res); else showFail(res);
}

    ui.back = back; clearAuto();
    const touch = IS_TOUCH;
    const h = '<div class="card" style="width:min(560px,100%)"><h2>HOW TO PLAY</h2><div class="legend">' +
        '<p>Raiders march along the ground to a <b>ladder</b> and climb it. Every one that reaches the top <b>cuts the cable</b> (Brutes cut 3). Lose all cable points and the stage is lost.</p>' +
        '<p>Your <b>cable car</b> fires by itself when it lines up: <b>DROP</b> straight down, <b>ARC</b> lobbed from 180 px to either side. Position is your weapon.</p>' +
        '<p>' + (touch ? '<b>Drag</b> to steer (AUTO turns off) &middot; <b>tap a weapon</b>, then <b>tap the field</b> to throw Freeze / Pit / Sticky' : '<kbd>Mouse</kbd> steers when AUTO is off &middot; <kbd>1</kbd>-<kbd>5</kbd> pick a weapon &middot; <kbd>Click</kbd> throws Freeze / Pit / Sticky &middot; <kbd>A</kbd> auto-pilot &middot; <kbd>P</kbd> / <kbd>Esc</kbd> pause &middot; <kbd>M</kbd> menu') + '</p>' +
        '<p>Stages award <b>coins</b> and up to <b>3 stars</b>. Spend coins on upgrades. New weapons unlock as you clear stages. Beat all ten to unlock <b>Endless</b>.</p>' +
        '<p class="muted">Leave AUTO on and the game plays itself: the demo keeps looping through stages, the shop and the map.</p></div><div class="row"><button class="btn primary" data-act="back">BACK</button></div></div>';
    showPanel('howto', h, false);
}

/* ---------- ending / entry / endless over ---------- */
const STORY = [
    ['The last raider tumbles from Peak Station.', 'Silence settles over the mountain.'],
    ['Down in the valley the cable hums again.', 'The lifts run, the lanterns are lit.'],
    ['Beyond the ridge, the raiders\' war-camps still glow...', 'The Endless Peaks are waiting.']
];
const DAWN = { sky: ['#1b1440', '#7a3d6b', '#f4a261'], mtn: ['#3b2a5a', '#c98ba6'], glow: { x: 0.5, y: 0.5, r: 150, c: '255,205,150' }, stars: 0.12,
    ground: ['#ffe9d6', '#5b3f5e'], props: [['tower', 1, 0.96, 0.99], ['rock', 6, 0.3, 0.8], ['lamp', 5, 0.7, 1], ['pine', 8, 0, 0.5]], weather: 'flurry', wAmt: 30 };
function showEnding() {
    game.scene = 'ending'; clearTimers();
    // a calm victory scene behind the story cards: the summit at dawn, the car cruising, fireworks
    startRun(STAGE_COUNT - 1, { auto: false, avail: [true, true, true, true, true] });
    run.st = Object.assign({}, run.st, { theme: DAWN, vis: null, events: [], hints: [] });
    run.enemies = []; run.spawnQ = []; run.wave = 999; run.waveCount = 0; run.hints = []; run.banner = null;
    run.car.x = run.car.tx = run.carMin + 40; bgDirty = true; ui.hud = {};
    AudioEngine.play('ending');
    ui.ending = { slide: 0, t: 0 };
    renderEnding();
    announce('Campaign complete.');
}
function renderEnding() {
    const e = ui.ending, last = e.slide >= STORY.length;
    let h;
    if (!last) {
        h = '<div class="card pop" style="width:min(560px,100%);min-height:200px;display:flex;flex-direction:column;justify-content:center"><h2 style="font-size:26px">' + esc(STORY[e.slide][0]) + '</h2><p style="font-size:17px">' + esc(STORY[e.slide][1]) + '</p><div class="row"><button class="btn" data-act="eskip">SKIP</button></div></div>';
    } else {
        const sc = campaignScore();
        h = '<div class="card pop" style="width:min(520px,100%)"><h1>CABLE SECURED</h1><p>All ten stages held. The mountain is yours.</p><div class="stars" style="margin:6px 0">' + starsHtml(Math.min(3, Math.floor(totalStars() / 10)), false) + '</div>' +
            '<div class="kv"><span>Stars</span><span>' + totalStars() + ' / 30</span><span>Campaign score</span><span>' + sc + '</span><span>Coins banked</span><span>' + save.coins + '</span></div>' +
            '<p><span class="tag new">ENDLESS PEAKS UNLOCKED</span></p><div class="row"><button class="btn primary" data-act="econt">CONTINUE</button></div><div class="auto-note" id="auto-note"></div></div>';
        setAuto(8, () => endingDone(), 'Continuing');
    }
    showPanel('ending', h, true);
}
function endingDone() {
    const sc = campaignScore();
    if (scoreQualifies(sc)) showEntry(sc, 'CAM', 'ALL10', () => showMap());
    else showMap();
}
function showEntry(score, mode, detail, next) {
    game.scene = 'entry'; ui.entry = { score, mode, detail, next };
    AudioEngine.play('ending');
    const h = '<div class="card pop" style="width:min(440px,100%)"><h2>NEW HIGH SCORE</h2><div class="coins">' + score + '</div><p>Enter your initials</p>' +
        '<input class="name" id="name-in" maxlength="3" value="' + esc(save.lastName) + '" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Your initials">' +
        '<div class="row"><button class="btn primary" data-act="esubmit">SAVE</button></div><div class="auto-note" id="auto-note"></div></div>';
    showPanel('entry', h, false);
    const inp = $('name-in'); if (inp) { try { inp.focus(); inp.select(); } catch (e) { /* ignore */ } }
    setAuto(6, () => submitEntry(true), 'Saving');
}
function submitEntry(auto) {
    const en = ui.entry; if (!en) return;
    let name = ($('name-in') ? $('name-in').value : save.lastName).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 3);
    if (!name) name = 'AAA';
    if (auto && game.auto) name = save.lastName || 'CPU';
    save.lastName = name; persist();
    ui.hiIndex = addScore(name, en.score, en.mode, en.detail);
    ui.entry = null;
    AudioEngine.confirm();
    const nx = en.next; nx();
}
function finishEndless() {
    const r = run;
    const waves = Math.max(0, r.wave);
    const coins = Math.floor(r.coins * 0.6) + waves * 12;
    save.coins += coins;
    const prevBest = save.endless.score;
    if (r.score > save.endless.score) save.endless.score = r.score;
    if (waves > save.endless.wave) save.endless.wave = waves;
    save.plays++; persist();
    game.scene = 'endover';
    AudioEngine.play('defeat', 'map');
    ui.endOver = { waves, score: r.score, coins, newBest: r.score > prevBest };
    const h = '<div class="card pop" style="width:min(480px,100%)"><h1 style="color:var(--danger)">CABLE CUT!</h1><p>Endless Peaks</p><div class="kv"><span>Waves held</span><span>' + waves + '</span><span>Score</span><span>' + r.score + (ui.endOver.newBest ? ' NEW BEST' : '') + '</span><span>Best wave</span><span>' + save.endless.wave + '</span><span class="gold">Coins</span><span class="gold">+' + coins + '</span></div>' +
        '<div class="row"><button class="btn primary" data-act="eretry">TRY AGAIN</button><button class="btn" data-act="eshop">UPGRADES</button><button class="btn" data-act="emap">MAP</button></div><div class="auto-note" id="auto-note"></div></div>';
    showPanel('endover', h, true);
    const go = () => beginEndless();
    const after = () => { setAuto(6, () => { if (game.auto) aiShop(); go(); }, 'Restarting'); };
    if (scoreQualifies(r.score)) setAuto(2.5, () => showEntry(r.score, 'END', 'W' + waves, () => { game.scene = 'endover'; showPanel('endover'); after(); }), 'Recording score');
    else after();
}

/* ---------- click dispatcher ---------- */
const ACT = {
    cardok() { dismissCard(); },
    resume() { resumeFromMenu(); },
    restart() { restartCurrent(); },
    menumap() { showMap(true); },
    menushop() { openShop(() => { game.scene = 'stage'; openMenu(); }, true); },
    menuscores() { openScores(() => openMenu()); },
    menusettings() { openSettings(() => openMenu()); },
    menuhow() { openHowTo(() => openMenu()); },
    tnext() { tallyNext(); },
    treplay() { beginStage(run.idx); },
    tmap() { showMap(); },
    fretry() { beginStage(run.idx); },
    fshop() { openShop(() => showMap()); },
    fmap() { showMap(); },
    buy(btn) {
        const id = btn.dataset.id;
        if (buyUpgrade(id)) { AudioEngine.buy(); renderShop([id]); } else AudioEngine.deny();
    },
    shopnext() { ui.back(); },
    msel(btn) {
        const i = parseInt(btn.dataset.i, 10);
        if (!stageUnlocked(i)) { AudioEngine.deny(); toast('Clear the previous stage to unlock this one.', 160); return; }
        ui.mapSel = i; AudioEngine.select(); renderMap();
    },
    mstart() { AudioEngine.confirm(); beginStage(ui.mapSel); },
    mshop() { openShop(() => showMap(ui.mapBack)); },
    mscores() { openScores(() => showMap(ui.mapBack)); },
    msettings() { openSettings(() => showMap(ui.mapBack)); },
    mendless() { if (save.done) beginEndless(); },
    mback() { game.scene = 'stage'; openMenu(); },
    back() { AudioEngine.back(); ui.back(); },
    tmusic() { AudioEngine.setMusic(!settings.music); syncSoundBtns(); openSettings(ui.back); },
    tsfx() { AudioEngine.setSfx(!settings.sfx); syncSoundBtns(); openSettings(ui.back); if (settings.sfx) AudioEngine.select(); },
    tshake() { settings.shake = !settings.shake; saveSettings(); openSettings(ui.back); },
    tauto() { setAutoMode(!game.auto); openSettings(ui.back); },
    reset1() {
        if (ui.resetArm === 'p') { ui.resetArm = ''; resetSave(false); ui.mapSel = 0; game.pendingReset = true; toast('Progress reset.', 200); beginStage(0); }
        else { ui.resetArm = 'p'; ui.resetArmT = 240; openSettings(ui.back); }
    },
    reset2() {
        if (ui.resetArm === 'a') { ui.resetArm = ''; resetSave(true); ui.hiIndex = -1; toast('All data erased.', 200); beginStage(0); }
        else { ui.resetArm = 'a'; ui.resetArmT = 240; openSettings(ui.back); }
    },
    eskip() { ui.ending.slide = STORY.length; renderEnding(); },
    econt() { endingDone(); },
    esubmit() { submitEntry(false); },
    eretry() { beginEndless(); },
    eshop() { openShop(() => { game.scene = 'endover'; beginEndless(); }); },
    emap() { showMap(); }
};
$('panels').addEventListener('click', e => {
    const b = e.target.closest && e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    userTouched();
    AudioEngine.prime();
    const f = ACT[b.dataset.act];
    if (f) f(b);
});
$('panels').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'name-in') { e.preventDefault(); submitEntry(false); }
});

/* ---------- per-tick scene logic ---------- */
function sceneTick() {
    autoTick();
    document.body.classList.toggle('cine', game.scene === 'ending');
    if (ui.resetArmT > 0 && --ui.resetArmT === 0) { ui.resetArm = ''; if (ui.panel === 'settings') openSettings(ui.back); }
    if (game.scene === 'ending' && ui.ending && ui.ending.slide < STORY.length) {
        if (++ui.ending.t > 300) { ui.ending.t = 0; ui.ending.slide++; renderEnding(); }
    }
    // ambient: keep the last scene animating behind the panels
    if (run) {
        updateFx(run);
        if (game.scene === 'ending') {
            run.t++;
            const c = run.car;
            if (run.t % 240 === 0) c.tx = c.tx > (run.carMin + run.carMax) / 2 ? run.carMin + 40 : run.carMax - 40;
            c.prevX = c.x; c.x += clamp((c.tx - c.x) * 0.02, -2.5, 2.5); c.vx = c.x - c.prevX;
            if (run.t % 34 === 0) {
                const fx = LW * (0.15 + Math.random() * 0.7), fy = 110 + Math.random() * 190, col = ['#fde047', '#f472b6', '#67e8f9', '#a7f3d0', '#fca5a5'][(Math.random() * 5) | 0];
                spark(run, fx, fy, col, 38, 5, 46); ring(run, fx, fy, col, 70, 22); AudioEngine.pop();
            }
        }
    }
}

/* ==========================================================================
 * SECTION 10 - INPUT, MAIN LOOP, DEBUG HOOKS, BOOT
 * ========================================================================== */
const ptr = { id: null, sx: 0, sy: 0, moved: false, type: 'mouse', t0: 0 };
function setCarTarget(x) { if (run) run.car.tx = clamp(x, run.carMin, run.carMax); }
function stageLive() { return game.scene === 'stage' && run && !run.over && !game.paused && !ui.card; }

// click / tap on the field: throw the armed CC weapon; in manual mode also a forced shot with Drop/Arc
function handleTap(x) {
    if (!stageLive()) return;
    const r = run;
    if (ui.ccSel >= 2) {
        const wi = ui.ccSel;
        if (fire(r, wi, x)) { ui.ccSel = -1; }
        else { AudioEngine.deny(); toast('<b>' + WDEF[wi].name + '</b> is recharging', 90); }
    } else if (!game.auto) {
        if (r.sel === 1) fire(r, 1, x);
        else { setCarTarget(x); fire(r, 0, x); }
    }
}
canvas.addEventListener('pointerdown', e => {
    userTouched(); AudioEngine.prime();
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    ptr.id = e.pointerId; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.moved = false; ptr.type = e.pointerType; ptr.t0 = performance.now();
    ui.ptrX = toWorldX(e.clientX);
    if (e.pointerType !== 'mouse') { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ } }
});
canvas.addEventListener('pointermove', e => {
    userTouched();
    ui.ptrX = toWorldX(e.clientX);
    if (!stageLive()) return;
    if (e.pointerType === 'mouse') {
        if (!game.auto) setCarTarget(ui.ptrX);
        return;
    }
    if (ptr.id !== e.pointerId) return;
    if (!ptr.moved && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 8) {
        ptr.moved = true;
        if (game.auto) setAutoMode(false);
    }
    if (ptr.moved) setCarTarget(ui.ptrX);
});
function endPtr(e, cancel) {
    if (ptr.id !== e.pointerId) return;
    const wasTap = !ptr.moved && !cancel;
    ptr.id = null;
    if (wasTap) handleTap(toWorldX(e.clientX));
    if (e.pointerType !== 'mouse') ui.ptrX = -1;
}
canvas.addEventListener('pointerup', e => endPtr(e, false));
canvas.addEventListener('pointercancel', e => endPtr(e, true));
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') ui.ptrX = -1; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    userTouched(); AudioEngine.prime();
    if (e.target && e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (k === 'p' || k === 'P' || k === 'Escape') {
        if (e.repeat) return;
        if (ui.card) { dismissCard(); e.preventDefault(); return; }
        if ((ui.panel === 'scores' || ui.panel === 'settings' || ui.panel === 'howto' || ui.panel === 'shop' || (ui.panel === 'map' && ui.mapBack)) && (ui.back || ui.mapBack)) {
            e.preventDefault();
            if (ui.panel === 'map') ACT.mback(); else if (ui.back) ui.back();
            return;
        }
        if (game.scene === 'stage' && run && !run.over) { togglePause(); e.preventDefault(); return; }
        return;
    }
    if (ui.card && (k === 'Enter' || k === ' ')) { e.preventDefault(); dismissCard(); return; }
    if (!stageLive()) return;
    if (k >= '1' && k <= '5') { selectWeapon(parseInt(k, 10) - 1); return; }
    if (k === 'a' || k === 'A') { setAutoMode(!game.auto); return; }
    if (k === 'm' || k === 'M') { openMenu(); return; }
    if ((k === ' ' || k === 'Enter') && !(e.target && e.target.closest && e.target.closest('button'))) {
        e.preventDefault();
        if (!game.auto) {
            if (ui.ccSel >= 2) { if (fire(run, ui.ccSel, run.car.tx)) ui.ccSel = -1; }
            else fire(run, run.sel, run.car.tx);
        }
    }
});
window.addEventListener('blur', () => { if (game.scene === 'stage' && run && !run.over && !game.paused && !ui.card) togglePause(true); });
document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (game.scene === 'stage' && run && !run.over && !game.paused) togglePause(true); AudioEngine.suspend(); }
    else { lastFrame = null; AudioEngine.resume(); }
});
window.addEventListener('resize', () => { if (!layoutPending) { layoutPending = true; requestAnimationFrame(() => { layoutPending = false; layout(); }); } });
let layoutPending = false;
['pointerdown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, () => AudioEngine.prime(), { passive: true }));

function bindHud() {
    const hb = (id, fn) => $(id).addEventListener('click', e => { userTouched(); AudioEngine.prime(); fn(); e.currentTarget.blur(); });
    hb('btn-auto', () => { if (stageLive() || game.scene === 'stage') setAutoMode(!game.auto); else { game.auto = !game.auto; syncAutoBtn(); } });
    hb('btn-pause', () => togglePause());
    hb('btn-menu', () => { if (game.scene === 'stage') { if (game.paused && ui.panel !== 'menu') return; if (game.paused) resumeFromMenu(); else openMenu(); } });
    hb('btn-music', () => { AudioEngine.setMusic(!settings.music); syncSoundBtns(); });
    hb('btn-sfx', () => { AudioEngine.setSfx(!settings.sfx); syncSoundBtns(); AudioEngine.select(); });
    $('weapons').addEventListener('click', e => {
        const b = e.target.closest('.wslot'); if (!b) return;
        AudioEngine.prime(); selectWeapon(parseInt(b.dataset.i, 10)); b.blur();
    });
    $('weapons').addEventListener('pointerdown', e => e.stopPropagation());
}

/* ---------- main loop (fixed 60 Hz simulation) ---------- */
let lastFrame = null, acc = 0;
function tick() {
    ui.idle++;
    if (game.scene === 'stage' && run) {
        if (ui.card) {
            ui.cardT--;
            if (ui.cardT <= 0 && (game.auto || ui.idle > 600)) dismissCard();
            return;
        }
        if (game.paused) return;
        stepRun();
        afterStageStep();
    } else sceneTick();
}
function loop(ts) {
    if (lastFrame === null) lastFrame = ts;
    let dt = ts - lastFrame; lastFrame = ts;
    if (dt > 250) dt = 250;
    acc += dt * DBG.speed;
    let n = 0;
    const cap = MAX_STEPS * Math.ceil(DBG.speed);
    while (acc >= FRAME_MS && n < cap) { tick(); acc -= FRAME_MS; n++; }
    if (n >= cap) acc = 0;
    try { updateHud(); render(); AudioEngine.tick(); } catch (err) { console.error(err); }
    requestAnimationFrame(loop);
}

/* ---------- debug hooks: only exist when a debug URL parameter is present ---------- */
function installDebug() {
    window.__cable = {
        game, ui, DBG, STAGES, BOSSES, EDEF, UPGRADES, WDEF,
        spawnEnemy, spawnBoss, addStrike, addAvalanche, hitCable, fire, showCard, dismissCard, showTally, showFail, interceptX, aiShop, groundY, layout,
        get run() { return run; }, get save() { return save; }, get view() { return view; }, get LW() { return LW; },
        step(n) { for (let i = 0; i < (n || 1); i++) tick(); },
        beginStage, beginEndless, showMap, openShop, showEnding, showEntry, finishStage, aiShop, buyUpgrade, stageResult, applyResult, openMenu, togglePause,
        setSave(fn) { fn(save); persist(); },
        // headless simulation of one stage with the bot; restores the live run afterwards
        simStage(idx, o) {
            o = o || {};
            const keepRun = run, keepSim = game.sim, keepAuto = game.auto;
            game.sim = true;
            startRun(idx, { seed: o.seed || 1, auto: true, god: o.god });
            const maxF = (o.maxSec || 420) * 60; let maxEn = 0, maxSh = 0, maxPt = 0, nan = 0;
            while (!run.over && run.t < maxF) {
                stepRun();
                maxEn = Math.max(maxEn, run.enemies.length); maxSh = Math.max(maxSh, run.shots.length); maxPt = Math.max(maxPt, run.parts.length);
                if (run.t % 120 === 0) { if (!isFinite(run.car.x)) nan++; for (const e of run.enemies) if (!isFinite(e.x + e.y + e.hp)) nan++; }
            }
            const out = { over: run.over || 'timeout', t: Math.round(run.t / 60), dmg: run.dmg, hp: run.hp, kills: run.kills, coins: run.coins, score: run.score, maxEn, maxSh, maxPt, nan, res: stageResult(run) };
            run = keepRun; game.sim = keepSim; game.auto = keepAuto;
            return out;
        }
    };
}

/* ---------- boot ---------- */
let booted = false;
function boot() {
    if (booted) return; booted = true;
    loadSave();
    if (DBG.stage > 0) { for (let i = 0; i < DBG.stage - 1 && i < STAGE_COUNT; i++) if (!save.stages[i]) save.stages[i] = { stars: 1, best: 0, clears: 1, bestTime: 0 }; }
    game.auto = !DBG.manual;
    buildPanels(); buildWeapons(); bindHud();
    syncSoundBtns(); syncAutoBtn();
    layout();
    if (DBG.on || PARAMS.get('debug') === '1') installDebug();
    // No title gate: the page starts playing immediately (fresh save -> Stage 1, otherwise the next stage to beat).
    if (DBG.endless) beginEndless();
    else beginStage(DBG.stage > 0 ? Math.min(STAGE_COUNT, DBG.stage) - 1 : frontier());
    requestAnimationFrame(loop);
}
window.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();
